function fit(){fitW=innerWidth;fitH=innerHeight;const s=Math.max(0.1,Math.min(innerWidth/W,innerHeight/H)),dpr=window.devicePixelRatio||1;SCALE=Math.max(1,Math.min(s*dpr,3));cv.width=Math.round(W*SCALE);cv.height=Math.round(H*SCALE);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}

const lerp=(a,b,p)=>a+(b-a)*p;
const easeIn=(a,b,p)=>a+(b-a)*p*p;
const easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick=(arr,rnd)=>arr[Math.floor((rnd||Math.random)()*arr.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return`rgb(${r},${g},${b})`;}
function fmtTime(s){const m=Math.floor(s/60),ss=Math.floor(s%60),cs=Math.floor((s*100)%100);return m+':'+String(ss).padStart(2,'0')+'.'+String(cs).padStart(2,'0');}

function lastY(){return segments.length?segments[segments.length-1].p2.world.y:0;}
function addSeg(curve,y){const n=segments.length;segments.push({index:n,p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y:y,z:(n+1)*SEG},camera:{},screen:{}},curve,decor:[],coins:[],boxes:[],dyn:[],clip:0,vis:false});}
function addRoad(e,h,l,curve,hill){const sy=lastY(),ey=sy+hill*SEG,t=e+h+l;
 for(let n=0;n<e;n++)addSeg(easeIn(0,curve,n/e),easeInOut(sy,ey,n/t));
 for(let n=0;n<h;n++)addSeg(curve,easeInOut(sy,ey,(e+n)/t));
 for(let n=0;n<l;n++)addSeg(easeInOut(curve,0,n/l),easeInOut(sy,ey,(e+h+n)/t));}

function buildTrack(ti,mirror){
 const tr=TRACKS[ti];theme=THEMES[tr.theme];segments=[];
 const f=tr.f,m=mirror?-1:1;
 for(const p of tr.pieces)addRoad(Math.round(p[0]*f),Math.round(p[1]*f),Math.round(p[2]*f),p[3]*m,p[4]);
 const y=lastY();if(Math.abs(y)>1)addRoad(30,20,30,0,-y/SEG);
 addRoad(0,40,0,0,0);
 trackLen=segments.length*SEG;
 const rnd=mulberry(ti*977+31),L=segments.length;
 allCoins=[];allBoxes=[];
 for(let i=10;i<L;i++){
  const s=segments[i];
  const far=t=>t==='pyramid'||t==='building';
  if(i%7===0){const side=rnd()<0.5?-1:1;const t=pick(theme.decor,rnd);s.decor.push({t,x:side*(far(t)?2.6+rnd()*2:1.4+rnd()*2.2),h:rnd()});}
  if(i%13===0&&rnd()<0.7){const t=pick(theme.decor,rnd);s.decor.push({t,x:(rnd()<0.5?-1:1)*(far(t)?3+rnd()*2:1.5+rnd()*2.5),h:rnd()});}
  if(Math.abs(s.curve)>2.5&&i%18===0)s.decor.push({t:'sign',x:-Math.sign(s.curve)*1.3,dir:Math.sign(s.curve)});
 }
 for(let i=80;i<L-60;i+=Math.floor(90+rnd()*70)){
  const off=rnd()*1.4-0.7,dir=rnd()<0.5?0:(rnd()*0.06-0.03);
  for(let k=0;k<6;k++){const c={x:clamp(off+dir*k*3,-0.85,0.85),taken:0};segments[i+k*3].coins.push(c);allCoins.push(c);}
 }
 for(const fr of[0.1,0.33,0.57,0.8]){const s=segments[Math.floor(L*fr)];s.boxes=[-0.66,-0.22,0.22,0.66].map(x=>({x,t:0}));allBoxes.push(...s.boxes);}
 // turbos en el piso y rampas
 let ramps=0;

 }

  const z=SEG*(150+(i+rnd()*0.5)*(L-260)/n);

 }}
}
function wrapZ(z){return((z%trackLen)+trackLen)%trackLen;}
function wrapD(d){d=((d%trackLen)+trackLen)%trackLen;return d>trackLen/2?d-trackLen:d;}
function fwd(a,b){return((b-a)%trackLen+trackLen)%trackLen;}

function computeMap(){
 let S=0;for(const s of segments)S+=s.curve;
 const K=Math.abs(S)>150?Math.PI*2/S:0.004;
 let a=-Math.PI/2,x=0,y=0;const pts=[];
 for(const s of segments){a+=s.curve*K;x+=Math.cos(a);y+=Math.sin(a);pts.push([x,y]);}
 const N=pts.length,ex=pts[N-1][0],ey=pts[N-1][1];
 pts.forEach((p,i)=>{p[0]-=ex*(i+1)/N;p[1]-=ey*(i+1)/N;});
 let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
 for(const p of pts){mnx=Math.min(mnx,p[0]);mny=Math.min(mny,p[1]);mxx=Math.max(mxx,p[0]);mxy=Math.max(mxy,p[1]);}
 const sc=Math.min(136/((mxx-mnx)||1),136/((mxy-mny)||1));
 const ox=(156-(mxx-mnx)*sc)/2,oy=(156-(mxy-mny)*sc)/2;
 map=pts.map(p=>[ox+(p[0]-mnx)*sc,oy+(p[1]-mny)*sc]);
}

  boost:0,spin:0,star:0,shrink:0,bullet:0,invul:0,hop:0,goldenT:0,ghostT:0,ink:0,meter:0,pwT:0,pwType:'',frozenT:0,laserT:0,teleT:0,hornT:0,air:0,airMax:1,trick:false,trickT:0,lapTimes:[],lapStart:0,drift:0,driftCharge:0,driftLvl:0,steerVis:0,rescue:0,
  finished:false,finishTime:0,place:1,lastPlace:1,placeT:0,
  top:MAXS*cc.mul*(0.88+0.03*st.spd),accR:MAXS*cc.mul*(0.16+0.055*st.acc),han:1.8+0.22*st.han,wgt:st.wgt,
  ai:{t:0,tx:0,skill:(demo?0.93:cc.ai*DIFF[menu.diff].speed)*(0.95+Math.random()*0.06),mul:1,useT:2}};

function makeDummy(ch,kt){return{ch,kt,pwT:0,pwType:'',frozenT:0,laserT:0,teleT:0,ghostT:0,hornT:0,air:0,trickT:0,goldenT:0,hop:0,drift:0,spin:0,star:0,boost:0,invul:0,bullet:0,rescue:0,shrink:0,driftLvl:0,steerVis:Math.sin(T*2)*0.6};}
function showMsg(r,m,t){r.msg=m;r.msgT=t;}
function sparkle(r){const s=r.scr;for(let i=0;i<6;i++)addPart(s.x+(Math.random()-0.5)*s.w*0.5,s.y-s.w*0.6,(Math.random()-0.5)*200,-150-Math.random()*200,0.6,'#ffd23a',5);}
function leadHuman(){let b=null;for(const p of players)if(!b||prog(p)>prog(b))b=p;return b;}

function rollItem(place){
 const b=place===1?0:place<=3?1:place<=6?2:3,tb=ITEM_TABLE[b];let tot=0;for(const k in tb)tot+=tb[k];
 let x=Math.random()*tot;for(const k in tb){x-=tb[k];if(x<=0)return k;}return'banana';
}
function mkProj(type,owner,z,x,o){o=o||{};return{type,owner,z:wrapZ(z),x,speed:o.speed||0,vx:o.vx||0,target:o.target||null,life:o.life||40,age:0};}
function useItem(r){
 if(!r.item||r.roulette>0)return;
 const it=r.item,pl=r.isPlayer;
 switch(it){
  case 'mushroom':case 'triple':r.boost=Math.max(r.boost,1.3);if(pl)SFX.boost();break;
  case 'golden':r.boost=Math.max(r.boost,0.9);if(r.goldenT<=0)r.goldenT=7;r.itemCount=99;if(pl)SFX.boost();break;
  case 'banana':case 'triple_banana':projs.push(mkProj('banana',r,r.z-260,r.x));if(pl)SFX.throw();break;
  case 'green':case 'triple_green':projs.push(mkProj('green',r,r.z+300,r.x,{speed:Math.max(r.speed,0)+MAXS*0.75,vx:(Math.random()-0.5)*0.3,life:6}));if(pl)SFX.throw();break;
  case 'bomb':projs.push(mkProj('bomb',r,r.z+300,r.x,{speed:Math.max(r.speed,0)+MAXS*0.45,life:3}));if(pl)SFX.throw();break;
  case 'blooper':
   for(const o of racers)if(o!==r&&o.place<r.place){o.ink=4.5;if(o.isPlayer&&!race.demo)showMsg(o,'¡TINTA!',1.2);}
   if(pl||players.some(h=>h.place<r.place))tone(300,0.4,'sine',0.15,120);break;
  case 'boo':{
   const vict=racers.filter(o=>o!==r&&o.item&&o.roulette<=0&&o.goldenT<=0);
   const v=vict.length?vict[Math.floor(Math.random()*vict.length)]:null;
   r.ghostT=3.5;r.item=null;r.itemCount=0;
   if(v){r.item=v.item;r.itemCount=v.itemCount;v.item=null;v.itemCount=0;if(v.isPlayer&&!race.demo)showMsg(v,'¡BOO TE ROBÓ!',1.5);}
   else{r.item=rollItem(r.place);r.itemCount=ITEM_COUNT[r.item]||1;}
   if(pl)tone(500,0.5,'sine',0.12,900);
   return;}
  case 'horn':
   r.hornT=0.5;
   for(const p of projs)if(p.type!=='boom'&&p.owner!==r&&Math.abs(wrapD(p.z-r.z))<900)p.life=0;
   for(const o of racers)if(o!==r&&Math.abs(wrapD(o.z-r.z))<550&&Math.abs(o.x-r.x)<0.6)hitRacer(o,'horn');
   if(pl||!race.demo)tone(160,0.6,'sawtooth',0.18,140);break;
  case 'red':{const tgt=r.place>1?ranking[r.place-2]:null;projs.push(mkProj(tgt?'red':'green',r,r.z+300,r.x,{speed:Math.max(r.speed,0)+MAXS*0.8,target:tgt,life:8}));if(pl)SFX.throw();break;}
  case 'blue':projs.push(mkProj('blue',r,r.z+300,r.x,{life:25}));if(pl)SFX.throw();break;
  case 'star':r.star=7;if(pl)SFX.star();break;
  case 'lightning':
   for(const o of racers)if(o!==r&&o.star<=0&&o.bullet<=0&&o.rescue<=0){o.shrink=4;o.spin=Math.max(o.spin,0.8);o.speed*=0.5;o.item=null;o.roulette=0;o.drift=0;o.driftLvl=0;}
   race.flash=0.5;SFX.thunder();if(!race.demo)for(const h of players)if(h!==r)showMsg(h,'¡RAYO!',1.2);break;
  case 'bullet':r.bullet=3.5;r.drift=0;r.driftLvl=0;if(pl)SFX.boost();break;
  case 'coin':r.coins=Math.min(10,r.coins+2);if(pl)SFX.coin();break;
 }
 r.itemCount--;if(r.itemCount<=0){r.item=null;r.itemCount=0;}
}
function hitRacer(r,kind){
 if(r.invul>0||r.rescue>0||isSafe(r))return false;
 const big=kind==='blue';
 r.spin=big?1.8:1.1;r.speed*=big?0.05:0.35;r.coins=Math.max(0,r.coins-(big?3:2));r.drift=0;r.driftLvl=0;r.invul=r.spin+0.5;r.boost=0;
 if(r.isPlayer&&!race.demo){r.shake=0.4;SFX.hit();for(let i=0;i<10;i++)addPart(r.scr.x,r.scr.y-r.scr.w*0.4,(Math.random()-0.5)*400,-200-Math.random()*300,0.8,'#ffd23a',5);}
 return true;
}
// ---- súper poderes ----
const flying=o=>o.pwT>0&&(o.pwType==='fly'||o.pwType==='acro');
function isSafe(o){return o.star>0||o.bullet>0||o.ghostT>0||(o.pwT>0&&['fly','acro','shield','giant','spin','ssj'].includes(o.pwType));}
function smasher(o){return o.star>0||o.bullet>0||(o.pwT>0&&['giant','spin','acro','ssj'].includes(o.pwType));}
function activatePower(r){
 if(r.meter<1||r.pwT>0||r.spin>0||r.rescue>0||r.frozenT>0)return;
 const P=POWERS[r.ch.id]||POWERS.toad,t=P[0],pl=r.isPlayer&&!race.demo;
 r.meter=0;r.pwT=PW_DUR[t]||0;r.pwType=r.pwT>0?t:'';
 if(pl){SFX.power();showMsg(r,'¡'+P[1].toUpperCase()+'!',1.4);}
 switch(t){
  case 'fly':case 'acro':r.drift=0;r.driftLvl=0;break;
  case 'dash':r.boost=Math.max(r.boost,2.2);break;
  case 'ghost':r.ghostT=4;break;
  case 'fire':{const ty=r.ch.id==='birdo'?'egg':'fire';for(const dx of[-0.28,0,0.28])projs.push(mkProj(ty,r,r.z+300,clamp(r.x+dx,-1,1),{speed:Math.max(r.speed,0)+MAXS*0.9,vx:dx*0.4,life:2.5}));break;}
  case 'shock':r.hornT=0.5;for(const o of racers)if(o!==r&&Math.abs(wrapD(o.z-r.z))<900&&Math.abs(o.x-r.x)<1)hitRacer(o,'shock');if(!race.demo)SFX.boom();break;
  case 'magnet':r.coins=Math.min(10,r.coins+5);r.boost=Math.max(r.boost,1);if(pl){SFX.coin();sparkle(r);}break;
  case 'freeze':for(const o of racers)if(o!==r&&o.place<r.place&&fwd(r.z,o.z)<9000&&!isSafe(o)){o.frozenT=1.8;o.speed*=0.3;o.drift=0;o.driftLvl=0;if(o.isPlayer&&!race.demo)showMsg(o,'¡CONGELADO!',1.2);}break;
  case 'laser':case 'kame':{r.laserT=0.7;let n=0;for(let i=r.place-2;i>=0&&n<2;i--){const o=ranking[i];if(o&&o!==r&&fwd(r.z,o.z)<12000&&hitRacer(o,'laser'))n++;}if(!race.demo)tone(1200,0.5,'sawtooth',0.12,300);break;}
  case 'tele':r.teleT=0.6;r.z+=1800;if(r.z>=trackLen){r.z-=trackLen;r.lap++;onLap(r);}r.x=clamp(r.x,-0.8,0.8);r.invul=Math.max(r.invul,0.5);break;
 }
}
function onLap(r){
 if(r.lap<=r.maxLap)return;r.maxLap=r.lap;if(race.demo)return;
 if(r.isPlayer&&r.lap>=2){r.lapTimes.push(race.time-r.lapStart);r.lapStart=race.time;}
 if(r.lap>LAPS&&!r.finished){r.finished=true;r.finishTime=race.time;if(r.isPlayer)playerFinished(r);return;}
 if(r.isPlayer){
  if(r.lap===LAPS){showMsg(r,'¡ÚLTIMA VUELTA!',2.2);SFX.last();music.rate=1.12;}
  else if(r.lap>1){showMsg(r,'VUELTA '+r.lap,1.5);SFX.lap();}
 }
}
function playerFinished(r){
 showMsg(r,'¡META! '+racers.filter(x=>x.finished).length+'º',3);SFX.finish();
 if(players.every(p=>p.finished)){race.phase='done';race.doneT=0;music.rate=1;}
}

function pickups(r,z0,z1){
 const L=segments.length;const i=Math.floor(wrapZ(z0)/SEG),j=Math.floor(wrapZ(z1)/SEG);let n=(j-i+L)%L;if(n>6)n=6;
 for(let k=0;k<=n;k++){
  const s=segments[(i+k)%L];
  if(s.pad!==undefined&&Math.abs(r.x-s.pad)<0.22&&r.boost<0.8){r.boost=Math.max(r.boost,0.9);if(r.isPlayer&&!race.demo)SFX.boost();}
  if(s.ramp&&r.air<=0&&r.speed>MAXS*0.3){r.air=r.airMax=0.6+0.3*Math.min(1.3,r.speed/MAXS);r.drift=0;r.driftLvl=0;
   if(r.isPlayer&&!race.demo)tone(400,0.25,'square',0.08,800);
   else if(!r.isPlayer&&Math.random()<0.6){r.trick=true;r.trickT=0.4;}}
  for(const c of s.coins)if(c.taken<=0&&Math.abs(c.x-r.x)<0.13){c.taken=10;if(r.coins<10)r.coins++;r.meter=Math.min(1,r.meter+0.06);if(r.isPlayer&&!race.demo){SFX.coin();sparkle(r);}}
  for(const b of s.boxes)if(b.t<=0&&Math.abs(b.x-r.x)<0.16){
   b.t=2.5;
   if(!r.item&&r.roulette<=0){r.roulette=r.isPlayer?1.3:0.8;r.pending=rollItem(r.place);if(!r.isPlayer&&dif().noMean&&['blue','lightning','bullet'].includes(r.pending))r.pending='mushroom';r.ai.useT=dif().useMin+Math.random()*dif().useRand;if(r.isPlayer&&!race.demo)SFX.box();}
  }
 }
}

function updateRacer(r,inp,dt){
 r.boost=Math.max(0,r.boost-dt);r.star=Math.max(0,r.star-dt);r.shrink=Math.max(0,r.shrink-dt);r.bullet=Math.max(0,r.bullet-dt);
 r.invul=Math.max(0,r.invul-dt);r.spin=Math.max(0,r.spin-dt);r.hop=Math.max(0,r.hop-dt);
 r.ghostT=Math.max(0,r.ghostT-dt);r.ink=Math.max(0,r.ink-dt);r.hornT=Math.max(0,r.hornT-dt);r.trickT=Math.max(0,r.trickT-dt);
 r.frozenT=Math.max(0,r.frozenT-dt);r.laserT=Math.max(0,r.laserT-dt);r.teleT=Math.max(0,r.teleT-dt);
 if(r.pwT>0){r.pwT-=dt;if(r.pwT<=0){r.pwT=0;r.pwType='';}}else if(r.meter<1)r.meter=Math.min(1,r.meter+dt/14*(r.isPlayer?1:dif().pw));
 if(r.goldenT>0){r.goldenT-=dt;if(r.goldenT<=0&&r.item==='golden'){r.item=null;r.itemCount=0;}}
 if(r.air>0){r.air-=dt;if(r.air<=0&&r.trick){r.trick=false;r.boost=Math.max(r.boost,1.0);if(r.isPlayer)SFX.boost();}}
 if(r.roulette>0){r.roulette-=dt;if(r.roulette<=0){r.item=r.pending;r.itemCount=ITEM_COUNT[r.item]||1;if(r.isPlayer&&!race.demo)SFX.itemGet();}}
 if(r.rescue>0){r.rescue-=dt;r.speed=0;if(r.rescue<=0){r.x=0;r.invul=1.2;}return;}
 const seg=findSeg(r.z);
 let top=r.top*(1+0.012*r.coins);
 if(!r.isPlayer||r.finished)top*=r.ai.mul||1;
 if(r.star>0)top*=1.2;if(r.shrink>0)top*=0.72;
 if(r.pwT>0)top*=({fly:1.25,acro:1.3,spin:1.3,giant:1.15,ssj:1.3})[r.pwType]||1;
 const off=Math.abs(r.x)>1.05;
 if(off&&r.boost<=0&&r.star<=0&&r.bullet<=0&&r.air<=0&&!flying(r))top*=r.kt.id==='buggy'?0.7:0.45;
 if(r.boost>0)top*=1.38;
 if(r.bullet>0)top=r.top*1.7;
 if(r.spin>0||r.frozenT>0)r.speed-=r.speed*Math.min(1,dt*(r.frozenT>0?4:3));
 else if(r.boost>0||r.bullet>0)r.speed=Math.min(top,Math.max(r.speed,top*0.8)+MAXS*1.5*dt);
 else if(inp.acc){if(r.speed<top)r.speed=Math.min(top,r.speed+r.accR*(1-0.65*Math.max(0,r.speed)/top)*dt);else r.speed=Math.max(top,r.speed-MAXS*0.8*dt);}
 else if(inp.brake)r.speed=Math.max(-MAXS*0.18,r.speed-MAXS*1.2*dt);
 else r.speed=r.speed>0?Math.max(0,r.speed-MAXS*0.35*dt):Math.min(0,r.speed+MAXS*0.35*dt);
 if(r.speed>top&&!(r.boost>0||r.bullet>0))r.speed=Math.max(top,r.speed-MAXS*0.8*dt);
 const sp=r.speed/MAXS;
 // salto y derrape
 if(inp.driftPress&&r.air>0&&!r.trick&&r.spin<=0){r.trick=true;r.trickT=0.4;if(r.isPlayer)tone(900,0.15,"square",0.08,1400);}
 else if(inp.driftPress&&r.air<=0&&r.hop<=0&&r.speed>MAXS*0.3&&r.spin<=0&&r.bullet<=0){r.hop=0.28;if(r.isPlayer)SFX.hop();}
 if(inp.drift&&!r.drift&&r.hop>0&&inp.steer!==0&&r.speed>MAXS*0.35){r.drift=inp.steer;r.driftCharge=0;r.driftLvl=0;}
 if(r.drift){
  if(!inp.drift||r.speed<MAXS*0.3||r.spin>0){
   if(r.driftLvl>0&&r.spin<=0){r.boost=Math.max(r.boost,[0,0.6,1.1,1.7][r.driftLvl]);if(r.isPlayer)SFX.boost();}
   r.drift=0;r.driftCharge=0;r.driftLvl=0;
  }else{
   r.driftCharge+=dt*(inp.steer===r.drift?1.7:inp.steer===0?1.1:0.6);
   const lvl=r.driftCharge>3.3?3:r.driftCharge>1.9?2:r.driftCharge>0.8?1:0;
   if(lvl>r.driftLvl){r.driftLvl=lvl;if(r.isPlayer)SFX.spark(lvl);}
  }
 }
 // dirección
 r.steerVis=lerp(r.steerVis||0,inp.steer,Math.min(1,dt*8));
 if(r.spin<=0&&r.bullet<=0&&r.frozenT<=0){
  let st=inp.steer;if(r.drift)st=r.drift*0.6+inp.steer*0.5;
  const grip=Math.min(1,Math.abs(sp)*1.8);
  r.x+=st*r.han*(theme.slip?0.8:1)*dt*grip*(r.speed<0?-1:1);
 }
 if(r.bullet>0)r.x=lerp(r.x,0,Math.min(1,dt*2.5));
 if(r.isPlayer&&r.bullet<=0){const s2=Math.min(1.2,Math.max(0,sp));r.x-=dt*2*s2*s2*seg.curve*CENTRI*(theme.slip?1.35:1);}
 // avanzar
 const z0=r.z;r.z+=r.speed*dt;
 if(r.z>=trackLen){r.z-=trackLen;r.lap++;onLap(r);}else if(r.z<0){r.z+=trackLen;r.lap--;}
 if(theme.danger&&Math.abs(r.x)>1.3&&r.bullet<=0&&r.air<=0&&!flying(r)){
  r.rescue=1.6;r.speed=0;r.drift=0;r.driftLvl=0;r.coins=Math.max(0,r.coins-2);
  if(r.isPlayer&&!race.demo){SFX.fall();showMsg(r,'¡TE CAÍSTE!',1.3);}
 }
 r.x=clamp(r.x,-2.4,2.4);
 if(!r.isPlayer)r.x=clamp(r.x,-1.1,1.1);
 if(r.speed>0)pickups(r,z0,r.z);
}

function aiInput(r,dt){
 const a=r.ai,inp={acc:true,brake:false,steer:0,drift:false,driftPress:false};
 a.t-=dt;
 if(a.t<=0){a.t=0.8+Math.random()*2.2;a.tx=Math.random()*1.5-0.75;}
 const L=segments.length,si=Math.floor(r.z/SEG);
 if(!r.item&&r.roulette<=0){
  for(let k=4;k<25;k++){const s=segments[(si+k)%L];if(s.boxes.length){let best=null,bd=9;for(const b of s.boxes)if(b.t<=0&&Math.abs(b.x-r.x)<bd){bd=Math.abs(b.x-r.x);best=b;}if(best){a.tx=best.x;a.t=0.5;}break;}}
 }
 for(const p of projs){if(p.type!=='banana'&&p.type!=='green')continue;const d=fwd(r.z,p.z);if(d>100&&d<2200&&Math.abs(p.x-a.tx)<0.28){a.tx=p.x+(p.x>0?-0.45:0.45);a.t=0.6;}}
 for(const h of hazards){if(h.dead>0||h.type==='podoboo')continue;const d=fwd(r.z,h.z);if(d>150&&d<2000&&Math.abs(h.x-a.tx)<0.3){a.tx=h.x+(h.x>0?-0.5:0.5);a.t=0.5;}}
 inp.steer=clamp((a.tx-r.x)*3,-1,1);
 if(r.ink>0)inp.steer=clamp(inp.steer+Math.sin(T*3+r.ai.skill*50)*0.6,-1,1);
 let m=a.skill;
 const LH=leadHuman();if(LH&&!race.demo&&!r.isPlayer){const gap=prog(LH)-prog(r);const D=dif();if(gap>3000)m*=1+Math.min(D.catchup,(gap-3000)/50000);else if(gap<-1500)m*=Math.max(D.slow,1-(-gap-1500)/40000);}
 a.mul=m;
 if(Math.abs(segments[si%L].curve)>=4&&Math.random()<dt*dif().boost&&r.boost<=0)r.boost=0.5;
 if(r.item&&r.roulette<=0){a.useT-=dt;if(a.useT<=0){useItem(r);a.useT=dif().useMin+Math.random()*dif().useRand;}}
 if(r.meter>=1&&r.pwT<=0){if(a.pwWait===undefined)a.pwWait=0.5+Math.random()*3;a.pwWait-=dt;if(a.pwWait<=0){activatePower(r);a.pwWait=undefined;}}
 return inp;
}

function updateProjs(dt){
 for(const p of projs){
  p.age+=dt;p.life-=dt;
  if(p.type==='green'||p.type==='fire'||p.type==='egg'){p.z+=p.speed*dt;p.x+=p.vx*dt;if(Math.abs(p.x)>1.1){p.vx=-p.vx;p.x=clamp(p.x,-1.1,1.1);}}
  else if(p.type==='bomb'){
   p.z+=p.speed*dt;p.speed=Math.max(0,p.speed-MAXS*0.9*dt);
   let touch=false;if(p.age>0.3)for(const r of racers)if(r!==p.owner&&Math.abs(wrapD(r.z-p.z))<170&&Math.abs(r.x-p.x)<0.2)touch=true;
   if(touch||p.life<=0.05){
    for(const r of racers)if(Math.abs(wrapD(r.z-p.z))<520&&Math.abs(r.x-p.x)<0.5)hitRacer(r,'blue');
    const b=mkProj('boom',p.owner,p.z,p.x,{life:0.7});b.col='255,140,30';projs.push(b);p.life=0;
    if(!race.demo&&players.some(h=>Math.abs(wrapD(h.z-p.z))<4000))SFX.boom();
   }
  }
  else if(p.type==='red'){
   const t=p.target;
   if(!t||t.rescue>0){p.type='green';p.vx=0;continue;}
   const d=fwd(p.z,t.z);p.speed=Math.max(t.speed,0)+MAXS*0.8;p.z+=p.speed*dt;
   if(d<2500)p.x=lerp(p.x,t.x,Math.min(1,dt*(d<800?10:3)));else p.x=lerp(p.x,0,Math.min(1,dt));
  }else if(p.type==='blue'){
   const t=ranking[0];const d=fwd(p.z,t.z);p.target=t;p.speed=MAXS*2.2;p.x=lerp(p.x,t.x,Math.min(1,dt*4));
   if(d<p.speed*dt+150){
    for(const r of racers)if(Math.abs(wrapD(r.z-t.z))<500&&Math.abs(r.x-t.x)<0.5)hitRacer(r,'blue');
    projs.push(mkProj('boom',p.owner,t.z,t.x,{life:0.7}));p.life=0;
    if(!race.demo)SFX.boom();
   }else p.z+=p.speed*dt;
  }
  p.z=wrapZ(p.z);
 }
 for(const p of projs){
  if(p.type==='blue'||p.type==='boom'||p.type==='bomb'||p.life<=0)continue;
  for(const r of racers){
   if(r.rescue>0||(r===p.owner&&p.age<0.5))continue;
   if(Math.abs(wrapD(r.z-p.z))<170&&Math.abs(r.x-p.x)<0.17){
    if(r.star>0||r.bullet>0){p.life=0;break;}
    if(hitRacer(r,p.type)){p.life=0;break;}
   }
  }
 }
 for(let i=0;i<projs.length;i++)for(let j=i+1;j<projs.length;j++){
  const a=projs[i],b=projs[j];
  if(a.life<=0||b.life<=0||a.type==='blue'||b.type==='blue'||a.type==='boom'||b.type==='boom')continue;
  if(a.type==='banana'&&b.type==='banana')continue;
  if(Math.abs(wrapD(a.z-b.z))<150&&Math.abs(a.x-b.x)<0.15){a.life=0;b.life=0;}
 }
 projs=projs.filter(p=>p.life>0);
}

function updateHazards(dt){
 for(const h of hazards){
  if(h.dead>0){h.dead-=dt;continue;}
  if(h.type==='car')h.z=wrapZ(h.z+h.speed*dt);
  else if(h.type==='podoboo')h.h=Math.max(0,Math.sin(T*1.4+h.ph))*900;
  else h.x=Math.sin(T*h.sp+h.ph)*h.amp;
  for(const r of racers){
   if(r.rescue>0||r.air>0.15||flying(r))continue;
   if(h.type==='podoboo'&&h.h>250)continue;
   if(Math.abs(wrapD(r.z-h.z))<(h.type==='car'?230:170)&&Math.abs(r.x-h.x)<(h.type==='car'?0.22:0.17)){
    if(smasher(r)){h.dead=5;if(r.isPlayer&&!race.demo)tone(700,0.2,'square',0.1,200);}
    else if(hitRacer(r,'hz')&&h.type==='car')r.speed=Math.min(r.speed,h.speed*0.5);
   }
  }
 }
}
function racerCollisions(){
 for(let i=0;i<racers.length;i++)for(let j=i+1;j<racers.length;j++){
  const a=racers[i],b=racers[j];if(a.rescue>0||b.rescue>0)continue;
  const dz=wrapD(a.z-b.z),dx=a.x-b.x;
  if(Math.abs(dz)<170&&Math.abs(dx)<0.18){
   if((flying(a)&&a.pwType!=='acro')||(flying(b)&&b.pwType!=='acro'))continue;
   const aS=smasher(a),bS=smasher(b);
   if(aS&&!bS){hitRacer(b,'star');continue;}
   if(bS&&!aS){hitRacer(a,'star');continue;}
   const ov=0.18-Math.abs(dx),dir=dx>=0?1:-1,tw=a.wgt+b.wgt;
   a.x+=dir*ov*(b.wgt/tw)*1.1;b.x-=dir*ov*(a.wgt/tw)*1.1;
   const back=dz<0?a:b,front=dz<0?b:a;if(back.speed>front.speed)back.speed=front.speed*0.97;
   if((a.isPlayer||b.isPlayer)&&race.bumpT<=0&&!race.demo){SFX.bump();race.bumpT=0.3;}
  }
 }
}
function computePlaces(){
 ranking=racers.slice().sort((a,b)=>{if(a.finished&&b.finished)return a.finishTime-b.finishTime;if(a.finished)return-1;if(b.finished)return 1;return prog(b)-prog(a);});
 ranking.forEach((r,i)=>r.place=i+1);return ranking;
}

// ---------------- flujo de carrera ----------------
function startRace(ti,grid,demo){
 const tt=!demo&&menu.mode===2&&!gp,mirror=!demo&&menu.mirror;
 buildTrack(ti,mirror);
 const lk=ti+'_'+Math.min(2,Math.max(1,SCALE));if(layerCache.key!==lk){layerCache.key=lk;layerCache.l=makeLayers(theme,ti*13+1);}
 layers=layerCache.l;computeMap();
 curGrid=grid;projs=[];parts=[];dynSegs=[];
 race={ti,demo,tt,mirror,time:0,count:demo?0:4,phase:demo?'race':'count',flash:0,bumpT:0,goT:0,doneT:0};
 racers=grid.map(e=>makeRacer(e,demo));
 racers.forEach((r,i)=>{r.z=trackLen-200-i*300;r.x=i%2?0.4:-0.4;r.ai.tx=r.x;});
 players=racers.filter(r=>r.isPlayer).sort((a,b)=>a.pidx-b.pidx);
 cams=players.length?players:[racers[0]];
 if(tt){for(const b of allBoxes)b.t=Infinity;for(const p of players){p.item='triple';p.itemCount=3;p.x=0;}}
 computePlaces();
 if(!demo)playSong(TRACKS[ti].song,1);
}

 const others=shuffle(CHARS.filter(c=>!humans.some(h=>h.ch===c))).slice(0,8-humans.length).map(ch=>({ch,kt:KARTS[Math.floor(Math.random()*KARTS.length)],isPlayer:false}));
 return[...humans,...others];
}
function gridOrder(){

}

// ---- récords guardados en el navegador ----
function store(k,v){try{if(v===undefined){const s=localStorage.getItem('skb_'+k);return s?JSON.parse(s):null;}localStorage.setItem('skb_'+k,JSON.stringify(v));}catch(e){return null;}}
const recKey=ti=>'tt_'+ti+'_'+menu.cc+'_'+(menu.mirror?1:0);
const getRec=ti=>store(recKey(ti));
const cupKey=c=>'cup_'+c+'_'+menu.cc+'_'+(menu.mirror?1:0);
function toMenu(){gp=null;newDemo();state='mode';playSong(0,0.9);}
function finishRace(){
 const rank=computePlaces(),list=[];let lastT=0;
 rank.forEach((r,i)=>{let t=r.finished?r.finishTime:race.time+((LAPS+1)*trackLen-prog(r))/(r.top*0.92);t=Math.max(t,lastT+0.05);lastT=t;list.push({r,time:t,pts:PTS[i]||0});});
 if(gp)for(const e of list)gp.points[e.r.ch.id]=(gp.points[e.r.ch.id]||0)+e.pts;
 results={list};state='results';
 if(race.tt){
  const p=players[0],total=p.finishTime,best=Math.min(...p.lapTimes),old=getRec(race.ti);
  results.tt={total,laps:p.lapTimes.slice(),best,old,newRec:!old||total<old.total};
  if(results.tt.newRec)store(recKey(race.ti),{total,lap:best,ch:p.ch.id});
 }
}
function nextAfterResults(){
 if(gp){
  if(gp.race<2){gp.race++;startRace(CUPS[gp.cup].tracks[gp.race],gridOrder(),false);state='race';}
  else{
   state='podium';SFX.finish();
   const st=gp.roster.slice().sort((a,b)=>gp.points[b.ch.id]-gp.points[a.ch.id]);
   const best=Math.min(...st.map((e,i)=>e.isPlayer?i+1:99));
   const old=store(cupKey(gp.cup));if(best<=3&&(!old||best<old))store(cupKey(gp.cup),best);
  }
 }else{newDemo();state='track';playSong(0,0.9);}
}

function updateRace(dt){
 race.flash=Math.max(0,race.flash-dt);race.bumpT=Math.max(0,race.bumpT-dt);race.goT=Math.max(0,race.goT-dt);
 for(const p of players){p.msgT=Math.max(0,p.msgT-dt);p.shake=Math.max(0,p.shake-dt);}
 if(race.phase==='count'){
  const prev=race.count;race.count-=dt;
  if(state==='race')for(const p of players)if(kp(...ctrlFor(p).acc)&&p.startPress<0)p.startPress=race.count;
  for(const n of[3,2,1])if(prev>n&&race.count<=n)SFX.count();
  if(race.count<=0){
   race.phase='race';race.goT=1.2;SFX.go();
   for(const p of players)if(held(ctrlFor(p).acc)&&p.startPress>0.6&&p.startPress<1.9){p.boost=1.3;showMsg(p,'¡SALIDA TURBO!',1.2);SFX.boost();}
   for(const r of racers)if(!r.isPlayer&&Math.random()<dif().start)r.boost=0.9;
  }
  computePlaces();return;
 }
 race.time+=dt;
 for(const c of allCoins)if(c.taken>0)c.taken-=dt;
 for(const b of allBoxes)if(b.t>0)b.t-=dt;
 const camZ0=cams.map(c=>c.z);
 for(const r of racers){
  let inp;
  if(r.isPlayer&&!r.finished&&!race.demo){inp=playerInput(r);if(inp.use&&state==='race')useItem(r);if(inp.power&&state==='race')activatePower(r);}
  else inp=aiInput(r,dt);
  updateRacer(r,inp,dt);
 }
 updateProjs(dt);updateHazards(dt);racerCollisions();computePlaces();
 cams.forEach((c,i)=>{c.skyOff+=0.0008*findSeg(c.z).curve*(wrapD(c.z-camZ0[i])/SEG);});
 for(const p of players){if(p.place!==p.lastPlace){p.placeT=0.35;p.lastPlace=p.place;}p.placeT=Math.max(0,p.placeT-dt);}
 if(race.phase==='done'){race.doneT+=dt;if(race.doneT>4.5&&state==='race')finishRace();}
}

function updateParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);}

function project(p,cx,cy,cz){
 p.camera.x=-cx;p.camera.y=p.world.y-cy;p.camera.z=p.world.z-cz;
 p.screen.scale=DEPTH/p.camera.z;
 p.screen.x=VW/2+p.screen.scale*p.camera.x*VW/2;
 p.screen.y=H/2-p.screen.scale*p.camera.y*H/2;
 p.screen.w=p.screen.scale*ROADW*VW/2;
}
function segPt(seg,pct,x){const a=seg.p1.screen,b=seg.p2.screen;const s=lerp(a.scale,b.scale,pct);return{sx:lerp(a.x,b.x,pct)+s*x*ROADW*VW/2,sy:lerp(a.y,b.y,pct),k:s*VW/2};}
function drawSeg(seg,n){
 const a=seg.p1.screen,b=seg.p2.screen,alt=Math.floor(seg.index/RUMBLE)%2;
 let grass=theme.grass[alt];
 if(theme.lava)grass=`hsl(${Math.floor(16+Math.sin(T*2+seg.index*0.15)*8)},100%,${alt?47:52}%)`;
 ctx.fillStyle=grass;ctx.fillRect(0,b.y-0.6,VW,a.y-b.y+0.6);
 const r1=a.w/7,r2=b.w/7;
 poly(a.x-a.w-r1,a.y,a.x-a.w,a.y,b.x-b.w,b.y,b.x-b.w-r2,b.y,theme.rumble[alt]);
 poly(a.x+a.w+r1,a.y,a.x+a.w,a.y,b.x+b.w,b.y,b.x+b.w+r2,b.y,theme.rumble[alt]);
 const isFinish=seg.index<2;
 const road=isFinish?'#111':theme.rainbow?`hsl(${(seg.index*6)%360},85%,${alt?58:52}%)`:theme.planks?theme.road[seg.index%2]:theme.road[alt];
 poly(a.x-a.w,a.y,a.x+a.w,a.y,b.x+b.w,b.y,b.x-b.w,b.y,road);
 if(!theme.rainbow&&!isFinish){const ec=theme.edge||'rgba(255,255,255,.85)';
  poly(a.x-a.w*0.955,a.y,a.x-a.w*0.93,a.y,b.x-b.w*0.93,b.y,b.x-b.w*0.955,b.y,ec);
  poly(a.x+a.w*0.93,a.y,a.x+a.w*0.955,a.y,b.x+b.w*0.955,b.y,b.x+b.w*0.93,b.y,ec);}
 if(isFinish){
  const n=12;for(let i=0;i<n;i++){if((i+seg.index)%2)continue;const f1=i/n,f2=(i+1)/n;poly(a.x-a.w+2*a.w*f1,a.y,a.x-a.w+2*a.w*f2,a.y,b.x-b.w+2*b.w*f2,b.y,b.x-b.w+2*b.w*f1,b.y,'#fff');}
 }else if(alt){
  const l1=a.w/40,l2=b.w/40;
  for(const f of[1/3,2/3]){const x1=a.x-a.w+2*a.w*f,x2=b.x-b.w+2*b.w*f;poly(x1-l1,a.y,x1+l1,a.y,x2+l2,b.y,x2-l2,b.y,theme.lane);}
 }
 if(seg.pad!==undefined){   // turbo en el piso: franjas que se mueven
  const p=seg.pad,h=0.17,col=(seg.index+Math.floor(T*10))%2?'#ffb000':'#ff5a00';
  poly(a.x+(p-h)*a.w,a.y,a.x+(p+h)*a.w,a.y,b.x+(p+h)*b.w,b.y,b.x+(p-h)*b.w,b.y,col);
  const m1=a.x+p*a.w,m2=b.x+p*b.w;poly(m1-h*0.6*a.w,a.y,m1+h*0.6*a.w,a.y,m2,b.y,m2,b.y,'#fff2a0');
 }
 if(seg.ramp){   // rampa
  poly(a.x-a.w,a.y,a.x+a.w,a.y,b.x+b.w,b.y,b.x-b.w,b.y,seg.index%2?'#2a6ae8':'#4a8aff');
  const n=8;for(let i=0;i<n;i+=2){const f1=i/n,f2=(i+1)/n;poly(a.x-a.w+2*a.w*f1,a.y,a.x-a.w+2*a.w*f2,a.y,b.x-b.w+2*b.w*f2,b.y,b.x-b.w+2*b.w*f1,b.y,'#ffd800');}
 }
 // neblina a lo lejos: el horizonte se funde suavemente con el cielo
 const fog=Math.min(0.8,Math.pow(n/DRAW,1.5)*1.25);
 if(fog>0.02){if(!theme._fog){const v=parseInt(theme.sky[1].slice(1),16);theme._fog=(v>>16&255)+','+(v>>8&255)+','+(v&255);}
  ctx.fillStyle=`rgba(${theme._fog},${fog.toFixed(3)})`;ctx.fillRect(0,b.y-0.6,VW,a.y-b.y+0.6);}
}
function drawArch(seg){

 ctx.fillStyle='#e8e8e8';ctx.fillRect(x-hw-70*k,y-h,140*k,h);ctx.fillRect(x+hw-70*k,y-h,140*k,h);
 const bh=300*k,n=24,cw=2*hw/n;ctx.fillStyle='#111';ctx.fillRect(x-hw,y-h,2*hw,bh);
 ctx.fillStyle='#fff';for(let i=0;i<n;i++)for(let j=0;j<2;j++)if((i+j)%2)ctx.fillRect(x-hw+i*cw,y-h+j*bh/2,cw+0.5,bh/2+0.5);

function renderWorld(cam){
 ctx.save();
 if(cam.shake>0)ctx.translate((Math.random()-0.5)*14*cam.shake/0.4,(Math.random()-0.5)*10*cam.shake/0.4);
 const g=ctx.createLinearGradient(0,0,0,H/2);g.addColorStop(0,theme.sky[0]);g.addColorStop(1,theme.sky[1]);
 ctx.fillStyle=g;ctx.fillRect(-10,-10,VW+20,H/2+12);
 ctx.fillStyle=theme.lava?'#e84000':theme.grass[0];ctx.fillRect(-10,H/2,VW+20,H/2+10);
 drawLayer(layers.far,cam.skyOff*0.5,H/2-270+4);drawLayer(layers.near,cam.skyOff,H/2-270+6);
 const L=segments.length,camZ=wrapZ(cam.z-PLAYERZ);
 const base=findSeg(camZ),basePct=(camZ%SEG)/SEG;
 const pSeg=findSeg(cam.z),pPct=(cam.z%SEG)/SEG,pY=lerp(pSeg.p1.world.y,pSeg.p2.world.y,pPct);
 let maxy=H,x=0,dx=-(base.curve*basePct);
 for(let n=0;n<DRAW;n++){
  const seg=segments[(base.index+n)%L],looped=seg.index<base.index,cz=camZ-(looped?trackLen:0);
  project(seg.p1,cam.x*ROADW-x,pY+CAMH,cz);project(seg.p2,cam.x*ROADW-x-dx,pY+CAMH,cz);
  x+=dx;dx+=seg.curve;seg.clip=maxy;seg.vis=seg.p1.camera.z>DEPTH;
  if(seg.p1.camera.z<=DEPTH||seg.p2.screen.y>=seg.p1.screen.y||seg.p2.screen.y>=maxy)continue;
  drawSeg(seg,n);maxy=seg.p1.screen.y;
 }
 for(const s of dynSegs)s.dyn.length=0;dynSegs.length=0;
 for(const r of racers){const s=findSeg(r.z);s.dyn.push(r);dynSegs.push(s);}
 for(const p of projs){const s=findSeg(p.z);s.dyn.push(p);dynSegs.push(s);}
 for(const h of hazards)if(h.dead<=0){const s=findSeg(h.z);s.dyn.push(h);dynSegs.push(s);}
 for(let n=DRAW-1;n>0;n--){
  const seg=segments[(base.index+n)%L];if(!seg.vis)continue;

  for(const b of seg.boxes)if(b.t<=0){const p=segPt(seg,0.5,b.x);drawBox(ctx,p.sx,p.sy,230*p.k);}
  if(seg.dyn.length>1)seg.dyn.sort((u,v)=>v.z-u.z);
  for(const o of seg.dyn){
   const p=segPt(seg,(o.z%SEG)/SEG,o.x);
   if(o.ch){
    const w=KARTW*p.k*(o.shrink>0?0.55:1)*(o.pwT>0&&o.pwType==='giant'?1.6:1);if(w>1)drawKart(ctx,o,p.sx,p.sy,w);
    if(o===cam)cam.scr={x:VX+p.sx,y:p.sy,w};
    else if(o.isPlayer&&players.length>1&&w>12)txt('J'+(o.pidx+1),p.sx,p.sy-w*0.95,Math.max(11,w*0.22),P_COL[o.pidx],'center','#000',3);
   }
   else if(o.type in HZ_TYPES)drawHazard(ctx,o,p.sx,p.sy,p.k);
   else drawProj(ctx,o,p.sx,p.sy,p.k);
  }

 }

}

// HUD de un jugador, dibujado dentro de su vista (ancho VW)

// ---------------- control de menús ----------------
function gridNav(i,n,cols,up,dn,lf,rt){const o=i;if(lf)i=(i-1+n)%n;if(rt)i=(i+1)%n;if(up)i=(i-cols+n)%n;if(dn)i=(i+cols)%n;if(i!==o)SFX.sel();return i;}
// selección de personaje/vehículo: en 2 jugadores cada uno mueve su cursor y confirma
function selScreen(key,n,cols,next,prev,up,dn,lf,rt,ok,bk){
 if(menu.np===1){
  menu[key][0]=gridNav(menu[key][0],n,cols,up,dn,lf,rt);
  if(ok){state=next;SFX.ok();}else if(bk){state=prev;SFX.back();}
  return;
 }
 for(let p=0;p<2;p++){
  const c=MENU_KEYS[p];
  if(!menu.lock[p]){
   menu[key][p]=gridNav(menu[key][p],n,cols,kp(c.up),kp(c.dn),kp(c.lf),kp(c.rt));
   if(kp(...c.ok)){
    if(key==='ch'&&menu.lock[1-p]&&menu.ch[p]===menu.ch[1-p])SFX.back();   // no se puede repetir personaje
    else{menu.lock[p]=true;SFX.ok();}
   }
  }else if(kp(...c.cancel)){menu.lock[p]=false;SFX.back();}
 }
 if(menu.lock[0]&&menu.lock[1]){menu.lock=[false,false];state=next;}
 else if(kp('Escape')){menu.lock=[false,false];state=prev;SFX.back();}
}
function handleInput(){
 if(kp('KeyM')){music.on=!music.on;if(musicGain)musicGain.gain.value=music.on?0.5:0;}
 const up=kp('ArrowUp','KeyW'),dn=kp('ArrowDown','KeyS'),lf=kp('ArrowLeft','KeyA'),rt=kp('ArrowRight','KeyD'),ok=kp('Enter','Space'),bk=kp('Escape','Backspace');
 switch(state){
  case 'title':if(kp('KeyI','KeyH')){state='help';SFX.ok();}else if(ok){state='mode';SFX.ok();}break;
  case 'help':if(ok||bk||kp('KeyI','KeyH')){state='title';SFX.back();}break;
  case 'mode':
   if(up){menu.row=(menu.row+4)%5;SFX.sel();}if(dn){menu.row=(menu.row+1)%5;SFX.sel();}
   if(lf||rt){const d=rt?1:-1;if(menu.row===0)menu.np=menu.np===1?2:1;else if(menu.row===1)menu.mode=(menu.mode+d+4)%4;
    else if(menu.row===2){if(menu.mode===3)menu.sdur=clamp(menu.sdur+d,0,SOC_DUR.length-1);else menu.cc=clamp(menu.cc+d,0,CC.length-1);}
    else if(menu.row===3)menu.diff=clamp(menu.diff+d,0,2);else if(menu.mode===3)menu.sfield=(menu.sfield+d+CANCHAS.length)%CANCHAS.length;else menu.mirror=!menu.mirror;SFX.sel();}
   if(ok){if(menu.mode===2)menu.np=1;state='char';menu.lock=[false,false];if(menu.ch[0]===menu.ch[1])menu.ch[1]=(menu.ch[0]+1)%CHARS.length;SFX.ok();}else if(bk){state='title';SFX.back();}break;
  case 'char':selScreen('ch',CHARS.length,8,menu.mode===3?'sstart':'kart','mode',up,dn,lf,rt,ok,bk);if(state==='sstart')startSoccer();break;
  case 'soccer':case 'spause':case 'sres':socInput(up,dn,ok,bk);break;
  case 'kart':selScreen('kt',KARTS.length,4,menu.mode===0?'cup':'track','char',up,dn,lf,rt,ok,bk);break;
  case 'cup':if(lf||rt){menu.cup=(menu.cup+(rt?1:CUPS.length-1))%CUPS.length;SFX.sel();}if(ok){SFX.ok();startGP();}else if(bk){state='kart';SFX.back();}break;
  case 'track':menu.tr=gridNav(menu.tr,TRACKS.length,4,up,dn,lf,rt);if(ok){SFX.ok();startFree();}else if(bk){state='kart';SFX.back();}break;
  case 'race':if(kp('Escape','KeyP')){state='pause';menu.p=0;SFX.sel();}break;
  case 'pause':
   if(up){menu.p=(menu.p+2)%3;SFX.sel();}if(dn){menu.p=(menu.p+1)%3;SFX.sel();}
   if(kp('Escape','KeyP')){state='race';break;}
   if(ok){if(menu.p===0)state='race';else if(menu.p===1){startRace(race.ti,curGrid,false);state='race';}else toMenu();}
   break;
  case 'results':if(ok){SFX.ok();nextAfterResults();}break;
  case 'podium':if(ok){SFX.ok();toMenu();}break;
 }
}

// ---------------- armar el partido ----------------
function mkSPl(ch,team,slot,gk){
 const st=CLS[ch.cls];
 return{ch,st,team,slot,gk,human:-1,goals:0,x:0,y:0,vx:0,vy:0,face:0,hx:0,hy:0,top:300+16*st.spd+6*st.acc,acc:4+1.1*st.acc,
  stun:0,slide:0,slideCD:0,kickCD:0,kickAnim:0,run:0,charge:-1,pwT:0,dive:0,frozen:0,aiT:0};
}
function startSoccer(teams){
 const s={pl:[],ball:{x:0,y:0,z:0,vx:0,vy:0,vz:0,spin:0,superT:0,saveCD:0,zig:0,teleT:0,owner:null,last:null,passTo:null,sup:'',supCol:'#fff',trail:[]},
  score:[0,0],meter:[0,0],ctl:[null,null],cap:[null,null],chaser:[null,null],switchT:[0,0],clock:0,dur:SOC_DUR[menu.sdur]*60,phaseT:0,camX:0,
  msgT:0,msgMax:1,shake:0,flash:0,resT:0,phase:'count',msg:'',msgCol:'#fff',field:menu.sfield,kickTeam:0,np:menu.np,diff:menu.diff,lastGoalTeam:-1,
  golden:false,endPending:false,allAI:false,log:[]};
 if(!teams){
  const used=new Set();const c0=CHARS[menu.ch[0]];used.add(c0);
  const c1=s.np>1?CHARS[menu.ch[1]]:shuffle(CHARS.filter(c=>!used.has(c)))[0];used.add(c1);
  teams=[[c0],[c1]];
  for(let t=0;t<2;t++)for(const m of shuffle(CHARS.filter(c=>!used.has(c))).slice(0,3)){used.add(m);teams[t].push(m);}
 }
 for(let t=0;t<2;t++){s.cap[t]=teams[t][0];for(let i=0;i<4;i++)s.pl.push(mkSPl(teams[t][i],t,i,i===3));}
 soc=s;
 s.kickTeam=Math.random()<0.5?0:1;
 socKickoff();s.phase='count';s.phaseT=3.5;
 parts=[];
 state='soccer';playSong(1,1.05);
}
function socTeams(){return[0,1].map(t=>soc.pl.filter(p=>p.team===t).sort((a,b)=>a.slot-b.slot).map(p=>p.ch));}
function socHome(p){
 const s=sgn(p.team);
 if(p.gk){p.hx=-s*(FL-30);p.hy=0;}
 else if(p.slot===0){p.hx=-s*170;p.hy=0;}
 else{p.hx=-s*390;p.hy=p.slot===1?-210:210;}
}
function setCtl(t,p){
 if(!p||soc.ctl[t]===p||p.gk)return;
 if(soc.ctl[t])soc.ctl[t].human=-1;
 soc.ctl[t]=p;p.human=t;p.charge=-1;soc.switchT[t]=0.5;
}
function socKickoff(){
 const s=soc,b=s.ball;
 for(const p of s.pl){socHome(p);p.x=p.hx;p.y=p.hy;p.vx=p.vy=0;p.face=p.team===0?0:Math.PI;
  p.stun=p.slide=p.slideCD=p.kickCD=p.kickAnim=p.pwT=p.dive=p.frozen=0;p.charge=-1;}
 const k=s.pl.find(p=>p.team===s.kickTeam&&p.slot===0);
 k.x=-sgn(s.kickTeam)*34;k.y=0;
 Object.assign(b,{x:0,y:0,z:0,vx:0,vy:0,vz:0,owner:k,last:k,passTo:null,superT:0,sup:''});b.trail=[];
 for(let t=0;t<2;t++){if(s.ctl[t])s.ctl[t].human=-1;s.ctl[t]=null;}
 for(let t=0;t<s.np;t++)setCtl(t,s.pl.find(p=>p.team===t&&p.slot===0));
 s.camX=0;
}

function updateSoccer(dt){
 const s=soc,b=s.ball;
 s.msgT=Math.max(0,s.msgT-dt);s.shake=Math.max(0,s.shake-dt);s.flash=Math.max(0,s.flash-dt);
 for(let t=0;t<2;t++)s.switchT[t]=Math.max(0,s.switchT[t]-dt);
 switch(s.phase){
  case 'count':{
   const prev=s.phaseT;s.phaseT-=dt;
   for(const n of[3,2,1])if(prev>n&&s.phaseT<=n)SFX.count();
   if(s.phaseT<=0){s.phase='play';sWhistle();showSMsg('¡A JUGAR!','#ffd800',1.2);}
   socBallFollow();socCamera(dt);return;}
  case 'ready':
   s.phaseT-=dt;if(s.phaseT<=0){s.phase='play';sWhistle();}
   socBallFollow();socCamera(dt);return;
  case 'goal':
   s.phaseT-=dt;
   for(const p of s.pl)socMove(p,0,0,dt);
   socBall(dt);socCamera(dt);
   if(Math.random()<0.5)addPart(Math.random()*W,-10,(Math.random()-0.5)*80,80+Math.random()*120,3,`hsl(${Math.floor(Math.random()*360)},90%,60%)`,7,40);
   if(s.phaseT<=0){if(s.endPending)socEndMatch();else{socKickoff();s.phase='ready';s.phaseT=1.0;}}
   return;
  case 'end':
   s.phaseT-=dt;
   for(const p of s.pl)socMove(p,0,0,dt);
   socBall(dt);socCamera(dt);
   if(s.phaseT<=0&&state==='soccer'){state='sres';s.resT=0;socSaveResult();}
   return;
 }
 // ---- jugando ----
 s.clock+=dt;
 for(let t=0;t<2;t++)s.meter[t]=Math.min(1,s.meter[t]+dt*0.022);
 if(!s.golden&&s.clock>=s.dur){
  if(s.score[0]===s.score[1]){s.golden=true;sWhistle();showSMsg('¡GOL DE ORO!','#ffd800',2.5);}
  else{socEndMatch();return;}
 }
 if(s.golden&&s.clock>=s.dur+90){socEndMatch();return;}
 // quién persigue la pelota en cada equipo
 for(let t=0;t<2;t++){
  let best=null,bd=1e9;
  for(const p of s.pl){
   if(p.team!==t||p.gk||p.stun>0||p.frozen>0)continue;
   let d=hyp(p.x-b.x,p.y-b.y)-(p===s.chaser[t]?40:0);
   if(b.passTo===p)d-=400;
   if(d<bd){bd=d;best=p;}
  }
  s.chaser[t]=best;
  // el jugador humano maneja al que tiene la pelota o al más cercano
  if(t<s.np&&!s.allAI){
   if(b.owner&&b.owner.team===t&&!b.owner.gk)setCtl(t,b.owner);
   else if(best&&s.ctl[t]!==best&&s.switchT[t]<=0&&s.ctl[t].slide<=0&&!b.passTo){
    const dc=hyp(s.ctl[t].x-b.x,s.ctl[t].y-b.y),dn=hyp(best.x-b.x,best.y-b.y);
    if(dn+90<dc)setCtl(t,best);
   }
  }
 }
 for(const p of s.pl)updateSPl(p,dt);
 socCollisions(dt);
 socBall(dt);
 socTouches();
 socCamera(dt);
}
function socBallFollow(){
 const b=soc.ball;if(!b.owner)return;
 const p=b.owner;b.x=p.x+Math.cos(p.face)*(PR+BR+2);b.y=p.y+Math.sin(p.face)*(PR+BR+2);b.z=0;
}
function socCamera(dt){
 const s=soc,lim=FL-(W/2)/(FOC/CAMD)+140;
 const tx=clamp(s.ball.x+s.ball.vx*0.15,-lim,lim);
 s.camX+=(tx-s.camX)*Math.min(1,dt*3.5);
}
function socEndMatch(){const s=soc;s.phase='end';s.phaseT=3.2;sWhistle(true);showSMsg('¡FINAL DEL PARTIDO!','#fff',3.2);}
function socSaveResult(){
 const s=soc;if(s.np>1||s.allAI)return;
 const k=s.score[0]>s.score[1]?'futbol_g':s.score[0]<s.score[1]?'futbol_p':'futbol_e';
 store(k,(store(k)||0)+1);
 if(s.score[0]>s.score[1])SFX.finish();
}

// ---------------- jugadores ----------------
function updateSPl(p,dt){
 const s=soc,b=s.ball;
 p.kickCD-=dt;p.slideCD-=dt;p.kickAnim=Math.max(0,p.kickAnim-dt);p.pwT=Math.max(0,p.pwT-dt);p.dive=Math.max(0,p.dive-dt);
 if(p.frozen>0){p.frozen-=dt;socMove(p,0,0,dt);return;}
 if(p.stun>0){p.stun-=dt;socMove(p,0,0,dt);return;}
 if(p.slide>0){
  p.slide-=dt;const f=Math.exp(-2.2*dt);p.vx*=f;p.vy*=f;socMove(p,0,0,dt,true);
  for(const q of s.pl){
   if(q.team===p.team||q.stun>0||hyp(q.x-p.x,q.y-p.y)>PR*2+6)continue;
   if(q.gk&&b.owner!==q)continue;
   if(b.owner===q){
    q.stun=0.8+0.1*p.st.wgt;b.owner=null;const a=Math.atan2(p.vy,p.vx);
    b.vx=Math.cos(a)*260+(Math.random()-0.5)*120;b.vy=Math.sin(a)*260+(Math.random()-0.5)*120;b.vz=120;b.last=q;
    s.meter[p.team]=Math.min(1,s.meter[p.team]+0.1);SFX.bump();socDust(q,8);
   }else if(!q.gk){q.stun=0.5;SFX.bump();}
  }
  return;
 }
 let dx=0,dy=0;
 if(p.human>=0&&!s.allAI&&!p.gk){
  const c=socCtrl(p.human);
  dx=(held(c.right)?1:0)-(held(c.left)?1:0);dy=(held(c.brake)?1:0)-(held(c.acc)?1:0);
  const m=hyp(dx,dy);if(m>0){dx/=m;dy/=m;}
  const has=b.owner===p,shootHeld=held(c.drift),shootPress=kp(...c.drift),passPress=kp(...c.use);
  if(kp(...c.power)&&s.meter[p.team]>=1)socSuper(p);
  else if(has){
   if(shootPress)p.charge=0;
   if(p.charge>=0){
    if(shootHeld){p.charge+=dt/0.7;if(p.charge>=1.3)socShoot(p,1,dy);}
    else socShoot(p,clamp(p.charge,0.25,1),dy);
   }
   if(passPress&&b.owner===p)socPass(p,dx,dy);
  }else{
   p.charge=-1;
   if(shootPress)socSlide(p,dx,dy);
   else if(passPress)socSwitch(p.human);
  }
 }else{const d=socAI(p,dt);dx=d[0];dy=d[1];}
 socMove(p,dx,dy,dt);
}
function socMove(p,dx,dy,dt,free){
 const s=soc,cf=CANCHAS[s.field];
 if(!free){
  const top=p.top*(s.ball.owner===p?0.88:1)*(p.pwT>0?1.4:1)*(p.dive>0?1.7:1);
  if(p.stun>0||p.frozen>0){dx=dy=0;}
  let rate=p.acc*(cf.ice?0.3:1);
  if(s.phase!=='play')rate=6;
  const k=Math.min(1,rate*dt);
  p.vx+=(dx*top-p.vx)*k;p.vy+=(dy*top-p.vy)*k;
 }
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 const sp=hyp(p.vx,p.vy);
 if(sp>25&&p.slide<=0&&p.stun<=0){
  let d=Math.atan2(p.vy,p.vx)-p.face;
  while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  p.face+=d*Math.min(1,dt*12);
 }
 p.run+=sp*dt*0.045;
 // límites de la cancha (el arquero se queda en su área)
 if(p.gk){
  const sg=sgn(p.team),line=-sg*(FL-PR);
  p.x=sg>0?clamp(p.x,line,line+240):clamp(p.x,line-240,line);
  p.y=clamp(p.y,-290,290);
 }else{p.x=clamp(p.x,-FL+PR,FL-PR);p.y=clamp(p.y,-FW+PR,FW-PR);}
}
function socCollisions(dt){
 const s=soc,b=s.ball;
 for(let i=0;i<s.pl.length;i++)for(let j=i+1;j<s.pl.length;j++){
  const a=s.pl[i],c=s.pl[j],dx=c.x-a.x,dy=c.y-a.y,d=hyp(dx,dy);
  if(d>=PR*2||d<0.01)continue;
  const push=PR*2-d,wa=c.st.wgt/(a.st.wgt+c.st.wgt);
  a.x-=dx/d*push*wa;a.y-=dy/d*push*wa;c.x+=dx/d*push*(1-wa);c.y+=dy/d*push*(1-wa);
 }
 // robar la pelota con el cuerpo
 const o=b.owner;
 if(o&&!o.gk&&s.phase==='play')for(const q of s.pl){
  if(q.team===o.team||q.stun>0||q.frozen>0||q.kickCD>0||(q.gk&&!o.gk&&Math.abs(q.x)<FL-240))continue;
  if(hyp(q.x-b.x,q.y-b.y)>PR+BR+4)continue;
  if(q.pwT>0){o.stun=1;socTake(q);SFX.hit();break;}
  if(o.pwT>0){q.stun=0.8;SFX.bump();continue;}
  const rate=(q.human>=0?3.2:2.2*(humanTeam(q.team)?1:[0.7,1,1.35][s.diff]))+0.25*(q.st.wgt-o.st.wgt);
  if(Math.random()<dt*Math.max(0.6,rate)){o.kickCD=0.45;socTake(q);SFX.bump();break;}
 }
 // súper carrera: tumba a los rivales que toca
 for(const p of s.pl){
  if(p.pwT<=0)continue;
  for(const q of s.pl)if(q.team!==p.team&&!q.gk&&q.stun<=0&&hyp(q.x-p.x,q.y-p.y)<PR*2+4){q.stun=1;SFX.bump();if(b.owner===q)socTake(p);}
 }
}
function socTake(p){
 const s=soc,b=s.ball;
 if(b.passTo===p&&b.last&&b.last.team===p.team)s.meter[p.team]=Math.min(1,s.meter[p.team]+0.05);
 b.owner=p;b.vx=b.vy=b.vz=0;b.z=0;b.passTo=null;b.superT=0;b.sup='';b.last=p;p.charge=-1;
 p.aiT=p.gk?0.7+Math.random()*0.4:0.25+Math.random()*0.9;
 if(humanTeam(p.team)&&!p.gk&&p.team<s.np)setCtl(p.team,p);
}
function socSwitch(t){
 const s=soc,b=s.ball;let best=null,bd=1e9;
 for(const p of s.pl){if(p.team!==t||p.gk||p===s.ctl[t])continue;const d=hyp(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p;}}
 if(best){setCtl(t,best);s.switchT[t]=1.2;SFX.sel();}
}
function socSlide(p,dx,dy){
 if(p.slideCD>0||p.gk)return;
 const a=(dx||dy)?Math.atan2(dy,dx):p.face;
 p.face=a;p.slide=0.42;p.slideCD=1.0;
 const sp=Math.max(hyp(p.vx,p.vy),p.top)*1.45;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;
 SFX.hop();socDust(p,6);
}
function socDust(p,n){
 const k=socK(p.y),x=SX(p.x,p.y),y=SY(p.y,0),c=CANCHAS[soc.field].outside;
 for(let i=0;i<n;i++)addPart(x+(Math.random()-0.5)*30*k,y,(Math.random()-0.5)*160,-60-Math.random()*120,0.45,c,5*k+2,500);
}

// ---------------- tiros, pases y súper tiro ----------------
function socShoot(p,pow,aimDy){
 const s=soc,b=s.ball;p.charge=-1;if(b.owner!==p)return;
 const sg=sgn(p.team),gx=sg*FL,fx=Math.cos(p.face),fy=Math.sin(p.face);let ang;
 if(fx*sg>0.15&&Math.abs(gx-p.x)<1000){
  let ty=aimDy?aimDy*GW*0.72:clamp(p.y+fy/Math.abs(fx)*Math.abs(gx-p.x)*0.5,-GW*0.7,GW*0.7);
  const noise=p.human>=0&&!s.allAI?0.22:humanTeam(p.team)?0.3:[0.6,0.38,0.2][s.diff];
  ty+=(Math.random()-0.5)*2*GW*noise;
  ang=Math.atan2(ty-p.y,gx-p.x);
 }else ang=p.face;
 const sp=620+680*pow+22*p.st.wgt;
 b.owner=null;b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp;b.vz=90+230*pow;b.z=6;
 b.last=p;b.passTo=null;p.kickCD=0.3;p.kickAnim=0.25;p.face=ang;
 sKick(pow);socDust(p,4);
}
function socPass(p,dx,dy,far){
 const s=soc,b=s.ball;if(b.owner!==p)return;
 const sg=sgn(p.team);let rx=dx,ry=dy;
 if(!rx&&!ry){rx=Math.cos(p.face);ry=Math.sin(p.face);}
 const m=hyp(rx,ry);rx/=m;ry/=m;
 let best=null,bs=-99;
 for(const t of s.pl){
  if(t===p||t.team!==p.team||t.gk||t.stun>0)continue;
  const vx=t.x-p.x,vy=t.y-p.y,d=hyp(vx,vy);if(d<1)continue;
  let sc=far?t.x*sg/FL-d/4000:(vx*rx+vy*ry)/d-d/1600;
  // que no haya un rival justo en el camino
  for(const q of s.pl)if(q.team!==p.team&&!q.gk){const u=((q.x-p.x)*vx+(q.y-p.y)*vy)/(d*d);if(u>0.1&&u<0.9&&hyp(p.x+vx*u-q.x,p.y+vy*u-q.y)<40)sc-=0.5;}
  if(sc>bs){bs=sc;best=t;}
 }
 if(!best){socShoot(p,0.3,0);return;}
 const lx=best.x+best.vx*0.35,ly=best.y+best.vy*0.35,ddx=lx-p.x,ddy=ly-p.y,dd=Math.max(1,hyp(ddx,ddy));
 const spd=clamp(dd*1.5+220,420,1000);
 b.owner=null;b.vx=ddx/dd*spd;b.vy=ddy/dd*spd;b.vz=dd>480?260:30;b.z=4;
 b.last=p;b.passTo=best;p.kickCD=0.3;p.kickAnim=0.2;p.face=Math.atan2(ddy,ddx);
 if(humanTeam(p.team)&&p.team<s.np)setCtl(p.team,best);
 sKick(0.2);
}
function socSuper(p){
 const s=soc,b=s.ball;if(s.meter[p.team]<1)return;
 s.meter[p.team]=0;
 const PW=POWERS[p.ch.id],ty=PW[0],col=PW_ICON[ty];
 SFX.power();showSMsg('¡'+PW[1].toUpperCase()+'!',col,1.6);s.flash=0.2;s.shake=0.3;
 if(b.owner===p){
  const sg=sgn(p.team),gx=sg*FL,ty2=(Math.random()<0.5?-1:1)*GW*(0.35+Math.random()*0.3);
  const ang=Math.atan2(ty2-p.y,gx-p.x),sp=ty==='laser'||ty==='kame'?2100:1500;
  b.owner=null;b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp;b.vz=ty==='fly'||ty==='acro'?380:70;b.z=8;
  b.last=p;b.passTo=null;b.superT=2.5;b.sup=ty;b.supCol=col;b.zig=0;b.teleT=ty==='tele'?0.22:0;
  p.kickCD=0.4;p.kickAnim=0.3;p.face=ang;sKick(1);
  if(ty==='freeze')for(const q of s.pl)if(q.team!==p.team&&!q.gk)q.frozen=2;
  if(ty==='shock')for(const q of s.pl)if(q.team!==p.team&&!q.gk&&hyp(q.x-p.x,q.y-p.y)<300)q.stun=1.3;
  if(ty==='magnet')s.meter[p.team]=0.3;
  if(ty==='ssj')p.pwT=2.5;
 }else p.pwT=3.5;   // sin la pelota: ¡súper carrera!
}
const superSave=ty=>ty==='ghost'?0.1:ty==='giant'||ty==='laser'||ty==='kame'?0.15:ty==='tele'?0.2:0.25;
const gkSkill=t=>humanTeam(t)?0.72:[0.55,0.7,0.84][soc.diff];

// ---------------- la pelota ----------------
function socBall(dt){
 const s=soc,b=s.ball;
 b.saveCD=Math.max(0,b.saveCD-dt);
 if(b.owner){
  const p=b.owner,r=PR+BR+2;
  b.x=p.x+Math.cos(p.face)*r;b.y=p.y+Math.sin(p.face)*r;b.z=Math.abs(Math.sin(p.run*2))*4;
  b.y=clamp(b.y,-FW+BR,FW-BR);if(Math.abs(b.y)>GW-BR)b.x=clamp(b.x,-FL+BR,FL-BR);
  b.vx=p.vx;b.vy=p.vy;b.spin+=hyp(p.vx,p.vy)*dt*0.03;b.trail=[];
  return;
 }
 if(b.superT>0){
  b.superT-=dt;
  b.trail.push([b.x,b.y,b.z]);if(b.trail.length>14)b.trail.shift();
  if(b.sup==='spin'){b.zig+=dt*14;b.y+=Math.cos(b.zig)*dt*420;}
  if(b.teleT>0){b.teleT-=dt;if(b.teleT<=0){const nx=clamp(b.x+b.vx*0.22,-FL+90,FL-90);for(let i=0;i<10;i++)addPart(SX(b.x,b.y),SY(b.y,b.z),(Math.random()-0.5)*300,(Math.random()-0.5)*300,0.5,b.supCol,6,0);b.x=nx;b.trail=[];}}
  if(hyp(b.vx,b.vy)<500)b.superT=0;
 }else if(b.trail.length)b.trail.shift();
 const oldAx=Math.abs(b.x);
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
 if(b.z>0||b.vz>0)b.vz-=(CANCHAS[s.field].moon?480:CANCHAS[s.field].heavy?2200:1100)*dt;
 if(b.z<=0){b.z=0;if(b.vz<-140)b.vz=-b.vz*0.5;else b.vz=0;}
 const fr=b.z<=0.5?(CANCHAS[s.field].ice?0.5:1.1):0.15,f=Math.exp(-fr*dt);
 b.vx*=f;b.vy*=f;b.spin+=hyp(b.vx,b.vy)*dt*0.03;
 // paredes laterales
 if(b.y>FW-BR){b.y=FW-BR;b.vy=-Math.abs(b.vy)*0.7;}
 if(b.y<-FW+BR){b.y=-FW+BR;b.vy=Math.abs(b.vy)*0.7;}
 const ax=Math.abs(b.x),side=b.x>0?1:-1;
 if(ax>FL&&oldAx<=FL&&(Math.abs(b.y)>GW-4||b.z>GH-4)){
  // pegó en la pared de al lado del arco (o por encima del travesaño)
  b.x=side*(FL-BR);b.vx=-b.vx*0.7;
 }else if(ax>FL){
  // adentro del arco: la red la frena
  if(ax>FL+GD-BR){b.x=side*(FL+GD-BR);b.vx=-b.vx*0.15;b.vy*=0.5;}
  if(Math.abs(b.y)>GW-BR){b.y=Math.sign(b.y)*(GW-BR);b.vy=-b.vy*0.3;}
  if(b.z>GH-BR){b.z=GH-BR;b.vz=-Math.abs(b.vz)*0.3;}
  if(ax>FL+BR&&s.phase==='play')socGoal(side>0?0:1);
 }else if(ax>FL-BR){
  const mouth=Math.abs(b.y)<GW-4&&b.z<GH-4;
  if(!mouth){b.x=side*(FL-BR);b.vx=-b.vx*0.7;if(b.z>GH-8&&b.z<GH+10&&Math.abs(b.y)<GW){b.vz=Math.abs(b.vz)*0.5+80;SFX.bump();}}
 }
 // postes
 for(const px of[-1,1])for(const py of[-1,1]){
  const dx=b.x-px*FL,dy=b.y-py*GW,d=hyp(dx,dy);
  if(d<BR+5&&d>0.01&&b.z<GH){
   const nx=dx/d,ny=dy/d,dot=b.vx*nx+b.vy*ny;
   if(dot<0){b.vx-=1.7*dot*nx;b.vy-=1.7*dot*ny;SFX.bump();}
   b.x=px*FL+nx*(BR+5);b.y=py*GW+ny*(BR+5);
  }
 }
}
function socTouches(){
 const s=soc,b=s.ball;if(b.owner||s.phase!=='play')return;
 const sp=hyp(b.vx,b.vy),big=b.sup==='giant'&&b.superT>0?BR:0;
 for(const p of s.pl){
  if(p.stun>0||p.frozen>0||p.kickCD>0)continue;
  const reach=PR+BR+big+(p.gk?16+(p.dive>0?14:0):6);
  if(b.z>(p.gk?110:40)||hyp(b.x-p.x,b.y-p.y)>reach)continue;
  const sup=b.superT>0&&b.last&&b.last.team!==p.team;
  if(p.gk){
   if(b.saveCD>0)continue;
   const shot=b.last&&b.last.team!==p.team&&sp>450;
   if(shot){
    const chance=sup?superSave(b.sup):clamp(gkSkill(p.team)+(1-sp/1500)*0.35,0.12,0.96);
    if(Math.random()>chance){b.saveCD=0.5;if(sup){p.stun=1.2;SFX.hit();}continue;}
    if(sup||sp>1000||Math.random()<0.4){
     b.vx=-b.vx*0.35;b.vy=b.vy*0.4+(Math.random()-0.5)*500;b.vz=200+Math.random()*150;b.superT=0;b.sup='';
     b.saveCD=0.35;b.last=p;b.passTo=null;p.kickCD=0.3;SFX.bump();showSMsg('¡ATAJADA!','#fff',1);continue;
    }
    showSMsg('¡ATAJADA!','#fff',1);
   }
   socTake(p);continue;
  }
  if(sup){p.stun=1.1;p.vx=b.vx*0.3;p.vy=b.vy*0.3;b.vx*=0.85;b.vy*=0.85;SFX.hit();continue;}
  socTake(p);
  return;
 }
}
function socGoal(team){
 const s=soc,b=s.ball;
 s.score[team]++;s.phase='goal';s.phaseT=3.2;s.kickTeam=1-team;s.lastGoalTeam=team;
 const sc=b.last,own=sc&&sc.team!==team;
 if(sc&&!own)sc.goals++;
 const min=Math.floor(s.clock/60)+1;
 s.log.push([team,(sc?sc.ch.name:'?')+(own?' (en contra)':''),min+"'"]);
 s.meter[1-team]=Math.min(1,s.meter[1-team]+0.25);

function socAI(p,dt){
 const s=soc,b=s.ball,sg=sgn(p.team);
 let tx,ty;const mul=humanTeam(p.team)||s.allAI?0.95:[0.84,0.94,1.02][s.diff];
 if(p.gk)[tx,ty]=socGK(p,dt);
 else if(b.owner===p){
  // con la pelota: avanzar hacia el arco rival
  tx=sg*FL-sg*60;ty=clamp(p.y*0.5,-GW*0.6,GW*0.6);
  let opp=null,od=1e9;
  for(const q of s.pl)if(q.team!==p.team){const d=hyp(q.x-p.x,q.y-p.y);if(d<od){od=d;opp=q;}}
  if(opp&&od<170&&(opp.x-p.x)*sg>-20)ty=p.y+(opp.y>p.y?-1:1)*220;
  const dg=hyp(sg*FL-p.x,p.y);
  p.aiT-=dt;
  if(s.meter[p.team]>=1&&dg<650&&dg>200&&!humanTeam(p.team))socSuper(p);
  else if(dg<430&&p.aiT<=0)socShoot(p,0.45+Math.random()*0.55,0);
  else if(opp&&od<75&&Math.random()<dt*2.2)socPass(p,sg,0);
  else if(Math.random()<dt*0.25)socPass(p,sg,0);
 }else{
  const mine=b.owner&&b.owner.team===p.team;
  if(!mine&&s.chaser[p.team]===p){
   const lead=b.owner?0.1:0.25;tx=b.x+b.vx*lead;ty=b.y+b.vy*lead;
   if(b.owner&&hyp(b.owner.x-p.x,b.owner.y-p.y)<85&&p.slideCD<=0){
    const rate=humanTeam(p.team)||s.allAI?1.6:[0.7,1.6,2.6][s.diff];
    if(Math.random()<dt*rate)socSlide(p,b.owner.x-p.x,b.owner.y-p.y);
   }
   if(s.meter[p.team]>=1&&b.owner&&!humanTeam(p.team)&&Math.random()<dt*0.4)socSuper(p);
  }else if(mine){
   // apoyar el ataque: buscar espacio adelante
   tx=clamp(b.x+sg*(190+p.slot*50),-FL+120,FL-140);ty=p.hy*1.1;
   if(hyp(tx-b.x,ty-b.y)<140)ty+=(p.slot===1?-1:1)*120;
  }else{
   // defender: entre la pelota y el arco propio
   tx=lerp(p.hx,b.x,0.5);ty=lerp(p.hy,b.y,0.45);
   tx=sg>0?Math.min(tx,b.x-90):Math.max(tx,b.x+90);
   tx=clamp(tx,-FL+60,FL-60);
  }
 }
 const ddx=tx-p.x,ddy=ty-p.y,dd=hyp(ddx,ddy);
 if(dd<8)return[0,0];
 const m=Math.min(1,dd/60)*mul;return[ddx/dd*m,ddy/dd*m];
}
function socGK(p,dt){
 const b=soc.ball,sg=sgn(p.team),gx=-sg*(FL-26);
 let tx=gx,ty=clamp(b.y*0.4,-GW*0.75,GW*0.75);
 if(b.owner===p){
  p.aiT-=dt;p.face=sg>0?0:Math.PI;
  if(p.aiT<=0)socPass(p,sg,0,true);
  return[p.x,p.y];
 }
 const depth=(b.x+sg*FL)*sg;   // distancia de la pelota a la línea del arco propio
 if(!b.owner&&depth<220&&Math.abs(b.y)<270&&hyp(b.vx,b.vy)<500){tx=b.x;ty=b.y;}
 else if(!b.owner&&b.vx*sg<-150){
  const t=(gx-b.x)/b.vx;
  if(t>0&&t<0.9){ty=clamp(b.y+b.vy*t,-GW-10,GW+10);if(t<0.35&&Math.abs(ty-p.y)>25)p.dive=0.3;}
 }else if(b.owner&&b.owner.team!==p.team&&depth<420){tx=gx+sg*45;ty=clamp(b.y*0.6,-GW*0.8,GW*0.8);}
 return[tx,ty];
}

function drawSBall(){

 }
 // minimapa
 const mw=150,mh=82,mx=W/2-mw/2,my=H-mh-10;
 rrF(mx-5,my-5,mw+10,mh+10,8,'rgba(0,0,0,.5)');ctx.fillStyle=hexA(cf.g1,0.9);ctx.fillRect(mx,my,mw,mh);
 ctx.strokeStyle=hexA(cf.line,0.8);ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);ctx.beginPath();ctx.moveTo(mx+mw/2,my);ctx.lineTo(mx+mw/2,my+mh);ctx.stroke();
 const gy=mh*GW/(2*FW);ctx.fillStyle='#fff';ctx.fillRect(mx-4,my+mh/2-gy,4,gy*2);ctx.fillRect(mx+mw,my+mh/2-gy,4,gy*2);
 for(const p of s.pl){

 }
 {const b=s.ball;circ(ctx,mx+clamp((b.x+FL)/(2*FL),-0.03,1.03)*mw,my+(b.y+FW)/(2*FW)*mh,2.8,'#fff');}
 // mensajes grandes
 if(s.msgT>0){

function socInput(up,dn,ok,bk){
 switch(state){
  case 'soccer':if(kp('Escape','KeyP')){state='spause';menu.p=0;SFX.sel();}break;
  case 'spause':
   if(up){menu.p=(menu.p+2)%3;SFX.sel();}if(dn){menu.p=(menu.p+1)%3;SFX.sel();}
   if(kp('Escape','KeyP')){state='soccer';break;}
   if(ok){if(menu.p===0)state='soccer';else if(menu.p===1)startSoccer(socTeams());else{soc=null;toMenu();}}
   break;
  case 'sres':
   if(soc.resT<1)break;
   if(kp('Enter','NumpadEnter')){SFX.ok();startSoccer(socTeams());}
   else if(bk){SFX.back();soc=null;toMenu();}
   break;
 }
}

let last=performance.now();
newDemo();playSong(0,0.9);
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
 if(innerWidth!==fitW||innerHeight!==fitH)fit();
 handleInput();
 if(isSoc()&&soc){if(state==='soccer')updateSoccer(dt);else if(state==='sres')soc.resT+=dt;}
 else if(state!=='pause'&&race)updateRace(dt);
 updateParts(dt);updateMusic();updateEngine();
 draw();
 for(const k in pressed)delete pressed[k];
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
