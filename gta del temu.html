      M.destino.visible = false;
      M.paquete.visible = false;
      if (!misionActiva) {
        let lista = MISIONES.filter(m => m.personaje === activo);
        lista.forEach((m, i) => {
          let l = lugarPx(m.inicio), marca = M.marcas[i];
          marca.visible = Math.hypot(l.x - cx, l.y - cy) > 24;   // no taparte la vista si estás parado adentro
          marca.material.color.set(PERSONAJES[activo].color);
          marca.position.set(l.x, 35 + Math.sin(cuadro * 0.05) * 2, l.y);
        });
      } else if (pasoActual && pasoActual.lugar) {
        let l = lugarPx(pasoActual.lugar);
        M.destino.visible = Math.hypot(l.x - cx, l.y - cy) > 34;
        M.destino.position.set(l.x, 300, l.y);
        if (pasoActual.paquete) {
          M.paquete.visible = true;
          M.paquete.position.set(l.x, 8 + Math.sin(cuadro * 0.08) * 2, l.y);
          M.paquete.rotation.y = cuadro * 0.03;
        }
      }

      M.renderer.render(M.escena, camara);
    }

    // Convierte una posición del mundo 3D a un punto de la pantalla
    function aPantalla3D(x, alto, y) {
      let v = new THREE.Vector3(x, alto, y).project(mundo3D.camara);
      if (v.z > 1 || v.z < -1 || Math.abs(v.x) > 1.2 || Math.abs(v.y) > 1.2) return null;
      return { x: (v.x + 1) / 2 * PW, y: (1 - v.y) / 2 * PH };
    }

    // Globitos de texto y nombres encima de las personas en 3D
    function dibujarEtiquetas3D() {
      let p = posJugador();
      for (let b of burbujas) {
        if (Math.hypot(b.obj.x - p.x, b.obj.y - p.y) > 450 || b.obj === jugadorActual()) continue;
        let s = aPantalla3D(b.obj.x, b.obj.w ? 30 : 27, b.obj.y);
        if (!s) continue;
        ctx.font = "bold 16px Arial";
        let ancho = ctx.measureText(b.texto).width + 18;
        ctx.globalAlpha = Math.min(1, b.t / 20);
        ctx.fillStyle = "white";
        rectRedondo(s.x - ancho / 2, s.y - 30, ancho, 28, 8);
        ctx.fill();
        ctx.beginPath(); ctx.moveTo(s.x - 6, s.y - 2); ctx.lineTo(s.x, s.y + 7); ctx.lineTo(s.x + 6, s.y - 2); ctx.fill();
        ctx.fillStyle = "#222";
        ctx.textAlign = "center";
        ctx.fillText(b.texto, s.x, s.y - 10);
        ctx.textAlign = "left";
        ctx.globalAlpha = 1;
      }
      // Lo que dice tu propio personaje sale abajo, como subtítulo
      let propio = burbujas.find(b => b.obj === jugadorActual() || b.obj === jugadorActual().carro);
      if (propio) {
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        texto(PERSONAJES[activo].nombre + ": " + propio.texto, PW / 2, PH - 140);
        ctx.textAlign = "left";
      }
      // Nombres de los otros protagonistas
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "center";
      jugadores.forEach((j, i) => {
        if (i === activo) return;
        let q = posJugador(i);
        if (Math.hypot(q.x - p.x, q.y - p.y) > 600) return;
        let s = aPantalla3D(q.x, 28, q.y);
        if (s) texto(PERSONAJES[i].nombre, s.x, s.y);
      });
      ctx.textAlign = "left";
    }

    // Volante del carro (abajo de la pantalla)
    function dibujarVolante() {
      let W = PW, H = PH;
      let giro = (tecla("ArrowRight", "KeyD") ? 1 : 0) - (tecla("ArrowLeft", "KeyA") ? 1 : 0);
      volante += (giro * 0.9 - volante) * 0.15;
      let r = Math.min(W, H) * 0.2;
      ctx.save();
      ctx.translate(W / 2, H + r * 0.35);
      ctx.rotate(volante);
      ctx.strokeStyle = "#1b1b1b";
      ctx.lineWidth = r * 0.16;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#333";
      ctx.lineWidth = r * 0.05;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.03, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.fillStyle = "#1b1b1b";
      ctx.fillRect(-r, -r * 0.06, r * 2, r * 0.12);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#b71c1c";
      ctx.beginPath(); ctx.arc(0, 0, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Brújula arriba que apunta al destino de la misión
    function dibujarFlecha3D(paso) {
      if (!paso.lugar) return;
      let l = lugarPx(paso.lugar), p = posJugador();
      let j = jugadorActual();
      let yaw = j.carro ? j.carro.ang + mirarLado : mirarYaw;
      let rel = diferenciaAngulo(yaw, Math.atan2(l.y - p.y, l.x - p.x));
      let x = PW / 2, y = misionActiva.tiempo > 0 ? 130 : 100;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rel);
      ctx.fillStyle = "#ffeb3b";
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -24); ctx.lineTo(16, 12); ctx.lineTo(0, 4); ctx.lineTo(-16, 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      texto(Math.round(Math.hypot(l.x - p.x, l.y - p.y) / 10) + " m", x, y + 36);
      ctx.textAlign = "left";
    }

    // 23. EL BUCLE DEL JUEGO (siempre 60 pasos por segundo)
    function paso() {
      cuadro++;
      if (estado !== "jugando" && document.pointerLockElement) document.exitPointerLock();
      if (estado === "jugando") actualizar();
      else if (estado === "cambiando") actualizarCambio();
      else if (estado === "casa") actualizarCasa();
      else if (estado === "inicio") {
        // Que el tráfico se mueva de fondo en la pantalla de inicio
        for (let c of carros) if (c.conductor === "npc" && c.ai) actualizarTrafico(c);
        actualizarPeatones();
      }
    }

    let tiempoAnterior = performance.now();
    let acumulado = 0;
    function bucle(ahora) {
      acumulado += Math.min(100, ahora - tiempoAnterior);
      tiempoAnterior = ahora;
      while (acumulado >= 1000 / 60) {
        paso();
        acumulado -= 1000 / 60;
      }
      dibujar();
      requestAnimationFrame(bucle);
    }

    // 24. ¡EMPEZAR!
    ajustarPantalla();
    construirCiudad();
    prepararMapa();
    nuevoMundo();
    requestAnimationFrame(bucle);
  </script>
