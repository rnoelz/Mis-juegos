    function ropaDeProtagonista(i) {
      let p = PERSONAJES[i];
      return { camisa: p.camisa, piel: p.piel, pelo: p.pelo, gorra: p.gorra, escala: p.escala, ancho: p.ancho, bigote: p.bigote, lentes: p.lentes };
    }
    const ROPA_FAMILIA = {
      esposa: { camisa: "#8e24aa", piel: "#c68642", pelo: "#111", escala: 0.95, vestido: true, pelolargo: true },
      hijo:   { camisa: "#43a047", piel: "#a0522d", pelo: "#2b1b0e", escala: 0.62 },
      hija:   { camisa: "#ff7043", piel: "#a0522d", pelo: "#111", escala: 0.6, pelolargo: true }
    };

    // Marcas en el suelo (misiones y destinos)
    function dibujarMarca(x, y, color, letra, grande) {
      let pulso = 1 + Math.sin(cuadro * 0.1) * 0.12;
      let r = (grande ? 34 : 24) * pulso;
      ctx.fillStyle = color + "55";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      if (letra) {
        ctx.fillStyle = "white";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText(letra, x, y + 6);
        ctx.textAlign = "left";
      }
    }

    function dibujarBurbuja(b) {
      let x = b.obj.x, y = b.obj.y - 40;
      ctx.font = "bold 14px Arial";
      let ancho = ctx.measureText(b.texto).width + 16;
      ctx.globalAlpha = Math.min(1, b.t / 20);
      ctx.fillStyle = "white";
      rectRedondo(x - ancho / 2, y - 22, ancho, 26, 8);
      ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 6, y + 3); ctx.lineTo(x, y + 12); ctx.lineTo(x + 6, y + 3); ctx.fill();
      ctx.fillStyle = "#222";
      ctx.textAlign = "center";
      ctx.fillText(b.texto, x, y - 4);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;
    }

    // 19. DIBUJAR EL MUNDO
    function escalaBase() {
      return Math.max(0.6, PH / 820);
    }

    function dibujarMundo(cx, cy, esc) {
      let W = PW, H = PH;
      let sacudida = temblor > 0 ? (Math.random() - 0.5) * temblor : 0;
      ctx.setTransform(esc * RES, 0, 0, esc * RES, (W / 2 - cx * esc + sacudida) * RES, (H / 2 - cy * esc + sacudida) * RES);

      // Parte visible del mapa
      let izq = cx - W / 2 / esc, arriba = cy - H / 2 / esc;
      let ancho = W / esc, alto = H / esc;
      let sx = Math.max(0, Math.floor(izq)), sy = Math.max(0, Math.floor(arriba));
      let sw = Math.min(COLUMNAS * T - sx, Math.ceil(ancho) + 2), sh = Math.min(FILAS * T - sy, Math.ceil(alto) + 2);
      if (sw > 0 && sh > 0) ctx.drawImage(lienzoMapa, sx * DETALLE, sy * DETALLE, sw * DETALLE, sh * DETALLE, sx, sy, sw, sh);

      // Olitas en el mar
      ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 2;
      for (let ty = Math.max(0, Math.floor(arriba / T)); ty < Math.min(FILAS, (arriba + alto) / T + 1); ty++) {
        for (let tx = Math.max(0, Math.floor(izq / T)); tx < Math.min(COLUMNAS, (izq + ancho) / T + 1); tx++) {
          if (mapa[ty][tx] !== "~") continue;
          let ox = ((tx * 37 + ty * 17) % 40) + Math.sin(cuadro * 0.03 + tx) * 6;
          ctx.beginPath();
          ctx.arc(tx * T + ox + 10, ty * T + 30 + ((tx * 13) % 20), 7, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
        }
      }

      let visible = (x, y) => x > izq - 80 && x < izq + ancho + 80 && y > arriba - 80 && y < arriba + alto + 80;

      // Marcas de misión del personaje activo
      if (!misionActiva && estado !== "inicio") {
        for (let m of MISIONES) {
          if (m.personaje !== activo) continue;
          let l = lugarPx(m.inicio);
          if (visible(l.x, l.y)) dibujarMarca(l.x, l.y, PERSONAJES[activo].color, misionesHechas.includes(m.id) ? "✓" : "!", false);
        }
      }
      // Casa del personaje activo
      let casa = lugarPx(PERSONAJES[activo].casa);
      if (visible(casa.x, casa.y) && estado !== "inicio") {
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.beginPath(); ctx.arc(casa.x, casa.y, 18, 0, Math.PI * 2); ctx.fill();
      }

      // Destino de la misión
      if (misionActiva) {
        let paso = misionActiva.m.pasos[misionActiva.paso];
        if (paso.lugar) {
          let l = lugarPx(paso.lugar);
          if (paso.paquete) {
            ctx.fillStyle = "#a1887f";
            ctx.fillRect(l.x - 12, l.y - 12, 24, 24);
            ctx.strokeStyle = "#5d4037"; ctx.lineWidth = 3;
            ctx.strokeRect(l.x - 12, l.y - 12, 24, 24);
          }
          if (paso.pasajero) dibujarPersona(l.x + 20, l.y - 20, Math.PI / 2, 0, { camisa: "#00897b", piel: "#e0ac69", pelo: "#555" });
          dibujarMarca(l.x, l.y, "#ffeb3b", "", true);
        }
      }

      // Gente
      for (let pe of peatones) if (visible(pe.x, pe.y)) dibujarPersona(pe.x, pe.y, pe.ang, pe.paso, pe);
      for (let f of posicionesFamilia()) if (visible(f.x, f.y)) dibujarPersona(f.x, f.y, f.ang, cuadro * 0.1, ROPA_FAMILIA[f.quien]);

      // Protagonistas a pie
      jugadores.forEach((j, i) => {
        if (j.carro || estado === "inicio") return;
        let parpadeo = i === activo || true;
        if (parpadeo && visible(j.x, j.y)) dibujarPersona(j.x, j.y, j.ang, j.paso, ropaDeProtagonista(i));
      });

      // Carros
      for (let c of carros) if (visible(c.x, c.y)) dibujarCarro(c);

      // Nombres de los protagonistas
      if (estado !== "inicio") {
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        jugadores.forEach((j, i) => {
          let p = posJugador(i);
          if (!visible(p.x, p.y)) return;
          ctx.fillStyle = i === activo ? "#ffeb3b" : "white";
          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(0, 0, 0, 0.7)";
          ctx.strokeText(PERSONAJES[i].nombre, p.x, p.y - 26);
          ctx.fillText(PERSONAJES[i].nombre, p.x, p.y - 26);
        });
        // Letrero de las casas
        ctx.font = "bold 16px Arial";
        for (let i = 0; i < PERSONAJES.length; i++) {
          let c = lugarPx(PERSONAJES[i].casa);
          if (!visible(c.x, c.y)) continue;
          ctx.fillStyle = PERSONAJES[i].colorClaro;
          let nombreCasa = PERSONAJES[i].nombreCasa;
          ctx.strokeText(nombreCasa, c.x, c.y - 100);
          ctx.fillText(nombreCasa, c.x, c.y - 100);
        }
        ctx.textAlign = "left";
      }

      // Globitos de texto
      for (let b of burbujas) if (visible(b.obj.x, b.obj.y)) dibujarBurbuja(b);
    }

    // 20. PANTALLA: HUD, MINIMAPA Y MENÚS
    function texto(t, x, y) {
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
      ctx.strokeText(t, x, y);
      ctx.fillStyle = "white";
      ctx.fillText(t, x, y);
    }

    function dibujarEstrellaForma(x, y, r, llena) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        let radio = i % 2 === 0 ? r : r * 0.45;
        let a = -Math.PI / 2 + i * Math.PI / 5;
        ctx.lineTo(x + Math.cos(a) * radio, y + Math.sin(a) * radio);
      }
      ctx.closePath();
      ctx.fillStyle = llena ? "#ffd600" : "rgba(0, 0, 0, 0.35)";
      ctx.fill();
      ctx.strokeStyle = llena ? "#795548" : "rgba(255, 255, 255, 0.5)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function dinero(n) {
      return "L. " + n.toLocaleString("es-HN");
    }

    function dibujarHUD() {
      let W = PW, H = PH;
      let j = jugadorActual();

      dibujarPanelPersonaje();

      // Estrellas de la policía
      for (let i = 0; i < 5; i++) {
        let lleno = i < estrellas;
        let parpadea = lleno && tiempoEscondido > 200 && Math.floor(cuadro / 10) % 2 === 0;
        dibujarEstrellaForma(W - 150 + i * 28, 36, 12, lleno && !parpadea);
      }
      if (arresto > 0) {
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "right";
        texto("¡Te están agarrando! ¡Muévete!", W - 16, 72);
        ctx.textAlign = "left";
      }
      dibujarRestoHUD(j, W, H);
    }

    // Personaje y dinero (arriba a la izquierda)
    function dibujarPanelPersonaje() {
      let j = jugadorActual();
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      rectRedondo(14, 14, 250, 74, 12);
      ctx.fill();
      ctx.save();
      ctx.translate(50, 51);
      ctx.scale(2, 2);
      dibujarPersona(0, 0, -Math.PI / 2, 0, ropaDeProtagonista(activo));
      ctx.restore();
      ctx.font = "bold 22px Arial";
      texto(PERSONAJES[activo].nombre, 90, 44);
      ctx.font = "bold 20px Arial";
      ctx.fillStyle = "#69f0ae";
      ctx.fillText(dinero(j.dinero), 90, 72);
    }

    function dibujarRestoHUD(j, W, H) {
      // Velocidad
      if (j.carro) {
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "right";
        texto(Math.round(Math.abs(j.carro.vel) * 16) + " km/h", W - 20, H - 24);
        ctx.textAlign = "left";
      }

      // Misión
      if (misionActiva) {
        let paso = misionActiva.m.pasos[misionActiva.paso];
        let t = paso.texto;
        if (paso.bus && !(j.carro && j.carro.tipo === "bus")) t += "  (necesitas tu bus: está en la Terminal)";
        else if (paso.carro && !j.carro) t += "  (necesitas un carro)";
        ctx.font = "bold 20px Arial";
        let ancho = ctx.measureText(t).width + 40;
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        rectRedondo(W / 2 - ancho / 2, 14, ancho, 40, 10);
        ctx.fill();
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffeb3b";
        ctx.fillText(t, W / 2, 41);
        if (misionActiva.tiempo > 0) {
          let s = Math.ceil(misionActiva.tiempo / 60);
          ctx.font = "bold 26px Arial";
          ctx.fillStyle = s <= 10 ? "#ff5252" : "white";
          ctx.fillText(Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"), W / 2, 86);
        }
        ctx.textAlign = "left";
        if (vista3D) dibujarFlecha3D(paso);
        else dibujarFlechaDestino(paso);
      } else {
        // ¿Hay una misión para empezar aquí?
        let p = posJugador();
        for (let m of MISIONES) {
          if (m.personaje !== activo) continue;
          let l = lugarPx(m.inicio);
          if (Math.hypot(p.x - l.x, p.y - l.y) < 50) {
            ctx.font = "bold 20px Arial";
            ctx.textAlign = "center";
            texto("Presiona E para empezar: " + m.nombre + (misionesHechas.includes(m.id) ? " (otra vez)" : ""), W / 2, H - 110);
            ctx.textAlign = "left";
          }
        }
        let casa = lugarPx(PERSONAJES[activo].casa);
        if (!j.carro && Math.hypot(p.x - casa.x, p.y - casa.y) < 45) {
          ctx.font = "bold 20px Arial";
          ctx.textAlign = "center";
          texto("Presiona E para entrar a tu casa", W / 2, H - 110);
          ctx.textAlign = "left";
        }
      }

      // Nombre del lugar
      if (zonaCuadros > 0) {
        ctx.globalAlpha = Math.min(1, zonaCuadros / 30);
        ctx.font = "bold italic 30px Arial";
        ctx.textAlign = "right";
        texto(zonaActual, W - 20, H - 60);
        ctx.textAlign = "left";
        ctx.globalAlpha = 1;
      }

      dibujarMinimapa();
      dibujarAviso();
    }

    // Aviso grande
    function dibujarAviso() {
      let W = PW, H = PH;
      if (aviso) {
        aviso.t--;
        ctx.globalAlpha = Math.min(1, aviso.t / 30);
        ctx.textAlign = "center";
        ctx.font = "bold 40px Arial";
        texto(aviso.titulo, W / 2, H * 0.28);
        ctx.font = "22px Arial";
        texto(aviso.texto, W / 2, H * 0.28 + 38);
        ctx.textAlign = "left";
        ctx.globalAlpha = 1;
        if (aviso.t <= 0) aviso = null;
      }
    }

    // Flecha en la orilla de la pantalla que apunta al destino
    function dibujarFlechaDestino(paso) {
      if (!paso.lugar) return;
      let l = lugarPx(paso.lugar);
      let esc = escalaBase() * zoom;
      let sx = PW / 2 + (l.x - camX) * esc, sy = PH / 2 + (l.y - camY) * esc;
      let margen = 60;
      if (sx > margen && sx < PW - margen && sy > margen && sy < PH - margen) return;
      let ang = Math.atan2(sy - PH / 2, sx - PW / 2);
      let r = Math.min(PW, PH) / 2 - 50;
      let ax = PW / 2 + Math.cos(ang) * r, ay = PH / 2 + Math.sin(ang) * r;
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(ang);
      ctx.fillStyle = "#ffeb3b";
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(22, 0); ctx.lineTo(-12, -16); ctx.lineTo(-4, 0); ctx.lineTo(-12, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function puntitoMapa(x, y, color, r, letra) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      if (letra) {
        ctx.fillStyle = "#111";
        ctx.font = "bold " + Math.round(r * 1.3) + "px Arial";
        ctx.textAlign = "center";
        ctx.fillText(letra, x, y + r * 0.45);
        ctx.textAlign = "left";
      }
    }

    // Dibuja los puntitos (protagonistas, misión, policía) con una función que convierte posiciones
    function dibujarPuntitos(aPantalla, r) {
      for (let c of carros) if (c.tipo === "policia") {
        let p = aPantalla(c.x, c.y);
        puntitoMapa(p.x, p.y, Math.floor(cuadro / 8) % 2 ? "#ff1744" : "#2979ff", r * 0.7);
      }
      if (misionActiva) {
        let paso = misionActiva.m.pasos[misionActiva.paso];
        if (paso.lugar) { let l = lugarPx(paso.lugar), p = aPantalla(l.x, l.y); puntitoMapa(p.x, p.y, "#ffeb3b", r * 1.1); }
      } else {
        for (let m of MISIONES) if (m.personaje === activo) {
          let l = lugarPx(m.inicio), p = aPantalla(l.x, l.y);
          puntitoMapa(p.x, p.y, PERSONAJES[activo].color, r * 0.8, misionesHechas.includes(m.id) ? "✓" : "!");
        }
      }
      for (let i = 0; i < PERSONAJES.length; i++) {
        let c = lugarPx(PERSONAJES[i].casa), p = aPantalla(c.x, c.y);
        puntitoMapa(p.x, p.y, "#ffffff", r * 0.7, "⌂");
      }
      for (let i = 0; i < PERSONAJES.length; i++) {
        let pos = posJugador(i), p = aPantalla(pos.x, pos.y);
        if (i === activo) {
          // Flechita que muestra hacia dónde miras
          let a = jugadores[i].carro ? jugadores[i].carro.ang : (vista3D ? mirarYaw : jugadores[i].ang);
          ctx.fillStyle = "white";
          ctx.beginPath();
          ctx.moveTo(p.x + Math.cos(a) * r * 2.6, p.y + Math.sin(a) * r * 2.6);
          ctx.lineTo(p.x + Math.cos(a + 2.5) * r * 1.3, p.y + Math.sin(a + 2.5) * r * 1.3);
          ctx.lineTo(p.x + Math.cos(a - 2.5) * r * 1.3, p.y + Math.sin(a - 2.5) * r * 1.3);
          ctx.fill();
        }
        puntitoMapa(p.x, p.y, PERSONAJES[i].camisa, i === activo ? r * 1.2 : r * 0.9, PERSONAJES[i].letra);
      }
    }

    function dibujarMinimapa() {
      let W = PW, H = PH;
      let mw = Math.min(260, W * 0.25), mh = mw * 0.72;
      let x0 = 16, y0 = H - mh - 16;
      let p = posJugador();
      let zoomMini = 1.6;   // pixeles del minimapa por cada 4 del lienzoMini
      ctx.save();
      rectRedondo(x0, y0, mw, mh, 12);
      ctx.fillStyle = "#0d47a1";
      ctx.fill();
      ctx.clip();
      let cx = p.x / T * MINI * zoomMini, cy = p.y / T * MINI * zoomMini;
      ctx.drawImage(lienzoMini, x0 + mw / 2 - cx, y0 + mh / 2 - cy, lienzoMini.width * zoomMini, lienzoMini.height * zoomMini);
      dibujarPuntitos((wx, wy) => ({ x: x0 + mw / 2 + (wx - p.x) / T * MINI * zoomMini, y: y0 + mh / 2 + (wy - p.y) / T * MINI * zoomMini }), 6);
      ctx.restore();
      ctx.strokeStyle = "white";
      ctx.lineWidth = 3;
      rectRedondo(x0, y0, mw, mh, 12);
      ctx.stroke();
      ctx.font = "12px Arial";
      texto("M = mapa", x0 + 8, y0 - 6);
    }

    function dibujarMapaGrande() {
      let W = PW, H = PH;
      ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
      ctx.fillRect(0, 0, W, H);
      let esc = Math.min((W - 80) / lienzoMini.width, (H - 120) / lienzoMini.height);
      let mw = lienzoMini.width * esc, mh = lienzoMini.height * esc;
      let x0 = (W - mw) / 2, y0 = 70;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(lienzoMini, x0, y0, mw, mh);
      ctx.imageSmoothingEnabled = true;
      ctx.strokeStyle = "white";
      ctx.lineWidth = 3;
      ctx.strokeRect(x0, y0, mw, mh);

      let aPantalla = (wx, wy) => ({ x: x0 + wx / T * MINI * esc, y: y0 + wy / T * MINI * esc });
      // Nombres de lugares
      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center";
      const nombres = [["Camaroneras", 3.5, 21], ["Panamericana CA-1", 32, 4.8], ["Parque Central", 23.5, 25.5], ["Mercado", 33.5, 24],
                       ["Escuela", 43.5, 16], ["Alcaldía", 33.5, 16], ["Hotel Morazán", 23.5, 16], ["Gasolinera", 23, 7.5],
                       ["Puerto de Henecán", 56, 33], ["Paseo La Cabaña", 28, 38.8], ["Golfo de Fonseca", 30, 44], ["Bodegas", 56, 12], ["Terminal", 33.5, 33]];
      for (let n of nombres) { let p = aPantalla(n[1] * T, n[2] * T); texto(n[0], p.x, p.y); }
      ctx.textAlign = "left";
      dibujarPuntitos(aPantalla, 9);

      ctx.font = "bold 30px Arial";
      ctx.textAlign = "center";
      texto("San Lorenzo, Valle", W / 2, 48);
      ctx.font = "16px Arial";
      texto("F = El Flaco   W = Willito   C = El Chevez   Y = Yoni   ⌂ = casas   ! = misiones   amarillo = destino      (M o Backspace para cerrar)", W / 2, H - 20);
      ctx.textAlign = "left";
    }

    function dibujarPanel(titulo, lineas) {
      let W = PW, H = PH;
      ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "white";
      ctx.font = "bold 44px Arial";
      ctx.fillText(titulo, W / 2, H / 2 - 40 - lineas.length * 16);
      ctx.font = "22px Arial";
      for (let i = 0; i < lineas.length; i++) ctx.fillText(lineas[i], W / 2, H / 2 - lineas.length * 16 + 10 + i * 34);
      ctx.textAlign = "left";
    }

    const CONTROLES = [
      "Flechas o W A S D: caminar / manejar",
      "Shift: correr   ·   Espacio: freno de mano   ·   Q: bocina",
      "E: subir o bajar del carro · empezar misión · entrar a tu casa",
      "1, 2, 3, 4 o Tab: cambiar de personaje",
      "V: primera persona 3D / vista de arriba   ·   Mouse (haz clic): mirar",
      "M: mapa   ·   Backspace: menú de pausa"
    ];

    function dibujarMenu() {
      let W = PW, H = PH;
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "white";
      ctx.font = "bold 48px Arial";
      ctx.fillText("⏸ PAUSA", W / 2, H / 2 - 170);
      ctx.font = "26px Arial";
      for (let i = 0; i < OPCIONES_MENU.length; i++) {
        let y = H / 2 - 90 + i * 56;
        let apagada = i === 3 && !misionActiva;
        if (i === opcionMenu) {
          ctx.fillStyle = "rgba(255, 215, 0, 0.2)";
          ctx.strokeStyle = "gold";
          ctx.lineWidth = 2;
          rectRedondo(W / 2 - 200, y - 34, 400, 48, 12);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "gold";
        } else {
          ctx.fillStyle = apagada ? "#777" : "white";
        }
        ctx.fillText(OPCIONES_MENU[i], W / 2, y);
      }
      ctx.fillStyle = "#bbb";
      ctx.font = "18px Arial";
      ctx.fillText("↑ ↓ para moverte   ·   Enter para elegir   ·   Backspace para volver", W / 2, H / 2 + 200);
      ctx.textAlign = "left";
    }

    function dibujarInicio() {
      let W = PW, H = PH;
      ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.font = "bold 72px Arial";
      ctx.fillStyle = "#ffeb3b";
      ctx.lineWidth = 8;
      ctx.strokeStyle = "#000";
      ctx.strokeText("GTA DEL TEMU", W / 2, H * 0.17);
      ctx.fillText("GTA DEL TEMU", W / 2, H * 0.17);
      ctx.font = "italic 26px Arial";
      ctx.fillStyle = "white";
      ctx.fillText("San Lorenzo, Valle - Honduras", W / 2, H * 0.17 + 40);

      // Los 4 protagonistas
      let separacion = Math.min(270, W / 4.2);
      for (let i = 0; i < PERSONAJES.length; i++) {
        let x = W / 2 + (i - (PERSONAJES.length - 1) / 2) * separacion, y = H * 0.42;
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        rectRedondo(x - separacion / 2 + 8, y - 80, separacion - 16, 190, 16);
        ctx.fill();
        ctx.save();
        ctx.translate(x, y - 10);
        ctx.scale(3.4, 3.4);
        dibujarPersona(0, 0, -Math.PI / 2 + Math.sin(cuadro * 0.03 + i) * 0.3, cuadro * 0.1, ropaDeProtagonista(i));
        ctx.restore();
        ctx.fillStyle = PERSONAJES[i].camisa;
        ctx.font = "bold 26px Arial";
        ctx.fillText(PERSONAJES[i].nombre, x, y + 70);
        ctx.fillStyle = "#ddd";
        ctx.font = "15px Arial";
        ctx.fillText(PERSONAJES[i].descripcion, x, y + 94);
      }

      ctx.font = "18px Arial";
      ctx.fillStyle = "white";
      for (let i = 0; i < CONTROLES.length; i++) ctx.fillText(CONTROLES[i], W / 2, H * 0.64 + i * 25);
      ctx.font = "bold 28px Arial";
      ctx.fillStyle = Math.floor(cuadro / 30) % 2 ? "#ffeb3b" : "white";
      ctx.fillText("Presiona Enter para jugar", W / 2, H * 0.64 + CONTROLES.length * 25 + 28);
      ctx.textAlign = "left";
    }

    // 20b. DIBUJAR LA CASA POR DENTRO
    function dibujarPisoCasa(l, x, y, I) {
      let px = x * CELDA, py = y * CELDA, C = CELDA;
      if (l === "m" || l === "p") {
        // Tablas de madera
        for (let i = 0; i < 4; i++) {
          ctx.fillStyle = (x + i) % 2 ? "#b5814f" : "#a97443";
          ctx.fillRect(px, py + i * 10, C, 10);
          ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
          ctx.fillRect(px, py + i * 10 + 9, C, 1);
          ctx.fillRect(px + ((x * 17 + i * 23) % C), py + i * 10, 1, 9);
        }
        if (l === "p") {
          ctx.fillStyle = "#6d4c41";
          rectRedondo(px + 4, py + 2, C - 8, 16, 3); ctx.fill();
          ctx.strokeStyle = "#a1887f"; ctx.lineWidth = 1;
          rectRedondo(px + 6, py + 4, C - 12, 12, 2); ctx.stroke();
        }
      } else if (l === "c") {
        // Azulejo de cuadritos
        for (let i = 0; i < 2; i++) for (let k = 0; k < 2; k++) {
          ctx.fillStyle = (x * 2 + i + y * 2 + k) % 2 ? "#eceff1" : "#90a4ae";
          ctx.fillRect(px + i * 20, py + k * 20, 20, 20);
        }
      } else if (l === "b") {
        ctx.fillStyle = "#b3e5fc";
        ctx.fillRect(px, py, C, C);
        ctx.strokeStyle = "#81d4fa"; ctx.lineWidth = 1;
        for (let i = 0; i <= C; i += 10) {
          ctx.beginPath(); ctx.moveTo(px + i, py); ctx.lineTo(px + i, py + C); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(px, py + i); ctx.lineTo(px + C, py + i); ctx.stroke();
        }
      } else if (l === "a" || l === "k") {
        // Alfombra suave
        ctx.fillStyle = l === "a" ? PERSONAJES[I.casa].colorClaro : "#c5e1a5";
        ctx.fillRect(px, py, C, C);
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        for (let i = 0; i < 6; i++) ctx.fillRect(px + ((x * 31 + i * 13) % 37), py + ((y * 17 + i * 11) % 37), 3, 3);
      }
    }

    function dibujarMueble(m, I) {
      let x = m.x * CELDA, y = m.y * CELDA, w = m.w * CELDA, h = m.h * CELDA;
      let colorCasa = PERSONAJES[I.casa].color;
      if (!m.piso) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
        rectRedondo(x + 4, y + 5, w, h, 5); ctx.fill();
      }
      switch (m.tipo) {
        case "cama": case "camita": {
          ctx.fillStyle = "#6d4c41"; rectRedondo(x, y, w, h, 5); ctx.fill();
          ctx.fillStyle = "#fafafa"; rectRedondo(x + 4, y + 4, w - 8, h - 8, 4); ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "#cfd8dc"; ctx.lineWidth = 1;
          let almohadas = m.tipo === "cama" ? 2 : 1, aw = (w - 12 - (almohadas - 1) * 4) / almohadas;
          for (let i = 0; i < almohadas; i++) { rectRedondo(x + 6 + i * (aw + 4), y + 7, aw, 18, 6); ctx.fill(); ctx.stroke(); }
          ctx.fillStyle = m.color || colorCasa;
          rectRedondo(x + 4, y + h * 0.36, w - 8, h * 0.64 - 4, 4); ctx.fill();
          ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
          ctx.fillRect(x + 4, y + h * 0.36, w - 8, 5);
          ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
          for (let i = 1; i < 4; i++) ctx.fillRect(x + 4, y + h * 0.36 + i * (h * 0.16), w - 8, 2);
          break;
        }
        case "mesita":
          ctx.fillStyle = "#8d6e63"; rectRedondo(x, y, w, h, 3); ctx.fill();
          ctx.fillStyle = "rgba(255, 236, 179, 0.35)";
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 24, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff8e1"; ctx.strokeStyle = "#bcaaa4"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          break;
        case "ropero":
          ctx.fillStyle = "#795548"; rectRedondo(x, y, w, h, 3); ctx.fill();
          ctx.fillStyle = "#8d6e63"; ctx.fillRect(x + 3, y + 3, w / 2 - 4, h - 6); ctx.fillRect(x + w / 2 + 1, y + 3, w / 2 - 4, h - 6);
          ctx.fillStyle = "#ffd54f";
          ctx.beginPath(); ctx.arc(x + w / 2 - 4, y + h - 9, 2, 0, Math.PI * 2); ctx.arc(x + w / 2 + 4, y + h - 9, 2, 0, Math.PI * 2); ctx.fill();
          break;
        case "inodoro":
          ctx.fillStyle = "#eceff1"; rectRedondo(x + 3, y, w - 6, h * 0.32, 3); ctx.fill();
          ctx.fillStyle = "#fafafa";
          ctx.beginPath(); ctx.ellipse(x + w / 2, y + h * 0.64, w * 0.4, h * 0.36, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#b0bec5"; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = "#b3e5fc";
          ctx.beginPath(); ctx.ellipse(x + w / 2, y + h * 0.66, w * 0.24, h * 0.22, 0, 0, Math.PI * 2); ctx.fill();
          break;
        case "lavamanos":
          ctx.fillStyle = "#fafafa"; rectRedondo(x, y, w, h, 8); ctx.fill();
          ctx.strokeStyle = "#b0bec5"; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = "#b3e5fc";
          ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2 + 2, w * 0.3, h * 0.28, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#9e9e9e"; ctx.fillRect(x + w - 8, y + h / 2 - 2, 7, 4);
          break;
        case "ducha":
          ctx.fillStyle = "#e1f5fe"; ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = "#b3e5fc"; ctx.lineWidth = 1;
          for (let i = 8; i < w; i += 8) { ctx.beginPath(); ctx.moveTo(x + i, y); ctx.lineTo(x + i, y + h); ctx.stroke(); }
          ctx.fillStyle = "#90a4ae";
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#b0bec5";
          ctx.beginPath(); ctx.arc(x + w - 10, y + 10, 6, 0, Math.PI * 2); ctx.fill();
          // Cortina
          ctx.strokeStyle = "rgba(240, 98, 146, 0.85)"; ctx.lineWidth = 4;
          ctx.beginPath();
          for (let i = 0; i <= h; i += 4) ctx.lineTo(x + 2 + Math.sin(i * 0.5) * 2, y + i);
          ctx.stroke();
          if (I.ducha > 0) {
            ctx.strokeStyle = "rgba(41, 182, 246, 0.8)"; ctx.lineWidth = 1.5;
            for (let i = 0; i < 18; i++) {
              let gx = x + 8 + Math.random() * (w - 14), gy = y + 6 + Math.random() * (h - 14);
              ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx - 1, gy + 6); ctx.stroke();
            }
          }
          break;
        case "refri":
          ctx.fillStyle = "#eceff1"; rectRedondo(x, y, w, h, 4); ctx.fill();
          ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x, y + h * 0.35); ctx.lineTo(x + w, y + h * 0.35); ctx.stroke();
          ctx.fillStyle = "#78909c"; ctx.fillRect(x + w - 8, y + h * 0.45, 3, h * 0.35);
          ctx.fillStyle = "#e53935"; ctx.fillRect(x + 8, y + h * 0.55, 6, 6);
          ctx.fillStyle = "#fdd835"; ctx.fillRect(x + 16, y + h * 0.65, 5, 5);
          break;
        case "estufa": {
          ctx.fillStyle = "#424242"; rectRedondo(x, y, w, h, 3); ctx.fill();
          let prendida = I.estufa > 0;
          for (let i = 0; i < 2; i++) for (let k = 0; k < 2; k++) {
            let bx = x + w * (0.27 + i * 0.46), by = y + h * (0.3 + k * 0.42);
            if (prendida) {
              ctx.fillStyle = "rgba(255, " + (120 + Math.floor(Math.random() * 80)) + ", 0, 0.9)";
              ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.strokeStyle = "#9e9e9e"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.stroke();
          }
          if (prendida) {
            // Olla de frijoles con vapor
            ctx.fillStyle = "#b0bec5";
            ctx.beginPath(); ctx.arc(x + w * 0.27, y + h * 0.3, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#4e342e";
            ctx.beginPath(); ctx.arc(x + w * 0.27, y + h * 0.3, 6.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
            for (let i = 0; i < 3; i++) {
              let v = (cuadro * 0.4 + i * 9) % 26;
              ctx.beginPath(); ctx.arc(x + w * 0.27 + Math.sin(cuadro * 0.1 + i) * 4, y + h * 0.3 - v, 4 + v * 0.15, 0, Math.PI * 2); ctx.fill();
            }
          }
          break;
        }
        case "meson":
          ctx.fillStyle = "#d7ccc8"; rectRedondo(x, y, w, h, 3); ctx.fill();
          ctx.fillStyle = "#a1887f"; ctx.fillRect(x, y + h - 4, w, 4);
          ctx.fillStyle = "#90a4ae"; rectRedondo(x + w * 0.55, y + 5, w * 0.32, h - 13, 3); ctx.fill();
          ctx.fillStyle = "#607d8b"; ctx.fillRect(x + w * 0.71 - 2, y + 2, 4, 6);
          // Un racimo de guineos
          ctx.fillStyle = "#fdd835";
          for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(x + 14 + i * 5, y + h / 2, 3, 8, 0.3, 0, Math.PI * 2); ctx.fill(); }
          break;
        case "mesa":
          ctx.fillStyle = "#8d6e63";
          for (let i = 0; i < 2; i++) {
            ctx.fillRect(x + w * (0.2 + i * 0.45), y - 10, 13, 9);
            ctx.fillRect(x + w * (0.2 + i * 0.45), y + h + 1, 13, 9);
          }
          ctx.fillStyle = "#a1887f"; rectRedondo(x, y, w, h, 4); ctx.fill();
          ctx.strokeStyle = "#6d4c41"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#fafafa";
          ctx.beginPath(); ctx.arc(x + w * 0.27, y + h / 2, 7, 0, Math.PI * 2); ctx.arc(x + w * 0.73, y + h / 2, 7, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#ff7043";
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 4, 0, Math.PI * 2); ctx.fill();
          break;
        case "alfombra":
          ctx.fillStyle = "#8d3b2f"; rectRedondo(x, y, w, h, 6); ctx.fill();
          ctx.strokeStyle = "#fbc02d"; ctx.lineWidth = 3;
          rectRedondo(x + 7, y + 7, w - 14, h - 14, 4); ctx.stroke();
          ctx.fillStyle = "#26a69a";
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y + 16); ctx.lineTo(x + w - 18, y + h / 2); ctx.lineTo(x + w / 2, y + h - 16); ctx.lineTo(x + 18, y + h / 2);
          ctx.closePath(); ctx.fill();
          break;
        case "tele": {
          ctx.fillStyle = "#5d4037"; ctx.fillRect(x - 4, y - 6, w + 6, h + 12);
          ctx.fillStyle = "#111"; ctx.fillRect(x + w - 8, y, 7, h);
          if (I.tele) {
            let tono = (I.canal * 70 + Math.floor(cuadro / 12) * 25) % 360;
            ctx.fillStyle = "hsl(" + tono + ", 70%, 60%)";
            ctx.fillRect(x + w - 2, y + 3, 2, h - 6);
          }
          break;
        }
        case "mesitaCentro":
          ctx.fillStyle = "#6d4c41"; rectRedondo(x, y, w, h, 4); ctx.fill();
          ctx.fillStyle = "rgba(178, 235, 242, 0.6)"; rectRedondo(x + 4, y + 4, w - 8, h - 8, 3); ctx.fill();
          ctx.fillStyle = "#fafafa";
          ctx.beginPath(); ctx.arc(x + w * 0.65, y + h * 0.35, 5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#4e342e";
          ctx.beginPath(); ctx.arc(x + w * 0.65, y + h * 0.35, 3.2, 0, Math.PI * 2); ctx.fill();
          break;
        case "sofa":
          ctx.fillStyle = "#5d4037"; rectRedondo(x, y, w, h, 7); ctx.fill();
          ctx.fillStyle = "#8d6e63";
          for (let i = 0; i < 2; i++) { rectRedondo(x + 3, y + 7 + i * (h - 14) / 2, w - 15, (h - 14) / 2 - 2, 5); ctx.fill(); }
          ctx.fillStyle = colorCasa;
          rectRedondo(x + w - 20, y + 10, 10, 14, 3); ctx.fill();
          break;
        case "hamaca": {
          let meneo = I.sentado === m ? Math.sin(cuadro * 0.05) * 5 : Math.sin(cuadro * 0.02) * 1.5;
          let cy = y + h / 2 + meneo;
          ctx.strokeStyle = "#5d4037"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + 26, cy); ctx.moveTo(x + w, y + h / 2); ctx.lineTo(x + w - 26, cy); ctx.stroke();
          ctx.fillStyle = "#5d4037";
          ctx.beginPath(); ctx.arc(x, y + h / 2, 4, 0, Math.PI * 2); ctx.arc(x + w, y + h / 2, 4, 0, Math.PI * 2); ctx.fill();
          ctx.save();
          ctx.beginPath(); ctx.ellipse(x + w / 2, cy, w / 2 - 26, h / 2 + 4, 0, 0, Math.PI * 2); ctx.clip();
          let rayas = ["#e53935", "#fdd835", "#43a047", "#1e88e5", "#fb8c00"];
          for (let i = 0; i < 10; i++) {
            ctx.fillStyle = rayas[i % rayas.length];
            ctx.fillRect(x + 26 + i * (w - 52) / 10, cy - h, (w - 52) / 10 + 1, h * 2);
          }
          ctx.restore();
          break;
        }
        case "planta":
          ctx.fillStyle = "#a1887f";
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2); ctx.fill();
          for (let i = 0; i < 7; i++) {
            let a = i * Math.PI * 2 / 7 + Math.sin(cuadro * 0.02 + i) * 0.05;
            ctx.fillStyle = i % 2 ? "#2e7d32" : "#43a047";
            ctx.beginPath(); ctx.ellipse(x + w / 2 + Math.cos(a) * 9, y + h / 2 + Math.sin(a) * 9, 11, 5, a, 0, Math.PI * 2); ctx.fill();
          }
          break;
        case "pelota":
          ctx.fillStyle = "#fafafa";
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#e53935";
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI); ctx.fill();
          break;
      }
    }

    // Adentro de la casa la gente se dibuja más grande (para que vaya con los muebles)
    const TAMAÑO_CASA = 1.5;
    function personaCasa(x, y, ang, paso, ropa) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(TAMAÑO_CASA, TAMAÑO_CASA);
      dibujarPersona(0, 0, ang, paso, ropa);
      ctx.restore();
    }

    function dibujarCasa() {
      let I = interior, W = PW, H = PH, C = CELDA;
      let anchoPx = I.ancho * C, altoPx = I.alto * C;
      let s = Math.min((W - 60) / anchoPx, (H - 170) / altoPx);
      let ox = W / 2 - anchoPx * s / 2, oy = (H - altoPx * s) / 2 + 30;
      ctx.fillStyle = "#151515";
      ctx.fillRect(0, 0, W, H);
      ctx.setTransform(RES * s, 0, 0, RES * s, RES * ox, RES * oy);

      // Piso
      for (let y = 0; y < I.alto; y++)
        for (let x = 0; x < I.ancho; x++)
          if (I.plano[y][x] !== "#") dibujarPisoCasa(I.plano[y][x], x, y, I);

      // Luz que entra por las ventanas
      for (let v of I.ventanas) {
        let y0 = v.dir > 0 ? (v.y + 1) * C : v.y * C;
        let g = ctx.createLinearGradient(0, y0, 0, y0 + v.dir * C * 2.2);
        g.addColorStop(0, "rgba(255, 244, 200, 0.35)");
        g.addColorStop(1, "rgba(255, 244, 200, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(v.x * C, y0); ctx.lineTo((v.x + v.w) * C, y0);
        ctx.lineTo((v.x + v.w + 0.5) * C, y0 + v.dir * C * 2.2); ctx.lineTo((v.x + 0.5) * C, y0 + v.dir * C * 2.2);
        ctx.closePath(); ctx.fill();
      }

      // Luz de la tele en el piso
      if (I.tele) {
        let t = I.muebles.find(m => m.accion === "tele");
        let tx = (t.x + t.w) * C, ty = (t.y + t.h / 2) * C;
        let g = ctx.createRadialGradient(tx, ty, 5, tx, ty, 130);
        let parpadeo = 0.18 + Math.random() * 0.06;
        g.addColorStop(0, "rgba(140, 200, 255, " + parpadeo + ")");
        g.addColorStop(1, "rgba(140, 200, 255, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(tx, ty - 130, 130, 260);
      }

      // Muebles: primero los del piso (alfombra, hamaca), luego los demás
      for (let m of I.muebles) if (m.piso && m.tipo !== "hamaca") dibujarMueble(m, I);
      for (let m of I.muebles) if (!m.piso) dibujarMueble(m, I);

      // Personas (de arriba hacia abajo, para que se tapen bien)
      let personas = I.gente.map(g => ({ o: g, ropa: ROPA_FAMILIA[g.quien] }));
      let enHamaca = I.sentado && I.sentado.tipo === "hamaca";
      if (!enHamaca) personas.push({ o: I.yo, ropa: ropaDeProtagonista(I.casa) });
      personas.sort((a, b) => a.o.y - b.o.y);
      for (let p of personas) {
        let quieto = p.o === I.yo && I.sentado;
        personaCasa(p.o.x, p.o.y, p.o.ang, quieto ? 0 : p.o.paso, p.ropa);
      }
      // Hamaca (y si estás acostado en ella, tú encima meciéndote)
      dibujarMueble(I.muebles.find(m => m.tipo === "hamaca"), I);
      if (enHamaca) personaCasa(I.yo.x, I.yo.y + Math.sin(cuadro * 0.05) * 5, I.yo.ang, 0, ropaDeProtagonista(I.casa));
      // Cobija encima del que duerme
      if (I.sentado && I.sentado.tipo === "cama") {
        let m = I.sentado;
        ctx.fillStyle = PERSONAJES[I.casa].color;
        rectRedondo(m.x * C + 4, (m.y + 1.2) * C, m.w * C - 8, (m.h - 1.2) * C - 4, 4); ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(m.x * C + 4, (m.y + 1.2) * C, m.w * C - 8, 5);
      }
      if (I.dormir > 0 && I.dormir % 60 < 40) {
        ctx.fillStyle = "white";
        ctx.font = "bold 16px Arial";
        let z = (180 - I.dormir) % 60;
        ctx.fillText("z", I.yo.x + 12 + z * 0.3, I.yo.y - 10 - z * 0.4);
        ctx.fillText("Z", I.yo.x + 20 + z * 0.4, I.yo.y - 24 - z * 0.4);
      }

      // Paredes: con sombrita en el piso de al lado
      for (let y = 0; y < I.alto; y++) {
        for (let x = 0; x < I.ancho; x++) {
          if (I.plano[y][x] !== "#") continue;
          ctx.fillStyle = "#e8dcc8";
          ctx.fillRect(x * C, y * C, C, C);
          ctx.fillStyle = "rgba(0, 0, 0, 0.13)";
          let abajo = I.plano[y + 1] && I.plano[y + 1][x], derecha = I.plano[y][x + 1];
          if (abajo && abajo !== "#") ctx.fillRect(x * C, (y + 1) * C, C, 7);
          if (derecha && derecha !== "#") ctx.fillRect((x + 1) * C, y * C, 6, C);
          ctx.fillStyle = "#c8b89e";
          if (abajo && abajo !== "#") ctx.fillRect(x * C, (y + 1) * C - 3, C, 3);
        }
      }
      // Ventanas en la pared
      for (let v of I.ventanas) {
        ctx.fillStyle = "#81d4fa";
        ctx.fillRect(v.x * C, v.y * C + 15, v.w * C, 10);
        ctx.strokeStyle = "#6d4c41"; ctx.lineWidth = 2;
        ctx.strokeRect(v.x * C, v.y * C + 15, v.w * C, 10);
        ctx.beginPath(); ctx.moveTo((v.x + v.w / 2) * C, v.y * C + 15); ctx.lineTo((v.x + v.w / 2) * C, v.y * C + 25); ctx.stroke();
      }
      // El cuadro colgado en la sala
      ctx.fillStyle = "#6d4c41";
      ctx.fillRect(5 * C, 5 * C + 4, 1.6 * C, C - 10);
      ctx.fillStyle = "#fffde7";
      ctx.fillRect(5 * C + 4, 5 * C + 8, 1.6 * C - 8, C - 18);
      ctx.font = "16px Arial";
      ctx.textAlign = "center";
      ctx.fillText(MARCO_CASA[I.casa], 5.8 * C, 5 * C + 27);
      ctx.textAlign = "left";
      // Marco de la puerta de salida
      ctx.fillStyle = "#4e342e";
      ctx.fillRect(I.puerta.x - C / 2 - 4, I.puerta.y, 4, C);
      ctx.fillRect(I.puerta.x + C / 2, I.puerta.y, 4, C);
      // Orilla de la casa con el color del dueño
      ctx.strokeStyle = PERSONAJES[I.casa].color;
      ctx.lineWidth = 6;
      ctx.strokeRect(-3, -3, anchoPx + 6, altoPx + 6);

      for (let b of burbujas) if (b.obj.dentro) dibujarBurbuja(b);

      // Ya fuera de la casa: textos de la pantalla
      ctx.setTransform(RES, 0, 0, RES, 0, 0);
      if (I.dormir > 0) {
        ctx.fillStyle = "rgba(0, 0, 20, " + (Math.sin(Math.PI * (180 - I.dormir) / 180) * 0.92) + ")";
        ctx.fillRect(0, 0, W, H);
      }
      dibujarPanelPersonaje();
      ctx.textAlign = "center";
      ctx.font = "bold 28px Arial";
      texto("🏠 " + PERSONAJES[I.casa].nombreCasa, W / 2, 46);
      if (I.cerca && I.dormir === 0) {
        ctx.font = "bold 20px Arial";
        texto((I.sentado ? "Presiona E o muévete para " : "Presiona E para ") + I.cerca.texto, W / 2, H - 30);
      }
      ctx.textAlign = "right";
      ctx.font = "16px Arial";
      ctx.fillStyle = "#bbb";
      ctx.fillText("Sal por la puerta de abajo para volver a la calle", W - 20, 40);
      ctx.textAlign = "left";
      dibujarAviso();

      // Fundido a negro al entrar y al salir
      let negro = Math.max(I.fundido / 30, I.saliendo ? 1 - I.saliendo / 20 : 0);
      if (negro > 0) {
        ctx.fillStyle = "rgba(0, 0, 0, " + negro + ")";
        ctx.fillRect(0, 0, W, H);
      }
    }

    // 21. DIBUJAR TODO
    function dibujar() {
      ctx.setTransform(RES, 0, 0, RES, 0, 0);
      let en3D = vista3D && mundo3D && estado !== "inicio" && estado !== "casa";
      lienzo3D.style.display = en3D ? "block" : "none";

      if (estado === "casa") {
        dibujarCasa();
        return;
      }

      if (estado === "inicio") {
        ctx.fillStyle = "#1565c0";
        ctx.fillRect(0, 0, PW, PH);
        // De fondo, la cámara pasea sobre el parque central
        let cx = 23.5 * T + Math.sin(cuadro * 0.003) * 600, cy = 24 * T + Math.cos(cuadro * 0.004) * 300;
        dibujarMundo(cx, cy, escalaBase() * 0.8);
        ctx.setTransform(RES, 0, 0, RES, 0, 0);
        dibujarInicio();
        return;
      }

      if (en3D) {
        // El mundo en 3D se dibuja en el otro lienzo; en este solo van los textos
        dibujar3D();
        ctx.clearRect(0, 0, PW, PH);
        dibujarEtiquetas3D();
        if (estado !== "cambiando") {
          if (jugadorActual().carro) dibujarVolante();
          else {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.beginPath(); ctx.arc(PW / 2, PH / 2, 3, 0, Math.PI * 2); ctx.fill();
          }
          dibujarHUD();
        } else {
          ctx.fillStyle = "rgba(0, 0, 0, " + Math.sin(Math.PI * transicion.t / 80) + ")";
          ctx.fillRect(0, 0, PW, PH);
        }
      } else {
        ctx.fillStyle = "#1565c0";
        ctx.fillRect(0, 0, PW, PH);
        dibujarMundo(camX, camY, escalaBase() * zoom);
        ctx.setTransform(RES, 0, 0, RES, 0, 0);
        if (estado !== "cambiando") dibujarHUD();
      }

      if (estado === "menu") dibujarMenu();
      if (estado === "mapa") dibujarMapaGrande();
      if (estado === "controles") dibujarPanel("🎮 Controles", CONTROLES.concat(["", "Presiona Enter para volver"]));
      if (estado === "cambiando") {
        ctx.textAlign = "center";
        ctx.font = "bold 40px Arial";
        texto("Cambiando a " + PERSONAJES[transicion.hacia].nombre + "...", PW / 2, PH / 2);
        ctx.textAlign = "left";
      }
    }

    // 22. PRIMERA PERSONA EN 3D (usa la librería three.js)
    // Se arma una copia en 3D de la misma ciudad: el piso es el mismo mapa de arriba,
    // y encima se ponen edificios, árboles, carros y personas en 3D.
    const lienzo3D = document.getElementById("juego3d");
    let vista3D = false;
    let mundo3D = null;
    let mirarYaw = 0, mirarPitch = 0;   // hacia dónde miras (izquierda-derecha y arriba-abajo)
    let mirarLado = 0;                  // mirar a los lados mientras manejas
    let volante = 0;                    // cuánto está girado el volante

    function hay3D() {
      return typeof THREE !== "undefined";
    }

    function alternarVista() {
      if (!hay3D()) {
        mostrarAviso("No se pudo cargar el 3D", "La primera persona necesita internet la primera vez", 220);
        return;
      }
      if (!mundo3D) construir3D();
      vista3D = !vista3D;
      let j = jugadorActual();
      mirarYaw = j.carro ? j.carro.ang : j.ang;
      mirarPitch = 0;
      mirarLado = 0;
      if (!vista3D && document.pointerLockElement) document.exitPointerLock();
      mostrarAviso(vista3D ? "Primera persona" : "Vista desde arriba",
                   vista3D ? "← → para girar · haz clic para mirar con el mouse" : "", 180);
    }

    // Mirar con el mouse (después de hacer clic en el juego)
    document.addEventListener("mousemove", function (e) {
      if (!vista3D || document.pointerLockElement !== document.body) return;
      if (jugadorActual().carro) mirarLado = Math.max(-1.3, Math.min(1.3, mirarLado + e.movementX * 0.0025));
      else mirarYaw += e.movementX * 0.0025;
      mirarPitch = Math.max(-1.1, Math.min(1.1, mirarPitch - e.movementY * 0.0025));
    });
    document.addEventListener("click", function () {
      if (vista3D && estado === "jugando" && document.pointerLockElement !== document.body) {
        try { document.body.requestPointerLock(); } catch (e) {}
      }
    });

    // Caminar en primera persona: W/S adelante y atrás, A/D de lado, ← → girar
    function caminar3D(j) {
      let giro = (tecla("ArrowRight") ? 1 : 0) - (tecla("ArrowLeft") ? 1 : 0);
      mirarYaw += giro * 0.045;
      j.ang = mirarYaw;
      let adelante = (tecla("KeyW", "ArrowUp") ? 1 : 0) - (tecla("KeyS", "ArrowDown") ? 1 : 0);
      let lado = (tecla("KeyD") ? 1 : 0) - (tecla("KeyA") ? 1 : 0);
      if (adelante === 0 && lado === 0) return;
      let fx = Math.cos(mirarYaw), fy = Math.sin(mirarYaw);
      let dx = fx * adelante - fy * lado, dy = fy * adelante + fx * lado;
      let largo = Math.hypot(dx, dy);
      let vel = tecla("ShiftLeft", "ShiftRight") ? PERSONAJES[activo].correr : 2.2;
      let nx = j.x + dx / largo * vel, ny = j.y + dy / largo * vel;
      if (!solidoPie(nx, j.y)) j.x = nx;
      if (!solidoPie(j.x, ny)) j.y = ny;
      j.paso += vel * 0.12;
      for (let c of carros) {
        let d = Math.hypot(j.x - c.x, j.y - c.y);
        if (d < 26 && d > 0) {
          let ex = j.x + (j.x - c.x) / d * (26 - d), ey = j.y + (j.y - c.y) / d * (26 - d);
          if (!solidoPie(ex, ey)) { j.x = ex; j.y = ey; }
        }
      }
    }

    // --- Materiales y texturas ---
    const cacheMateriales = {};
    function mat(color, tipo, extra) {
      let clave = color + (tipo || "") + JSON.stringify(extra || {});
      if (!cacheMateriales[clave]) {
        let opciones = Object.assign({ color: color }, extra || {});
        cacheMateriales[clave] = tipo === "brillo" ? new THREE.MeshPhongMaterial(Object.assign({ shininess: 70, specular: 0x555555 }, opciones))
                               : tipo === "plano" ? new THREE.MeshPhongMaterial(Object.assign({ flatShading: true, shininess: 5 }, opciones))
                               : new THREE.MeshLambertMaterial(opciones);
      }
      return cacheMateriales[clave];
    }

    function lienzoTextura(w, h, dibujo) {
      let c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      dibujo(c.getContext("2d"), w, h);
      let t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 8;
      return t;
    }

    // Pared de edificio con ventanas
    const cacheFachadas = {};
    function fachada(color, tipo) {
      let clave = color + tipo;
      if (!cacheFachadas[clave]) {
        cacheFachadas[clave] = lienzoTextura(128, 128, (g, w, h) => {
          g.fillStyle = color;
          g.fillRect(0, 0, w, h);
          g.fillStyle = "rgba(0, 0, 0, 0.08)";
          for (let i = 0; i < 40; i++) g.fillRect(Math.random() * w, Math.random() * h, 3, 3);
          if (tipo === "edificio") {
            for (let fx = 0; fx < 2; fx++) for (let fy = 0; fy < 2; fy++) {
              let x = 12 + fx * 64, y = 14 + fy * 64;
              g.fillStyle = "#e0e0e0"; g.fillRect(x - 3, y - 3, 46, 42);
              let vidrio = g.createLinearGradient(x, y, x + 40, y + 36);
              vidrio.addColorStop(0, "#90caf9"); vidrio.addColorStop(1, "#1e3a5f");
              g.fillStyle = vidrio; g.fillRect(x, y, 40, 36);
              g.fillStyle = "#e0e0e0"; g.fillRect(x + 19, y, 2, 36);
            }
          } else {
            // casa: una ventana con marco y una puerta a un lado
            g.fillStyle = "#fafafa"; g.fillRect(14, 30, 48, 42);
            let vidrio = g.createLinearGradient(18, 34, 58, 68);
            vidrio.addColorStop(0, "#b3e5fc"); vidrio.addColorStop(1, "#37474f");
            g.fillStyle = vidrio; g.fillRect(18, 34, 40, 34);
            g.fillStyle = "#fafafa"; g.fillRect(37, 34, 2, 34);
            g.fillStyle = "#6d4c41"; g.fillRect(80, 40, 34, 88);
            g.fillStyle = "#ffd54f"; g.fillRect(106, 84, 4, 4);
            g.fillStyle = "rgba(0, 0, 0, 0.15)"; g.fillRect(0, 118, w, 10);
          }
        });
      }
      let t = cacheFachadas[clave].clone();
      t.needsUpdate = true;
      return t;
    }

    function letrero3D(escena, texto, x, y, z, ancho) {
      let t = lienzoTextura(512, 110, (g, w, h) => {
        g.fillStyle = "rgba(0, 0, 0, 0.55)";
        g.fillRect(6, 10, w - 12, h - 20);
        let tam = 58;
        g.font = "bold " + tam + "px Arial";
        while (g.measureText(texto).width > w - 40 && tam > 20) { tam -= 4; g.font = "bold " + tam + "px Arial"; }
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillStyle = "white";
        g.fillText(texto, w / 2, h / 2 + 2);
      });
      let s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
      s.scale.set(ancho, ancho * 110 / 512, 1);
      s.position.set(x, y, z);
      escena.add(s);
      return s;
    }

    function alturaEdificio(e) {
      if (e.letra === "h") return 26;
      if (e.letra === "F" || e.letra === "W") return 30;
      if (e.letra === "V") return 34;
      if (e.letra === "N") return 30;
      if (e.letra === "I") return 50;
      if (e.letra === "K") return 32;
      if (e.letra === "E") return 42;
      if (e.letra === "G") return 24;
      if (e.letra === "X") return 26;
      if (e.nombre === "Hotel Morazán") return 110;
      if (e.nombre === "Alcaldía") return 70;
      if (e.nombre === "Bodega") return 50;
      return 55 + ((e.x * 7 + e.y * 13) % 5) * 15;
    }

    // --- Construir la ciudad en 3D (se hace una sola vez) ---
    function construir3D() {
      const renderer = new THREE.WebGLRenderer({ canvas: lienzo3D, antialias: true });
      renderer.setPixelRatio(RES);   // 1800p también en 3D
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const escena = new THREE.Scene();
      // Cielo con degradado
      escena.background = lienzoTextura(4, 256, (g, w, h) => {
        let d = g.createLinearGradient(0, 0, 0, h);
        d.addColorStop(0, "#2f7fd6");
        d.addColorStop(0.55, "#8ecdf7");
        d.addColorStop(1, "#d8f0ff");
        g.fillStyle = d;
        g.fillRect(0, 0, w, h);
      });
      escena.fog = new THREE.Fog(0xcfeaff, 450, 1700);

      const camara = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.5, 7000);
      camara.rotation.order = "YXZ";

      // Luces: cielo + sol con sombras
      escena.add(new THREE.HemisphereLight(0xe3f4ff, 0x5a7d3c, 0.55));
      const sol = new THREE.DirectionalLight(0xfff1d6, 0.7);
      sol.castShadow = true;
      sol.shadow.mapSize.set(4096, 4096);   // sombras más definidas
      sol.shadow.camera.left = -420; sol.shadow.camera.right = 420;
      sol.shadow.camera.top = 420; sol.shadow.camera.bottom = -420;
      sol.shadow.camera.near = 10; sol.shadow.camera.far = 1400;
      sol.shadow.bias = -0.0008;
      escena.add(sol);
      escena.add(sol.target);

      // El sol dibujado en el cielo
      const disco = new THREE.Sprite(new THREE.SpriteMaterial({
        map: lienzoTextura(128, 128, (g, w, h) => {
          let r = g.createRadialGradient(64, 64, 8, 64, 64, 64);
          r.addColorStop(0, "rgba(255,255,240,1)"); r.addColorStop(0.3, "rgba(255,245,200,0.9)"); r.addColorStop(1, "rgba(255,240,200,0)");
          g.fillStyle = r; g.fillRect(0, 0, w, h);
        }), fog: false, depthWrite: false, transparent: true }));
      disco.scale.set(420, 420, 1);
      escena.add(disco);

      const ANCHO = COLUMNAS * T, LARGO = FILAS * T;

      // Terreno de afuera (hasta el horizonte)
      const afuera = new THREE.Mesh(new THREE.PlaneGeometry(16000, 16000), mat("#5f9e45"));
      afuera.rotation.x = -Math.PI / 2;
      afuera.position.set(ANCHO / 2, -0.6, LARGO / 2);
      escena.add(afuera);

      // Piso de la ciudad: el mismo mapa de la vista de arriba (calles, aceras, plazas...)
      const texSuelo = new THREE.CanvasTexture(lienzoSuelo);
      texSuelo.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const suelo = new THREE.Mesh(new THREE.PlaneGeometry(ANCHO, LARGO), new THREE.MeshLambertMaterial({ map: texSuelo }));
      suelo.rotation.x = -Math.PI / 2;
      suelo.position.set(ANCHO / 2, 0, LARGO / 2);
      suelo.receiveShadow = true;
      escena.add(suelo);

      // Mar: el Golfo de Fonseca hasta el horizonte
      const texOlas = lienzoTextura(256, 256, (g, w, h) => {
        g.fillStyle = "#1d6fc4";
        g.fillRect(0, 0, w, h);
        g.strokeStyle = "rgba(255, 255, 255, 0.25)";
        g.lineWidth = 3;
        for (let i = 0; i < 30; i++) {
          let x = Math.random() * w, y = Math.random() * h;
          g.beginPath(); g.arc(x, y, 10 + Math.random() * 10, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
        }
      });
      texOlas.repeat.set(120, 60);
      const materialAgua = new THREE.MeshPhongMaterial({ map: texOlas, color: 0xffffff, shininess: 90, specular: 0x99ccff, transparent: true, opacity: 0.93 });
      const mar = new THREE.Mesh(new THREE.PlaneGeometry(16000, 8000), materialAgua);
      mar.rotation.x = -Math.PI / 2;
      mar.position.set(ANCHO / 2, 0.8, 40 * T + 4000);
      mar.receiveShadow = true;
      escena.add(mar);
      // Estanques de camarón y estero: cuadritos de agua
      let cuadrosAgua = [];
      for (let y = 0; y < 40; y++) for (let x = 0; x < COLUMNAS; x++) if (mapa[y][x] === "~" || mapa[y][x] === "C") cuadrosAgua.push([x, y, mapa[y][x]]);
      const aguaChica = new THREE.InstancedMesh(new THREE.PlaneGeometry(T, T), new THREE.MeshPhongMaterial({ color: 0x3aa6a0, shininess: 80, specular: 0x88ffee }), cuadrosAgua.length);
      const ayuda = new THREE.Object3D();
      cuadrosAgua.forEach((a, i) => {
        ayuda.position.set(a[0] * T + T / 2, 0.6, a[1] * T + T / 2);
        ayuda.rotation.set(-Math.PI / 2, 0, 0);
        ayuda.scale.set(a[2] === "C" ? 0.9 : 1, a[2] === "C" ? 0.9 : 1, 1);
        ayuda.updateMatrix();
        aguaChica.setMatrixAt(i, ayuda.matrix);
      });
      escena.add(aguaChica);

      // La Isla del Tigre (el volcán que se ve en el Golfo de Fonseca)
      const isla = new THREE.Mesh(new THREE.ConeGeometry(900, 520, 24), new THREE.MeshLambertMaterial({ color: 0x7d9c88, fog: false }));
      isla.position.set(ANCHO * 0.45, 250, LARGO + 2200);
      escena.add(isla);

      // Muelle de madera
      const texMadera = lienzoTextura(64, 64, (g, w, h) => {
        g.fillStyle = "#8d6e63"; g.fillRect(0, 0, w, h);
        g.fillStyle = "rgba(0,0,0,0.25)"; for (let y = 0; y < h; y += 8) g.fillRect(0, y, w, 1);
      });
      texMadera.repeat.set(4, 28);
      const muelle = new THREE.Mesh(new THREE.BoxGeometry(4 * T, 3, 7 * T), new THREE.MeshLambertMaterial({ map: texMadera }));
      muelle.position.set(56 * T, 0, 41.5 * T);
      muelle.receiveShadow = true;
      escena.add(muelle);

      // Ayudante para poner cajas
      function caja(w, h, d, material, x, y, z, sombra) {
        let m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
        m.position.set(x, y, z);
        m.castShadow = sombra !== false;
        m.receiveShadow = true;
        escena.add(m);
        return m;
      }
      const geoTecho = new THREE.ConeGeometry(0.7071, 1, 4);
      geoTecho.rotateY(Math.PI / 4);
      function techo(w, alto, d, color, x, y, z) {
        let m = new THREE.Mesh(geoTecho, mat(color, "plano"));
        m.scale.set(w, alto, d);
        m.position.set(x, y + alto / 2, z);
        m.castShadow = true;
        escena.add(m);
        return m;
      }

      // Edificios
      const NOMBRES_CASA = { F: "Casa del Flaco", W: "Casa de Willito", V: "Casa del Chevez", N: "Casa de Yoni" };
      for (let e of edificios) {
        let m = 6;
        let x0 = e.x * T + m, z0 = e.y * T + m, w = e.w * T - m * 2, d = e.h * T - m * 2;
        if (e.letra === "X") { x0 = e.x * T + 3; z0 = e.y * T + 14; w = e.w * T - 6; d = e.h * T - 28; }
        let alto = alturaEdificio(e);
        let cx = x0 + w / 2, cz = z0 + d / 2;

        if ("hFWVN".includes(e.letra)) {
          let t = fachada(aclarar(e.color, 75), "casa");
          t.repeat.set(Math.max(1, Math.round(Math.max(w, d) / 50)), 1);
          let pared = new THREE.MeshLambertMaterial({ map: t });
          caja(w, alto, d, pared, cx, alto / 2, cz);
          techo(w + 10, e.letra === "h" ? 16 : 20, d + 10, e.color, cx, alto, cz);
          if (NOMBRES_CASA[e.letra]) letrero3D(escena, NOMBRES_CASA[e.letra], cx, alto + 40, cz, 90);
        } else if (e.letra === "X") {
          let t = lienzoTextura(64, 64, (g, w2, h2) => {
            g.fillStyle = e.color; g.fillRect(0, 0, w2, h2);
            g.fillStyle = "rgba(0,0,0,0.2)"; for (let i = 0; i < w2; i += 8) g.fillRect(i, 0, 3, h2);
          });
          t.repeat.set(6, 1);
          caja(w, alto, d, new THREE.MeshLambertMaterial({ map: t }), cx, alto / 2, cz);
        } else if (e.letra === "I") {
          // Iglesia: nave, techo, dos torres al frente (mirando al parque) y una cruz
          let crema = new THREE.MeshLambertMaterial({ map: fachada("#f3ead0", "casa") });
          caja(w, alto, d, crema, cx, alto / 2, cz);
          techo(w + 8, 26, d + 8, "#8d4b32", cx, alto, cz);
          for (let lado of [-1, 1]) {
            let tx = cx + lado * (w / 2 - 20), tz = z0 + d - 18;
            caja(38, 100, 38, mat("#efe4c2"), tx, 50, tz);
            caja(18, 22, 40, mat("#5d4037"), tx, 80, tz);
            techo(44, 30, 44, "#8d4b32", tx, 100, tz);
          }
          caja(4, 34, 4, mat("#6d4c41"), cx, alto + 42, cz);
          caja(4, 4, 20, mat("#6d4c41"), cx, alto + 50, cz);
          caja(26, 34, 3, mat("#5d4037"), cx, 17, z0 + d + 1, false);   // puerta
          letrero3D(escena, "Iglesia", cx, 150, cz, 70);
        } else if (e.letra === "K") {
          // Mercado con toldos de colores
          caja(w, alto, d, new THREE.MeshLambertMaterial({ map: fachada("#f4a259", "edificio") }), cx, alto / 2, cz);
          let rayas = lienzoTextura(64, 16, (g) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#fdd835" : "#e53935"; g.fillRect(i * 8, 0, 8, 16); } });
          rayas.repeat.set(20, 1);
          let toldo = new THREE.MeshLambertMaterial({ map: rayas });
          caja(w + 24, 2, 16, toldo, cx, 20, z0 + d + 8);
          caja(w + 24, 2, 16, toldo, cx, 20, z0 - 8);
          letrero3D(escena, "Mercado", cx, alto + 30, cz, 90);
        } else if (e.letra === "E") {
          caja(w, alto, d, new THREE.MeshLambertMaterial({ map: fachada("#e3f2fd", "edificio") }), cx, alto / 2, cz);
          letrero3D(escena, "Escuela", cx, alto + 30, cz, 90);
          // Asta con la bandera de Honduras
          caja(2, 90, 2, mat("#9e9e9e"), 46.5 * T, 45, 17.5 * T);
          let bandera = lienzoTextura(96, 48, (g, w2, h2) => {
            g.fillStyle = "#0073cf"; g.fillRect(0, 0, w2, h2);
            g.fillStyle = "#ffffff"; g.fillRect(0, 16, w2, 16);
            g.fillStyle = "#0073cf";
            for (let s of [[48, 24], [38, 20], [58, 20], [38, 28], [58, 28]]) { g.beginPath(); g.arc(s[0], s[1], 2.5, 0, Math.PI * 2); g.fill(); }
          });
          let tela = new THREE.Mesh(new THREE.PlaneGeometry(36, 18), new THREE.MeshLambertMaterial({ map: bandera, side: THREE.DoubleSide }));
          tela.position.set(46.5 * T + 18, 80, 17.5 * T);
          escena.add(tela);
        } else if (e.letra === "G") {
          // Gasolinera: tiendita, techo grande con columnas y bombas
          caja(w, alto, d, new THREE.MeshLambertMaterial({ map: fachada("#fafafa", "edificio") }), cx, alto / 2, cz);
          caja(4 * T, 5, 2 * T - 10, mat("#fafafa"), 23 * T, 44, 8 * T);
          caja(4 * T + 2, 3, 2 * T - 8, mat("#e53935"), 23 * T, 40.5, 8 * T, false);
          for (let px of [21.3, 24.7]) for (let pz of [7.3, 8.7]) caja(4, 42, 4, mat("#bdbdbd"), px * T, 21, pz * T);
          for (let px of [22.2, 23.8]) caja(6, 14, 10, mat("#e53935"), px * T, 7, 8 * T);
          letrero3D(escena, "Gasolinera", 23 * T, 64, 8 * T, 90);
        } else {
          // Edificio normal con ventanas y techo plano
          let t = fachada(e.color, "edificio");
          t.repeat.set(Math.max(1, Math.round(Math.max(w, d) / 32)), Math.max(1, Math.round(alto / 32)));
          let techoPlano = mat("#8a8a8a");
          let pared = new THREE.MeshLambertMaterial({ map: t });
          caja(w, alto, d, [pared, pared, techoPlano, techoPlano, pared, pared], cx, alto / 2, cz);
          caja(14, 8, 12, mat("#cfd8dc"), cx - w / 4, alto + 4, cz);   // aire acondicionado
          caja(w + 2, 3, d + 2, mat(aclarar(e.color, -30)), cx, alto + 1.5, cz, false);   // orilla del techo
          if (e.nombre) letrero3D(escena, e.nombre, cx, alto + 30, cz, 100);
        }
      }

      // Árboles (muchos iguales: se dibujan juntos para que vaya rápido)
      const arboles = adornos.filter(a => a.tipo === "arbol");
      const troncos = new THREE.InstancedMesh(new THREE.CylinderGeometry(1.6, 2.4, 18, 6), mat("#6d4c41"), arboles.length);
      const copas = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(13, 1), mat("#ffffff", "plano"), arboles.length);
      troncos.castShadow = copas.castShadow = true;
      const verdes = ["#2e7d32", "#388e3c", "#43a047", "#1b5e20"].map(c => new THREE.Color(c));
      arboles.forEach((a, i) => {
        let s = 0.8 + ((a.x * 13 + a.y * 7) % 10) / 20;
        ayuda.position.set(a.x, 9 * s, a.y); ayuda.rotation.set(0, 0, 0); ayuda.scale.set(s, s, s); ayuda.updateMatrix();
        troncos.setMatrixAt(i, ayuda.matrix);
        ayuda.position.set(a.x, 26 * s, a.y); ayuda.rotation.set(0, a.x, 0); ayuda.scale.set(s, s * 0.9, s); ayuda.updateMatrix();
        copas.setMatrixAt(i, ayuda.matrix);
        copas.setColorAt(i, verdes[i % verdes.length]);
      });
      escena.add(troncos, copas);

      // Palmeras
      const palmeras = adornos.filter(a => a.tipo === "palmera");
      const troncosP = new THREE.InstancedMesh(new THREE.CylinderGeometry(1.3, 2.2, 42, 6), mat("#8d6e63"), palmeras.length);
      const geoHoja = new THREE.BoxGeometry(24, 0.6, 6);
      geoHoja.translate(12, 0, 0);
      const hojas = new THREE.InstancedMesh(geoHoja, mat("#2e7d32", "plano"), palmeras.length * 7);
      troncosP.castShadow = hojas.castShadow = true;
      palmeras.forEach((a, i) => {
        ayuda.position.set(a.x, 21, a.y); ayuda.rotation.set(0, 0, 0); ayuda.scale.set(1, 1, 1); ayuda.updateMatrix();
        troncosP.setMatrixAt(i, ayuda.matrix);
        for (let k = 0; k < 7; k++) {
          ayuda.position.set(a.x, 42, a.y);
          ayuda.rotation.set(0, k * Math.PI * 2 / 7 + a.x, -0.45);
          ayuda.updateMatrix();
          hojas.setMatrixAt(i * 7 + k, ayuda.matrix);
        }
      });
      escena.add(troncosP, hojas);

      // Manglares: arbustos verdes y tupidos
      let cuadrosManglar = [];
      for (let y = 0; y < FILAS; y++) for (let x = 0; x < COLUMNAS; x++) if (mapa[y][x] === "M") cuadrosManglar.push([x, y]);
      const manglar = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(12, 0), mat("#1f5f2a", "plano"), cuadrosManglar.length * 4);
      manglar.castShadow = true;
      cuadrosManglar.forEach((c, i) => {
        for (let k = 0; k < 4; k++) {
          let s = 1 + ((c[0] * 3 + c[1] * 5 + k) % 5) / 5;
          ayuda.position.set(c[0] * T + 16 + (k % 2) * 32, 9 * s, c[1] * T + 16 + Math.floor(k / 2) * 32);
          ayuda.rotation.set(0, k, 0); ayuda.scale.set(s, s * 0.8, s); ayuda.updateMatrix();
          manglar.setMatrixAt(i * 4 + k, ayuda.matrix);
        }
      });
      escena.add(manglar);

      // Postes de luz en la Panamericana y el malecón
      let postes = [];
      for (let x = 1; x < COLUMNAS; x += 3) { postes.push([x * T, 3.9 * T]); }
      for (let x = 3; x < 49; x += 3) { if (mapa[37][x] === "P") postes.push([x * T + 32, 37.2 * T]); }
      const palos = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.8, 1, 40, 5), mat("#607d8b"), postes.length);
      const lamparas = new THREE.InstancedMesh(new THREE.BoxGeometry(10, 2, 4), mat("#fff9c4"), postes.length);
      postes.forEach((p, i) => {
        ayuda.rotation.set(0, 0, 0); ayuda.scale.set(1, 1, 1);
        ayuda.position.set(p[0], 20, p[1]); ayuda.updateMatrix(); palos.setMatrixAt(i, ayuda.matrix);
        ayuda.position.set(p[0] + 4, 40, p[1]); ayuda.updateMatrix(); lamparas.setMatrixAt(i, ayuda.matrix);
      });
      palos.castShadow = true;
      escena.add(palos, lamparas);

      // Esculturas, grúas y barco
      for (let a of adornos) {
        if (a.tipo === "tiburon" || a.tipo === "camaron" || a.tipo === "pelicano") {
          let base = new THREE.Mesh(new THREE.CylinderGeometry(40, 44, 6, 32), mat("#bdbdbd"));
          base.position.set(a.x, 3, a.y); base.receiveShadow = true; escena.add(base);
          let pedestal = new THREE.Mesh(new THREE.CylinderGeometry(6, 8, 14, 12), mat("#9e9e9e"));
          pedestal.position.set(a.x, 13, a.y); pedestal.castShadow = true; escena.add(pedestal);
        }
        if (a.tipo === "tiburon") {
          let gris = mat("#78909c", "brillo");
          let cuerpo = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), gris);
          cuerpo.scale.set(34, 10, 11); cuerpo.position.set(a.x, 34, a.y); cuerpo.rotation.z = 0.25; cuerpo.castShadow = true; escena.add(cuerpo);
          let aleta = new THREE.Mesh(new THREE.ConeGeometry(6, 16, 4), gris); aleta.position.set(a.x + 2, 48, a.y); aleta.castShadow = true; escena.add(aleta);
          let cola = new THREE.Mesh(new THREE.ConeGeometry(9, 18, 4), gris); cola.position.set(a.x - 36, 28, a.y); cola.rotation.z = Math.PI / 2 + 0.3; escena.add(cola);
          letrero3D(escena, "El Tiburón", a.x, 70, a.y, 60);
        } else if (a.tipo === "camaron") {
          let camaron = new THREE.Mesh(new THREE.TorusGeometry(16, 6, 10, 24, Math.PI * 1.4), mat("#ff8a65", "brillo"));
          camaron.position.set(a.x, 38, a.y); camaron.rotation.set(0, 0.6, 0.4); camaron.castShadow = true; escena.add(camaron);
          letrero3D(escena, "El Camarón", a.x, 72, a.y, 60);
        } else if (a.tipo === "pelicano") {
          let blanco = mat("#fafafa", "brillo");
          let cuerpo = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), blanco); cuerpo.scale.set(12, 16, 10); cuerpo.position.set(a.x, 34, a.y); cuerpo.castShadow = true; escena.add(cuerpo);
          let cabeza = new THREE.Mesh(new THREE.SphereGeometry(6, 12, 10), blanco); cabeza.position.set(a.x + 4, 54, a.y); escena.add(cabeza);
          let pico = new THREE.Mesh(new THREE.ConeGeometry(3, 26, 8), mat("#ffa000")); pico.position.set(a.x + 17, 51, a.y); pico.rotation.z = -Math.PI / 2 - 0.2; escena.add(pico);
          letrero3D(escena, "El Pelícano", a.x, 80, a.y, 60);
        } else if (a.tipo === "grua") {
          let amarillo = mat("#fbc02d");
          caja(10, 140, 10, amarillo, a.x, 70, a.y);
          caja(130, 8, 8, amarillo, a.x + 35, 138, a.y);
          caja(18, 14, 16, mat("#f57f17"), a.x, 128, a.y);
          caja(1, 70, 1, mat("#333333"), a.x + 90, 102, a.y, false);
        } else if (a.tipo === "barco") {
          caja(250, 26, 170, mat("#37474f"), a.x + 125, 8, a.y + 85);
          caja(240, 3, 160, mat("#b71c1c"), a.x + 125, -3, a.y + 85, false);
          const colores = ["#e53935", "#1e88e5", "#43a047", "#fb8c00"];
          for (let i = 0; i < 4; i++) for (let k = 0; k < 3; k++) caja(34, 22, 38, mat(colores[(i + k) % 4]), a.x + 77 + i * 40, 32, a.y + 39 + k * 45);
          caja(40, 50, 90, mat("#eceff1"), a.x + 30, 46, a.y + 85);
          caja(42, 8, 92, mat("#263238"), a.x + 30, 60, a.y + 85);
        }
      }
      letrero3D(escena, "Puerto de Henecán", 56 * T, 170, 30 * T, 150);
      letrero3D(escena, "Paseo La Cabaña", 23.5 * T, 50, 38.3 * T, 90);
      letrero3D(escena, "Camaroneras", 3.5 * T, 50, 7.6 * T, 90);

      // Marcas de misión (columnas de luz, como en GTA)
      function columnaLuz(color, radio, alto, opacidad) {
        let m = new THREE.Mesh(new THREE.CylinderGeometry(radio, radio, alto, 28, 1, true),
          new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacidad, depthWrite: false, side: THREE.DoubleSide }));
        m.visible = false;
        escena.add(m);
        return m;
      }
      const marcas = [0, 1, 2].map(() => columnaLuz(0xffffff, 18, 70, 0.35));
      const destino = columnaLuz(0xffeb3b, 28, 600, 0.28);
      const paquete = caja(16, 16, 16, mat("#a1887f"), 0, 8, 0);
      paquete.visible = false;

      mundo3D = { renderer, escena, camara, sol, disco, texOlas, marcas, destino, paquete,
                  carros: new Map(), personas: new Map(), cuadro: 0 };
    }

    // --- Modelos 3D de carros y personas ---
    function modeloCarro(c) {
      let g = new THREE.Group();
      let w = c.w, h = c.h;
      let pintura = mat(c.tipo === "policia" ? "#f5f5f5" : c.color, "brillo");
      let vidrio = mat("#1c2833", "brillo", { shininess: 120 });
      let negro = mat("#1a1a1a");
      function pieza(geo, material, x, y, z) {
        let m = new THREE.Mesh(geo, material);
        m.position.set(x, y, z);
        m.castShadow = true;
        g.add(m);
        return m;
      }
      if (c.tipo === "bus") return modeloBus(c, g, pieza, negro);
      pieza(new THREE.BoxGeometry(w, 7, h), pintura, 0, 7.5, 0);                                  // carrocería
      let cabinaX = c.tipo === "pickup" ? w * 0.12 : -w * 0.05;
      g.userData.cabina = pieza(new THREE.BoxGeometry(w * 0.46, 7, h * 0.88), vidrio, cabinaX, 14.5, 0);   // vidrios
      g.userData.techo = pieza(new THREE.BoxGeometry(w * 0.4, 1.2, h * 0.84), pintura, cabinaX, 18.5, 0);  // techo
      if (c.tipo === "pickup") pieza(new THREE.BoxGeometry(w * 0.4, 4, h * 0.8), mat("#3e2723"), -w * 0.26, 11.5, 0); // paila
      if (c.tipo === "policia") {
        pieza(new THREE.BoxGeometry(w * 0.42, 5, h + 0.4), negro, 0, 8, 0);                        // puertas negras
        g.userData.rojo = pieza(new THREE.BoxGeometry(3, 2, h * 0.34), new THREE.MeshBasicMaterial({ color: 0xff1744 }), cabinaX, 20.2, -h * 0.2);
        g.userData.azul = pieza(new THREE.BoxGeometry(3, 2, h * 0.34), new THREE.MeshBasicMaterial({ color: 0x2979ff }), cabinaX, 20.2, h * 0.2);
      }
      if (c.tipo === "taxi") pieza(new THREE.BoxGeometry(4, 3, 9), new THREE.MeshBasicMaterial({ color: 0xffee58 }), cabinaX, 20.5, 0);
      let geoRueda = new THREE.CylinderGeometry(4, 4, 3, 14);
      geoRueda.rotateX(Math.PI / 2);
      for (let sx of [-1, 1]) for (let sz of [-1, 1]) pieza(geoRueda, negro, sx * w * 0.32, 4, sz * (h / 2 - 0.5));
      let luzBlanca = new THREE.MeshBasicMaterial({ color: 0xfff8c4 }), luzRoja = new THREE.MeshBasicMaterial({ color: 0xd50000 });
      for (let sz of [-1, 1]) {
        pieza(new THREE.BoxGeometry(1, 2, 4), luzBlanca, w / 2, 8.5, sz * h * 0.32);
        pieza(new THREE.BoxGeometry(1, 2, 4), luzRoja, -w / 2, 8.5, sz * h * 0.32);
      }
      return g;
    }

    // El bus de Yoni: colorido, con ventanas a los lados y parabrisas grande
    function modeloBus(c, g, pieza, negro) {
      let w = c.w, h = c.h, alto = 26;
      let lado = lienzoTextura(256, 64, (x, W, H) => {
        x.fillStyle = "#fafafa"; x.fillRect(0, 0, W, H);
        x.fillStyle = c.color; x.fillRect(0, 38, W, 26);                  // parte de abajo pintada
        x.fillStyle = "#fdd835"; x.fillRect(0, 34, W, 4);                 // franja amarilla
        x.fillStyle = "#1c2833";
        for (let i = 8; i < W - 20; i += 26) x.fillRect(i, 8, 20, 22);    // ventanas
        x.fillStyle = "#6d4c41"; x.fillRect(W - 26, 8, 16, 52);           // puerta
      });
      let frente = lienzoTextura(64, 64, (x, W, H) => {
        x.fillStyle = "#fafafa"; x.fillRect(0, 0, W, H);
        x.fillStyle = c.color; x.fillRect(0, 38, W, 26);
        x.fillStyle = "#1c2833"; x.fillRect(4, 6, W - 8, 28);             // parabrisas
        x.fillStyle = "#fff8c4"; x.fillRect(4, 48, 10, 6); x.fillRect(W - 14, 48, 10, 6);
        x.fillStyle = "#111"; x.font = "bold 9px Arial"; x.fillText("SAN LORENZO", 3, 5);
      });
      let atras = lienzoTextura(64, 64, (x, W, H) => {
        x.fillStyle = "#fafafa"; x.fillRect(0, 0, W, H);
        x.fillStyle = c.color; x.fillRect(0, 38, W, 26);
        x.fillStyle = "#1c2833"; x.fillRect(8, 8, W - 16, 20);
        x.fillStyle = "#d50000"; x.fillRect(4, 48, 8, 6); x.fillRect(W - 12, 48, 8, 6);
      });
      let mLado = new THREE.MeshLambertMaterial({ map: lado });
      let techoBlanco = mat("#eeeeee");
      pieza(new THREE.BoxGeometry(w, alto, h), [new THREE.MeshLambertMaterial({ map: frente }), new THREE.MeshLambertMaterial({ map: atras }),
                                                techoBlanco, techoBlanco, mLado, mLado], 0, 4 + alto / 2, 0);
      g.userData.cabina = pieza(new THREE.BoxGeometry(w * 0.9, 3, h * 0.6), mat("#cfd8dc"), 0, 4 + alto + 1.5, 0);   // parrilla del techo
      g.userData.techo = g.userData.cabina;
      let geoRueda = new THREE.CylinderGeometry(5, 5, 3.5, 14);
      geoRueda.rotateX(Math.PI / 2);
      for (let sx of [-0.33, 0.3]) for (let sz of [-1, 1]) pieza(geoRueda, negro, sx * w, 5, sz * (h / 2 - 0.5));
      return g;
    }

    function modeloPersona(ropa) {
      let g = new THREE.Group();
      let ancho = ropa.ancho || 1;
      let camisa = mat(ropa.camisa), piel = mat(ropa.piel), pantalon = mat("#2f3b52"), pelo = mat(ropa.pelo || "#222");
      function pieza(geo, material, x, y, z, padre) {
        let m = new THREE.Mesh(geo, material);
        m.position.set(x, y, z);
        (padre || g).add(m);
        return m;
      }
      // Piernas y brazos van en "bisagras" para poder moverlos al caminar
      let piernas = [], brazos = [];
      for (let lado of [-1, 1]) {
        let cadera = new THREE.Group(); cadera.position.set(0, 8, lado * 1.4 * ancho); g.add(cadera);
        pieza(new THREE.BoxGeometry(2, 8, 2), ropa.vestido ? piel : pantalon, 0, -4, 0, cadera);
        piernas.push(cadera);
        let hombro = new THREE.Group(); hombro.position.set(0, 14.5, lado * 3.9 * ancho); g.add(hombro);
        pieza(new THREE.BoxGeometry(1.7, 6.5, 1.7), piel, 0, -3.2, 0, hombro);
        pieza(new THREE.BoxGeometry(1.9, 2.5, 1.9), camisa, 0, -0.5, 0, hombro);
        brazos.push(hombro);
      }
      pieza(new THREE.BoxGeometry(3.2, 7, 6 * ancho), camisa, 0, 11.5, 0);                       // cuerpo
      if (ropa.vestido) pieza(new THREE.CylinderGeometry(2.5, 4.5, 7, 10), camisa, 0, 6, 0);     // falda
      pieza(new THREE.SphereGeometry(2.4, 12, 10), piel, 0.2, 17.6, 0);                          // cabeza
      if (ropa.gorra) {
        pieza(new THREE.CylinderGeometry(2.6, 2.6, 1.4, 12), mat(ropa.gorra), 0, 19.3, 0);
        pieza(new THREE.BoxGeometry(2.6, 0.4, 3.8), mat(ropa.gorra), 2.3, 18.7, 0);
      } else {
        pieza(new THREE.SphereGeometry(2.55, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), pelo, -0.2, 17.9, 0);
        if (ropa.pelolargo) pieza(new THREE.BoxGeometry(1.4, 5, 4.2), pelo, -2, 16, 0);
      }
      if (ropa.bigote) pieza(new THREE.BoxGeometry(0.6, 0.6, 2.6), pelo, 2.5, 17, 0);
      if (ropa.lentes) pieza(new THREE.BoxGeometry(0.5, 0.9, 3.4), mat("#111111", "brillo"), 2.55, 18.2, 0);
      for (let lado of [-1, 1]) pieza(new THREE.BoxGeometry(0.4, 0.7, 0.7), mat("#111111"), 2.5, 18.2, lado * 0.9);   // ojos
      g.scale.setScalar(ropa.escala || 1);
      g.userData.piernas = piernas;
      g.userData.brazos = brazos;
      return g;
    }

    // Pone cada carro y persona del juego en su lugar dentro del mundo 3D
    function ponerModelo(lista, clave, crear, x, y, ang, paso) {
      let m = lista.get(clave);
      if (!m) {
        m = crear();
        mundo3D.escena.add(m);
        lista.set(clave, m);
      }
      m.userData.visto = mundo3D.cuadro;
      m.position.set(x, 0, y);
      m.rotation.y = -ang;
      if (paso !== undefined && m.userData.piernas) {
        let s = Math.sin(paso) * 0.6;
        m.userData.piernas[0].rotation.z = s; m.userData.piernas[1].rotation.z = -s;
        m.userData.brazos[0].rotation.z = -s; m.userData.brazos[1].rotation.z = s;
      }
      return m;
    }
    function borrarNoVistos(lista) {
      for (let [clave, m] of lista) {
        if (m.userData.visto !== mundo3D.cuadro) { mundo3D.escena.remove(m); lista.delete(clave); }
      }
    }

    function dibujar3D() {
      let M = mundo3D;
      M.cuadro++;
      let j = jugadorActual();
      let camara = M.camara;

      // Dónde va la cámara (los ojos del personaje o el asiento del carro)
      let cx, cy, alto, yaw;
      if (j.carro) {
        let c = j.carro;
        mirarLado *= 0.97;
        yaw = c.ang + mirarLado;
        // En el bus vas más alto y adelante, junto al parabrisas
        let adelante = c.tipo === "bus" ? c.w * 0.38 : 2, izquierda = c.tipo === "bus" ? 7 : 4.5;
        cx = c.x + Math.cos(c.ang) * adelante + Math.sin(c.ang) * izquierda;
        cy = c.y + Math.sin(c.ang) * adelante - Math.cos(c.ang) * izquierda;
        alto = c.tipo === "bus" ? 27 : 17;
      } else {
        yaw = mirarYaw;
        cx = j.x; cy = j.y;
        alto = 16.5 * PERSONAJES[activo].escala + Math.sin(j.paso * 2) * 0.35;
      }
      if (temblor > 0) { cx += (Math.random() - 0.5) * temblor * 0.4; alto += (Math.random() - 0.5) * temblor * 0.3; }
      camara.position.set(cx, alto, cy);
      camara.rotation.set(mirarPitch, -yaw - Math.PI / 2, 0);

      // El sol y su sombra siguen al jugador
      M.sol.position.set(cx + 260, 480, cy + 180);
      M.sol.target.position.set(cx, 0, cy);
      M.sol.target.updateMatrixWorld();
      M.disco.position.set(cx + 1300, 2400, cy + 900);
      M.texOlas.offset.x = cuadro * 0.0004;
      M.texOlas.offset.y = Math.sin(cuadro * 0.01) * 0.01;

      let cerca = (x, y, d) => Math.abs(x - cx) < d && Math.abs(y - cy) < d;

      // Carros
      for (let c of carros) {
        let m = ponerModelo(M.carros, c, () => modeloCarro(c), c.x, c.y, c.ang);
        m.visible = cerca(c.x, c.y, 1300);
        // Desde adentro de tu carro solo se ve el capó (sin techo ni vidrios estorbando)
        let propio = c === j.carro;
        m.userData.cabina.visible = !propio;
        m.userData.techo.visible = !propio;
        if (m.userData.rojo) {
          let prende = Math.floor(cuadro / 8) % 2 === 0;
          m.userData.rojo.visible = prende;
          m.userData.azul.visible = !prende;
        }
      }
      borrarNoVistos(M.carros);

      // Personas
      for (let pe of peatones) {
        let m = ponerModelo(M.personas, pe, () => modeloPersona(pe), pe.x, pe.y, pe.ang, pe.paso);
        m.visible = cerca(pe.x, pe.y, 900);
      }
      for (let f of posicionesFamilia()) ponerModelo(M.personas, "familia-" + f.quien, () => modeloPersona(ROPA_FAMILIA[f.quien]), f.x, f.y, f.ang, cuadro * 0.1);
      jugadores.forEach((jj, i) => {
        if (jj.carro || i === activo) return;
        ponerModelo(M.personas, "jugador-" + i, () => modeloPersona(ropaDeProtagonista(i)), jj.x, jj.y, jj.ang, 0);
      });
      let pasoActual = misionActiva ? misionActiva.m.pasos[misionActiva.paso] : null;
      if (pasoActual && pasoActual.pasajero) {
        let l = lugarPx(pasoActual.lugar);
        ponerModelo(M.personas, "pasajero", () => modeloPersona({ camisa: "#00897b", piel: "#e0ac69", pelo: "#555" }), l.x + 20, l.y - 20, Math.PI / 2, 0);
      }
      borrarNoVistos(M.personas);

      // Marcas de misión y destino
      M.marcas.forEach(m => m.visible = false);
