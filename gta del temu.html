<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GTA del Temu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }
    #juego3d {
      display: none;
    }
  </style>
  <!-- three.js: librería para dibujar en 3D (se usa en la vista en primera persona, tecla V) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <canvas id="juego3d"></canvas>
  <canvas id="juego"></canvas>

  <script>
    // =====================================================================
    //  GTA DEL TEMU  -  mundo abierto en San Lorenzo, Valle (Honduras)
    //  Protagonistas: El Flaco, Willito y El Chevez
    // =====================================================================

    // 1. PREPARAR EL LIENZO (ocupa toda la pantalla)
    const canvas = document.getElementById("juego");
    const ctx = canvas.getContext("2d");

    // Calidad: el juego se dibuja por dentro a 1800 pixeles de alto (1800p),
    // aunque la ventana sea más pequeña, y el navegador lo ajusta a la pantalla.
    const ALTO_RESOLUCION = 1800;
    let RES = 1;            // pixeles reales por cada pixel de la ventana
    let PW = 0, PH = 0;     // tamaño de la ventana (todo el juego usa estas medidas)
    function ajustarPantalla() {
      PW = window.innerWidth;
      PH = window.innerHeight;
      RES = Math.max(ALTO_RESOLUCION / PH, window.devicePixelRatio || 1);
      canvas.width = Math.round(PW * RES);
      canvas.height = Math.round(PH * RES);
      canvas.style.width = PW + "px";
      canvas.style.height = PH + "px";
      ctx.imageSmoothingQuality = "high";
      if (mundo3D) {
        mundo3D.renderer.setPixelRatio(RES);
        mundo3D.renderer.setSize(window.innerWidth, window.innerHeight);
        mundo3D.camara.aspect = window.innerWidth / window.innerHeight;
        mundo3D.camara.updateProjectionMatrix();
      }
    }
    window.addEventListener("resize", ajustarPantalla);

    // 2. EL MAPA DE LA CIUDAD
    // El mapa es una cuadrícula de letras. Cada letra es un tipo de terreno:
    //   .  pasto        R  calle           H  Carretera Panamericana
    //   :  arena        ~  agua (mar)      C  estanque de camarones
    //   M  manglar      P  plaza/pavimento Y  patio de casa
    //   D  concreto del puerto             d  muelle de madera
    //   #  edificio     h  casa            I  iglesia     K  mercado
    //   E  escuela      G  gasolinera      X  contenedor
    //   F  casa del Flaco   W  casa de Willito   V  casa del Chevez
    const T = 64;           // tamaño de cada cuadro en pixeles
    const COLUMNAS = 64;
    const FILAS = 48;
    const mapa = [];
    for (let y = 0; y < FILAS; y++) mapa.push(new Array(COLUMNAS).fill("."));

    const edificios = [];   // para dibujar cada edificio completo
    const adornos = [];     // árboles, palmeras, esculturas, grúas...

    // Números "al azar" que siempre salen iguales (así la ciudad no cambia)
    let semilla = 12345;
    function azar() {
      semilla = (semilla * 16807) % 2147483647;
      return semilla / 2147483647;
    }

    function pintar(x, y, w, h, letra) {
      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          if (xx >= 0 && yy >= 0 && xx < COLUMNAS && yy < FILAS) mapa[yy][xx] = letra;
        }
      }
    }
    function edificio(x, y, w, h, letra, color, nombre) {
      pintar(x, y, w, h, letra);
      edificios.push({ x: x, y: y, w: w, h: h, letra: letra, color: color, nombre: nombre || "" });
    }
    const COLORES_CASA = ["#e57373", "#64b5f6", "#81c784", "#ffb74d", "#ba68c8", "#4db6ac", "#f06292", "#a1887f", "#ffd54f", "#90a4ae"];

    function construirCiudad() {
      // Mar (Golfo de Fonseca) y playa
      pintar(0, 40, COLUMNAS, 8, "~");
      pintar(0, 38, COLUMNAS, 2, ":");

      // Carretera Panamericana (CA-1): 2 filas de ancho
      pintar(0, 4, COLUMNAS, 2, "H");

      // Calles de la ciudad
      for (let x of [8, 18, 28, 38, 48]) pintar(x, 6, 1, 31, "R");
      pintar(8, 12, 55, 1, "R");
      pintar(8, 20, 55, 1, "R");
      pintar(8, 28, 55, 1, "R");
      pintar(2, 36, 61, 1, "R");      // calle del malecón
      pintar(2, 37, 47, 1, "P");      // paseo del malecón

      // Cuadras normales con casitas
      const especiales = ["19,6", "19,13", "29,13", "39,13", "9,13", "19,21", "29,21", "39,21", "9,29", "19,29", "29,29"];
      for (let bx of [9, 19, 29, 39]) {
        for (let by of [6, 13, 21, 29]) {
          if (especiales.includes(bx + "," + by)) continue;
          if (by === 6) {
            // junto a la carretera: negocios grandes
            edificio(bx + 1, 7, 3, 3, "#", "#b0bec5", "");
            edificio(bx + 5, 7, 3, 3, "#", "#bcaaa4", "");
            continue;
          }
          for (let ox of [0, 3, 6]) {
            for (let oy of [0, 4]) {
              if (azar() < 0.18) continue;   // algunos lotes quedan vacíos
              edificio(bx + ox, by + oy, 2, 2, "h", COLORES_CASA[Math.floor(azar() * COLORES_CASA.length)]);
            }
          }
        }
      }

      // Gasolinera junto a la Panamericana
      pintar(19, 6, 9, 3, "P");
      edificio(21, 6, 4, 1, "G", "#eeeeee", "Gasolinera");
      edificio(20, 10, 3, 2, "#", "#bcaaa4", "");
      edificio(24, 10, 3, 2, "#", "#b0bec5", "");

      // Hotel y Alcaldía
      edificio(20, 14, 7, 4, "#", "#9575cd", "Hotel Morazán");
      edificio(30, 14, 7, 4, "#", "#e0c080", "Alcaldía");

      // Escuela
      pintar(39, 13, 9, 7, "Y");
      edificio(40, 14, 6, 3, "E", "#4fc3f7", "Escuela");

      // Parque Central con la Iglesia
      pintar(19, 21, 9, 7, "P");
      edificio(21, 21, 5, 2, "I", "#f5f0dc", "Iglesia");

      // Mercado
      pintar(29, 21, 9, 7, "P");
      edificio(30, 22, 7, 4, "K", "#ef6c00", "Mercado");

      // Casa del Flaco
      pintar(10, 14, 5, 5, "Y");
      edificio(11, 14, 3, 2, "F", "#1e88e5", "");
      edificio(15, 14, 2, 2, "h", "#81c784");
      edificio(15, 17, 2, 2, "h", "#ffb74d");

      // Casa de Willito
      pintar(41, 22, 5, 5, "Y");
      edificio(42, 22, 3, 2, "W", "#fdd835", "");
      edificio(39, 22, 2, 2, "h", "#e57373");
      edificio(39, 25, 2, 2, "h", "#64b5f6");
      edificio(46, 22, 2, 2, "h", "#ba68c8");
      edificio(46, 25, 2, 2, "h", "#4db6ac");

      // Casa del Chevez (la más grande: vive con su esposa y sus 2 hijos)
      pintar(10, 29, 7, 6, "Y");
      edificio(11, 29, 4, 2, "V", "#e53935", "");

      // Casa de Yoni (el busero)
      pintar(20, 30, 5, 5, "Y");
      edificio(21, 30, 3, 2, "N", "#43a047", "");
      edificio(25, 30, 2, 2, "h", "#ffb74d");
      edificio(25, 33, 2, 2, "h", "#90a4ae");

      // Terminal de Buses (donde trabaja Yoni)
      pintar(29, 29, 9, 7, "P");
      edificio(30, 29, 5, 2, "#", "#26a69a", "Terminal de Buses");

      // Zona de bodegas (camino al puerto)
      edificio(50, 7, 5, 3, "#", "#90a4ae", "Bodega");
      edificio(57, 7, 5, 3, "#", "#78909c", "Bodega");
      edificio(50, 14, 5, 4, "#", "#a1887f", "Bodega");
      edificio(57, 14, 5, 4, "#", "#90a4ae", "Bodega");
      edificio(50, 22, 5, 4, "#", "#78909c", "Bodega");
      edificio(57, 22, 5, 4, "#", "#a1887f", "Bodega");

      // Puerto de Henecán
      pintar(49, 29, 15, 7, "D");
      pintar(49, 37, 15, 1, "D");
      pintar(49, 36, 14, 1, "R");
      const COLORES_CONTENEDOR = ["#e53935", "#1e88e5", "#43a047", "#fb8c00", "#8e24aa"];
      for (let cy of [30, 32, 34]) {
        for (let cx of [51, 55, 59]) {
          edificio(cx, cy, 3, 1, "X", COLORES_CONTENEDOR[Math.floor(azar() * COLORES_CONTENEDOR.length)]);
        }
      }
      pintar(54, 38, 4, 7, "d");   // muelle
      adornos.push({ tipo: "barco", x: 59.2 * T, y: 41 * T });
      adornos.push({ tipo: "grua", x: 54.3 * T, y: 40 * T });
      adornos.push({ tipo: "grua", x: 57.7 * T, y: 43 * T });

      // Camaroneras (estanques de camarón)
      for (let py = 8; py <= 32; py += 4) {
        pintar(1, py, 2, 3, "C");
        pintar(4, py, 2, 3, "C");
      }

      // Paseo Turístico La Cabaña: manglares y estero
      pintar(28, 37, 9, 3, "M");
      pintar(30, 38, 5, 2, "~");

      // Esculturas y plazas
      adornos.push({ tipo: "tiburon", x: 23.5 * T, y: 24.5 * T });
      adornos.push({ tipo: "camaron", x: 13.5 * T, y: 37.5 * T });
      adornos.push({ tipo: "pelicano", x: 45.5 * T, y: 37.5 * T });

      // Árboles y palmeras
      for (let y = 0; y < FILAS; y++) {
        for (let x = 0; x < COLUMNAS; x++) {
          let t = mapa[y][x];
          if (t === ":" && azar() < 0.25) adornos.push({ tipo: "palmera", x: (x + 0.2 + azar() * 0.6) * T, y: (y + 0.2 + azar() * 0.6) * T });
          if (t === "." && !junto(x, y, "RH") && azar() < 0.22) adornos.push({ tipo: "arbol", x: (x + 0.3 + azar() * 0.4) * T, y: (y + 0.3 + azar() * 0.4) * T });
          if (t === "P" && x >= 19 && x <= 27 && y >= 23 && y <= 27 && (x === 19 || x === 27 || y === 27) && azar() < 0.7) {
            adornos.push({ tipo: "arbol", x: (x + 0.5) * T, y: (y + 0.5) * T });
          }
        }
      }
    }

    function letraEn(tx, ty) {
      if (tx < 0 || ty < 0 || tx >= COLUMNAS || ty >= FILAS) return "~";
      return mapa[ty][tx];
    }
    // ¿El cuadro (x, y) tiene al lado alguna de estas letras?
    function junto(x, y, letras) {
      return letras.includes(letraEn(x + 1, y)) || letras.includes(letraEn(x - 1, y)) ||
             letras.includes(letraEn(x, y + 1)) || letras.includes(letraEn(x, y - 1));
    }
    function letraEnPixel(px, py) {
      return letraEn(Math.floor(px / T), Math.floor(py / T));
    }
    const SOLIDO = "#hIKEGXFWVN~CM";
    function solidoEn(px, py) {
      return SOLIDO.includes(letraEnPixel(px, py));
    }
    function esCalle(tx, ty) {
      let l = letraEn(tx, ty);
      return l === "R" || l === "H";
    }
    function centro(tx, ty) {
      return { x: tx * T + T / 2, y: ty * T + T / 2 };
    }

    // 3. LUGARES IMPORTANTES (en cuadros del mapa)
    const LUGARES = {
      casaFlaco:   { x: 12.5, y: 16.5 }, casaWillito: { x: 43.5, y: 24.5 }, casaChevez: { x: 13, y: 31.5 },
      camaronera:  { x: 6.5,  y: 22.5 }, puerto:      { x: 56,   y: 33.5 }, escuela:    { x: 43, y: 18.5 },
      mercado:     { x: 33.5, y: 27 },   cabana:      { x: 23.5, y: 37.5 }, parque:     { x: 23.5, y: 27 },
      tiburon:     { x: 23.5, y: 25.3 }, camaron:     { x: 13.5, y: 37.5 }, pelicano:   { x: 45.5, y: 37.5 },
      puertoViejo: { x: 40.5, y: 37.5 }, gasolinera:  { x: 23,   y: 7.5 },  iglesia:    { x: 23.5, y: 23.5 },
      pan1: { x: 40, y: 5 }, pan2: { x: 61, y: 4.5 }, pan3: { x: 30, y: 4 }, pan4: { x: 2.5, y: 5 }, pan5: { x: 18, y: 4.5 },
      paq1: { x: 18.5, y: 15.5 }, paq2: { x: 48.5, y: 24.5 }, paq3: { x: 28.5, y: 33.5 }, paq4: { x: 8.5, y: 30.5 }, paq5: { x: 38.5, y: 9.5 },
      marcaF1: { x: 10.5, y: 18.5 }, marcaW1: { x: 41.5, y: 26.5 }, marcaW2: { x: 31, y: 27 }, marcaW3: { x: 37.5, y: 30.5 },
      marcaC1: { x: 10.5, y: 33.5 }, marcaC2: { x: 16.5, y: 30.5 },
      casaYoni: { x: 22.5, y: 32.5 }, terminal: { x: 33.5, y: 32 },
      marcaY1: { x: 30.5, y: 34.5 }, marcaY2: { x: 36.5, y: 34.5 }, marcaY3: { x: 36.5, y: 31.5 }
    };
    function lugarPx(nombre) {
      let l = LUGARES[nombre];
      return { x: l.x * T, y: l.y * T };
    }

    // Zonas con nombre (para el letrero de abajo)
    const ZONAS = [
      { nombre: "Casa del Flaco", x: 9, y: 13, w: 9, h: 7 },
      { nombre: "Casa de Willito", x: 39, y: 21, w: 9, h: 7 },
      { nombre: "Casa del Chevez", x: 9, y: 29, w: 9, h: 7 },
      { nombre: "Casa de Yoni", x: 19, y: 29, w: 9, h: 7 },
      { nombre: "Terminal de Buses", x: 29, y: 29, w: 9, h: 7 },
      { nombre: "Parque Central", x: 19, y: 21, w: 9, h: 7 },
      { nombre: "Mercado Municipal", x: 29, y: 21, w: 9, h: 7 },
      { nombre: "Escuela", x: 39, y: 13, w: 9, h: 7 },
      { nombre: "Alcaldía", x: 29, y: 13, w: 9, h: 7 },
      { nombre: "Hotel Morazán", x: 19, y: 13, w: 9, h: 7 },
      { nombre: "Gasolinera", x: 19, y: 6, w: 9, h: 3 },
      { nombre: "Carretera Panamericana (CA-1)", x: 0, y: 3, w: 64, h: 3 },
      { nombre: "Camaroneras", x: 0, y: 6, w: 8, h: 32 },
      { nombre: "Puerto de Henecán", x: 49, y: 28, w: 15, h: 20 },
      { nombre: "Paseo La Cabaña", x: 20, y: 36, w: 17, h: 4 },
      { nombre: "Plaza Puerto Viejo", x: 37, y: 36, w: 7, h: 3 },
      { nombre: "Malecón de San Lorenzo", x: 0, y: 36, w: 49, h: 4 },
      { nombre: "Golfo de Fonseca", x: 0, y: 40, w: 64, h: 8 },
      { nombre: "Bodegas", x: 49, y: 6, w: 15, h: 22 },
      { nombre: "Centro de San Lorenzo", x: 8, y: 6, w: 41, h: 30 }
    ];
    function zonaEn(px, py) {
      let tx = px / T, ty = py / T;
      for (let z of ZONAS) {
        if (tx >= z.x && tx < z.x + z.w && ty >= z.y && ty < z.y + z.h) return z.nombre;
      }
      return "Afueras de San Lorenzo";
    }

    // 4. LOS PROTAGONISTAS
    const PERSONAJES = [
      { nombre: "El Flaco", letra: "F", camisa: "#1e88e5", piel: "#c68642", pelo: "#3e2723", gorra: "#0d47a1",
        escala: 0.95, ancho: 0.78, correr: 4.0, casa: "casaFlaco", carro: { color: "#1565c0", tipo: "deportivo", x: 13.5, y: 18.2 },
        nombreCasa: "Casa del Flaco", color: "#1e88e5", colorClaro: "#90caf9",
        descripcion: "Alto, flaco y el más rápido corriendo" },
      { nombre: "Willito", letra: "W", camisa: "#fdd835", piel: "#8d5524", pelo: "#111111", gorra: null,
        escala: 0.82, ancho: 1, correr: 3.6, casa: "casaWillito", carro: { color: "#fbc02d", tipo: "taxi", x: 44.5, y: 26.3 },
        nombreCasa: "Casa de Willito", color: "#fbc02d", colorClaro: "#fff59d",
        descripcion: "Bajito, taxista del barrio" },
      { nombre: "El Chevez", letra: "C", camisa: "#e53935", piel: "#a0522d", pelo: "#2b1b0e", gorra: null, bigote: true,
        escala: 1.15, ancho: 1.12, correr: 3.2, casa: "casaChevez", carro: { color: "#b71c1c", tipo: "pickup", x: 15.3, y: 33.4 },
        nombreCasa: "Casa del Chevez", color: "#e53935", colorClaro: "#ef9a9a",
        descripcion: "Padre de familia: esposa y 2 hijos" },
      { nombre: "Yoni", letra: "Y", camisa: "#43a047", piel: "#b5794b", pelo: "#1a1a1a", gorra: null, lentes: true,
        escala: 1.02, ancho: 1.05, correr: 3.5, casa: "casaYoni", carro: { color: "#ff7043", tipo: "bus", x: 33.5, y: 33.3 },
        nombreCasa: "Casa de Yoni", color: "#43a047", colorClaro: "#a5d6a7",
        descripcion: "Busero de la ruta San Lorenzo" }
    ];
    let jugadores = [];     // dónde está cada protagonista
    let activo = 0;         // a quién estás manejando

    // 5. VARIABLES DEL JUEGO
    let carros = [];
    let peatones = [];
    let burbujas = [];      // globitos de texto
    let teclas = {};
    let estado = "inicio";  // "inicio", "jugando", "cambiando", "menu", "mapa", "controles", "casa"
    let cuadro = 0;
    let camX = 0, camY = 0, zoom = 1;
    let temblor = 0;
    let estrellas = 0;             // nivel de búsqueda de la policía (0 a 5)
    let enfriamientoEstrellas = 0;
    let tiempoEscondido = 0;
    let arresto = 0;
    let misionActiva = null;
    let misionesHechas = [];
    let aviso = null;              // mensaje grande que aparece un rato
    let zonaActual = "", zonaCuadros = 0;
    let transicion = null;         // al cambiar de personaje
    let opcionMenu = 0;
    const OPCIONES_MENU = ["▶ Seguir jugando", "🗺 Ver mapa", "🎮 Controles", "✖ Cancelar misión", "🏠 Volver al inicio"];

    // La familia del Chevez
    let familia = { esposa: "casa", hijos: "casa", volver: 0 };

    // 6. GUARDAR Y CARGAR
    function guardar() {
      try {
        localStorage.setItem("gtaDelTemu", JSON.stringify({ dinero: jugadores.map(j => j.dinero), hechas: misionesHechas }));
      } catch (e) {}
    }
    function cargarGuardado() {
      try {
        let datos = JSON.parse(localStorage.getItem("gtaDelTemu"));
        if (datos) {
          datos.dinero.forEach((d, i) => { if (jugadores[i]) jugadores[i].dinero = d; });
          misionesHechas = datos.hechas || [];
        }
      } catch (e) {}
    }

    // 7. LEER EL TECLADO
    document.addEventListener("keydown", function (e) {
      teclas[e.code] = true;
      if (e.code.startsWith("Arrow") || e.code === "Space" || e.code === "Backspace" || e.code === "Tab") e.preventDefault();
      let enter = e.key === "Enter";

      if (estado === "inicio") {
        if (enter) estado = "jugando";

      } else if (estado === "jugando") {
        if (e.code === "KeyE" && !e.repeat) interactuar();
        if (e.code === "KeyQ" && !e.repeat) bocina();
        if (e.code === "Digit1") cambiarA(0);
        if (e.code === "Digit2") cambiarA(1);
        if (e.code === "Digit3") cambiarA(2);
        if (e.code === "Digit4") cambiarA(3);
        if (e.code === "Tab") cambiarA((activo + 1) % PERSONAJES.length);
        if (e.code === "KeyM") estado = "mapa";
        if (e.code === "Backspace") { estado = "menu"; opcionMenu = 0; }
        if (e.code === "KeyV" && !e.repeat) alternarVista();

      } else if (estado === "menu") {
        if (e.code === "ArrowUp")   opcionMenu = (opcionMenu + OPCIONES_MENU.length - 1) % OPCIONES_MENU.length;
        if (e.code === "ArrowDown") opcionMenu = (opcionMenu + 1) % OPCIONES_MENU.length;
        if (e.code === "Backspace") estado = "jugando";
        if (enter) {
          if (opcionMenu === 0) estado = "jugando";
          if (opcionMenu === 1) estado = "mapa";
          if (opcionMenu === 2) estado = "controles";
          if (opcionMenu === 3) { if (misionActiva) fallarMision("Cancelaste la misión"); estado = "jugando"; }
          if (opcionMenu === 4) { guardar(); estado = "inicio"; }
        }

      } else if (estado === "casa") {
        if (e.code === "KeyE" && !e.repeat) interactuarCasa();

      } else if (estado === "mapa" || estado === "controles") {
        if (e.code === "KeyM" || e.code === "Backspace" || enter) estado = "jugando";
      }
    });
    document.addEventListener("keyup", function (e) {
      teclas[e.code] = false;
    });

    function tecla(...codigos) {
      return codigos.some(c => teclas[c]);
    }

    // 8. CREAR CARROS Y GENTE
    const COLORES_CARRO = ["#e53935", "#1e88e5", "#43a047", "#fdd835", "#fb8c00", "#8e24aa", "#eeeeee", "#212121", "#6d4c41", "#00acc1"];

    function nuevoCarro(x, y, ang, color, tipo) {
      let c = { x: x, y: y, ang: ang, vel: 0, color: color, tipo: tipo || "normal",
                w: tipo === "bus" ? 92 : (tipo === "pickup" ? 52 : 46), h: tipo === "bus" ? 30 : (tipo === "pickup" ? 26 : 24),
                conductor: null, ai: null, atascado: 0, reversa: 0, dueño: -1 };
      carros.push(c);
      return c;
    }

    // Desplazamiento para ir por el carril de la derecha
    function carril(dx, dy) {
      return { x: -dy * 15, y: dx * 15 };
    }

    function crearTrafico() {
      let intentos = 0;
      while (intentos++ < 500) {
        let tx = Math.floor(azar() * COLUMNAS), ty = Math.floor(azar() * FILAS);
        if (!esCalle(tx, ty)) continue;
        let opciones = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(d => esCalle(tx + d[0], ty + d[1]) &&
                          !(letraEn(tx, ty) === "H" && d[1] !== 0));
        if (opciones.length === 0) continue;
        let d = opciones[Math.floor(azar() * opciones.length)];
        let p = centro(tx, ty), o = carril(d[0], d[1]);
        // que no quede encima de otro carro
        if (carros.some(c => Math.hypot(c.x - p.x - o.x, c.y - p.y - o.y) < 80)) continue;
        let c = nuevoCarro(p.x + o.x, p.y + o.y, Math.atan2(d[1], d[0]), COLORES_CARRO[Math.floor(azar() * COLORES_CARRO.length)]);
        c.conductor = "npc";
        c.ai = { dx: d[0], dy: d[1], tx: tx + d[0], ty: ty + d[1], espera: 0, paciencia: 0 };
        return;
      }
    }

    const CAMINABLE_PEATON = ".PY:Dd";
    function crearPeaton(x, y) {
      let p = { x: x, y: y, ang: azar() * Math.PI * 2, vel: 0.8 + azar() * 0.4, t: 0,
                salto: 0, sx: 0, sy: 0, paso: 0, huyendo: 0,
                camisa: COLORES_CARRO[Math.floor(azar() * COLORES_CARRO.length)],
                piel: ["#f1c27d", "#c68642", "#8d5524", "#e0ac69"][Math.floor(azar() * 4)],
                pelo: ["#111", "#3e2723", "#6d4c41", "#bdbdbd"][Math.floor(azar() * 4)] };
      peatones.push(p);
      return p;
    }
    function crearPeatonesAlAzar(cantidad) {
      let hechos = 0, intentos = 0;
      while (hechos < cantidad && intentos++ < 5000) {
        let tx = 8 + Math.floor(azar() * 45), ty = 6 + Math.floor(azar() * 33);
        if (!CAMINABLE_PEATON.includes(letraEn(tx, ty))) continue;
        crearPeaton((tx + 0.5) * T, (ty + 0.5) * T);
        hechos++;
      }
    }

    function nuevoMundo() {
      carros = [];
      peatones = [];
      burbujas = [];
      jugadores = PERSONAJES.map((p, i) => {
        let casa = lugarPx(p.casa);
        let c = nuevoCarro(p.carro.x * T, p.carro.y * T, 0, p.carro.color, p.carro.tipo);
        c.dueño = i;
        return { x: casa.x, y: casa.y, ang: Math.PI / 2, carro: null, dinero: 500, paso: 0 };
      });
      // Carros estacionados
      nuevoCarro(31 * T, 27.2 * T, 0, "#43a047");
      nuevoCarro(35.5 * T, 27.2 * T, Math.PI, "#8e24aa");
      nuevoCarro(52.5 * T, 31.5 * T, 0, "#eeeeee");
      nuevoCarro(20.5 * T, 8 * T, 0, "#fb8c00");
      nuevoCarro(45 * T, 17.5 * T, 0, "#00acc1");
      for (let i = 0; i < 30; i++) crearTrafico();
      crearPeatonesAlAzar(55);
      estrellas = 0;
      misionActiva = null;
      familia = { esposa: "casa", hijos: "casa", volver: 0 };
      cargarGuardado();
      activo = 0;
      let j = jugadores[0];
      camX = j.x; camY = j.y;
    }

    // 9. MENSAJES
    function mostrarAviso(titulo, texto, duracion) {
      aviso = { titulo: titulo, texto: texto || "", t: duracion || 240 };
    }
    function decir(objeto, texto, duracion) {
      // No repetir el mismo globito encima de la misma persona
      burbujas = burbujas.filter(b => b.obj !== objeto);
      burbujas.push({ obj: objeto, texto: texto, t: duracion || 120 });
      if (burbujas.length > 14) burbujas.shift();
    }

    // 10. EL JUGADOR
    function jugadorActual() {
      return jugadores[activo];
    }
    // Posición del jugador (si va en carro, la del carro)
    function posJugador(i) {
      let j = jugadores[i === undefined ? activo : i];
      return j.carro ? { x: j.carro.x, y: j.carro.y } : { x: j.x, y: j.y };
    }

    function interactuar() {
      let j = jugadorActual();
      let p = posJugador();

      // ¿Empezar una misión?
      if (!misionActiva && !j.carro) {
        for (let m of MISIONES) {
          if (m.personaje !== activo) continue;
          let l = lugarPx(m.inicio);
          if (Math.hypot(p.x - l.x, p.y - l.y) < 50) {
            empezarMision(m);
            return;
          }
        }
      }

      // ¿Entrar a la casa? (adentro estás a salvo: se borran las estrellas y se guarda)
      if (!j.carro) {
        let casa = lugarPx(PERSONAJES[activo].casa);
        if (Math.hypot(p.x - casa.x, p.y - casa.y) < 45) {
          if (misionActiva) {
            mostrarAviso("Ahorita no", "Termina tu misión primero", 150);
            return;
          }
          if (estrellas > 0 && carros.some(c => c.tipo === "policia" && Math.hypot(c.x - p.x, c.y - p.y) < 500)) {
            mostrarAviso("¡No puedes entrar!", "La policía está muy cerca", 150);
            return;
          }
          estrellas = 0;
          guardar();
          entrarCasa();
          mostrarAviso(PERSONAJES[activo].nombreCasa, "Estás a salvo. Juego guardado.", 150);
          return;
        }
      }

      // Bajarse del carro
      if (j.carro) {
        let c = j.carro;
        if (Math.abs(c.vel) > 1.5) return;
        for (let lado of [1, -1]) {
          let nx = c.x + Math.cos(c.ang + lado * Math.PI / 2) * 30;
          let ny = c.y + Math.sin(c.ang + lado * Math.PI / 2) * 30;
          if (!solidoPie(nx, ny)) {
            j.x = nx; j.y = ny;
            c.conductor = null;
            c.vel = 0;
            j.carro = null;
            j.ang = c.ang;
            mirarYaw = c.ang;
            return;
          }
        }
        return;
      }

      // Subirse a un carro cercano
      let mejor = null, mejorDist = 60;
      for (let c of carros) {
        if (c.tipo === "policia" || c.conductor === "personaje") continue;
        let d = Math.hypot(c.x - j.x, c.y - j.y);
        if (d < mejorDist) { mejor = c; mejorDist = d; }
      }
      if (mejor) {
        if (mejor.conductor === "npc") {
          // El conductor se baja molesto
          let p2 = crearPeaton(mejor.x + Math.cos(mejor.ang + Math.PI / 2) * 30, mejor.y + Math.sin(mejor.ang + Math.PI / 2) * 30);
          p2.huyendo = 180;
          decir(p2, "¡Oye! ¡Mi carro!", 150);
          subirEstrellas(1);
        } else if (mejor.dueño >= 0 && mejor.dueño !== activo) {
          decir(j, "Le presto el carro a " + PERSONAJES[mejor.dueño].nombre, 120);
        }
        mejor.ai = null;
        mejor.conductor = "jugador";
        j.carro = mejor;
      }
    }

    function bocina() {
      let p = posJugador();
      let j = jugadorActual();
      decir(j.carro || j, j.carro ? "¡PIII PIII!" : "¡Epa!", 60);
      for (let pe of peatones) {
        if (Math.hypot(pe.x - p.x, pe.y - p.y) < 200 && azar() < 0.4) {
          decir(pe, ["¿Qué pasó?", "¡Ya voy!", "¡Qué escándalo!", "Tranquilo, pues"][Math.floor(azar() * 4)], 100);
        }
      }
    }

    function cambiarA(i) {
      if (i === activo || estado !== "jugando") return;
      if (misionActiva) {
        mostrarAviso("Termina tu misión primero", "O cancélala en el menú (Backspace)", 150);
        return;
      }
      // El que se queda: si está en un carro, el carro se queda estacionado con él adentro
      let viejo = jugadorActual();
      if (viejo.carro) { viejo.carro.conductor = "personaje"; viejo.carro.vel = 0; }
      transicion = { desdeX: camX, desdeY: camY, hacia: i, t: 0 };
      estado = "cambiando";
    }

    function actualizarCambio() {
      transicion.t++;
      let f = transicion.t / 80;
      let suave = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      let destino = posJugador(transicion.hacia);
      camX = transicion.desdeX + (destino.x - transicion.desdeX) * suave;
      camY = transicion.desdeY + (destino.y - transicion.desdeY) * suave;
      zoom = 1 - 0.7 * Math.sin(Math.PI * f);
      if (transicion.t >= 80) {
        activo = transicion.hacia;
        let j = jugadorActual();
        if (j.carro) j.carro.conductor = "jugador";
        estado = "jugando";
        zoom = 1;
        mostrarAviso(PERSONAJES[activo].nombre, PERSONAJES[activo].descripcion, 120);
      }
    }

    // ¿La persona choca con algo en (px, py)?
    function solidoPie(px, py) {
      const r = 9;
      return solidoEn(px - r, py) || solidoEn(px + r, py) || solidoEn(px, py - r) || solidoEn(px, py + r);
    }

    function caminar(j) {
      let dx = (tecla("ArrowRight", "KeyD") ? 1 : 0) - (tecla("ArrowLeft", "KeyA") ? 1 : 0);
      let dy = (tecla("ArrowDown", "KeyS") ? 1 : 0) - (tecla("ArrowUp", "KeyW") ? 1 : 0);
      if (dx === 0 && dy === 0) return;
      let largo = Math.hypot(dx, dy);
      let vel = tecla("ShiftLeft", "ShiftRight") ? PERSONAJES[activo].correr : 2.2;
      let nx = j.x + dx / largo * vel, ny = j.y + dy / largo * vel;
      if (!solidoPie(nx, j.y)) j.x = nx;
      if (!solidoPie(j.x, ny)) j.y = ny;
      j.ang = Math.atan2(dy, dx);
      j.paso += vel * 0.12;
      // No atravesar carros
      for (let c of carros) {
        let d = Math.hypot(j.x - c.x, j.y - c.y);
        if (d < 26 && d > 0) {
          let ex = j.x + (j.x - c.x) / d * (26 - d), ey = j.y + (j.y - c.y) / d * (26 - d);
          if (!solidoPie(ex, ey)) { j.x = ex; j.y = ey; }
        }
      }
    }

    // 11. MANEJAR CARROS
    function velocidadMaximaEn(c) {
      let l = letraEnPixel(c.x, c.y);
      if (l === "R" || l === "H" || l === "D" || l === "d") return 7.5;
      if (l === "P" || l === "Y") return 5;
      return 3.5;   // pasto y arena
    }

    function carroChoca(c) {
      let cos = Math.cos(c.ang), sin = Math.sin(c.ang);
      let puntos = [[0.5, 0.45], [0.5, -0.45], [-0.5, 0.45], [-0.5, -0.45], [0.5, 0], [0, 0.45], [0, -0.45]];
      for (let p of puntos) {
        let px = c.x + cos * p[0] * c.w - sin * p[1] * c.h;
        let py = c.y + sin * p[0] * c.w + cos * p[1] * c.h;
        if (solidoEn(px, py)) return true;
      }
      return false;
    }

    function moverCarro(c) {
      let viejoX = c.x, viejoY = c.y;
      c.x += Math.cos(c.ang) * c.vel;
      c.y += Math.sin(c.ang) * c.vel;
      if (carroChoca(c)) {
        c.x = viejoX;
        c.y = viejoY;
        if (c.conductor === "jugador" && Math.abs(c.vel) > 3) temblor = 8;
        c.vel *= -0.3;
      }
    }

    function manejar(c) {
      let adelante = tecla("ArrowUp", "KeyW"), atras = tecla("ArrowDown", "KeyS");
      let giro = (tecla("ArrowRight", "KeyD") ? 1 : 0) - (tecla("ArrowLeft", "KeyA") ? 1 : 0);
      let freno = tecla("Space");
      let maxima = velocidadMaximaEn(c);
      let esBus = c.tipo === "bus";
      if (esBus) maxima *= 0.8;   // el bus es más lento y gira menos

      if (adelante) c.vel += c.vel < 0 ? 0.3 : (esBus ? 0.1 : 0.16);
      else if (atras) c.vel -= c.vel > 0 ? 0.3 : 0.12;
      else c.vel *= 0.985;
      if (freno) c.vel *= 0.93;
      if (c.vel > maxima) c.vel = Math.max(maxima, c.vel - 0.3);
      c.vel = Math.max(-2.5, c.vel);

      let viejoAng = c.ang;
      c.ang += giro * (esBus ? 0.038 : 0.05) * Math.min(1, Math.abs(c.vel) / 3) * Math.sign(c.vel) * (freno ? 1.4 : 1);
      if (carroChoca(c)) c.ang = viejoAng;
      moverCarro(c);
    }

    function diferenciaAngulo(a, b) {
      let d = b - a;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    // Tráfico: los carros siguen las calles y doblan en las esquinas
    function elegirSiguiente(c) {
      let ai = c.ai;
      let aqui = letraEn(ai.tx, ai.ty);
      let opciones = [];
      for (let d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if (d[0] === -ai.dx && d[1] === -ai.dy) continue;                 // no dar vuelta en U
        if (!esCalle(ai.tx + d[0], ai.ty + d[1])) continue;
        if (aqui === "H" && letraEn(ai.tx + d[0], ai.ty + d[1]) === "H" && d[1] !== 0) continue;
        opciones.push(d);
      }
      let d;
      if (opciones.length === 0) d = [-ai.dx, -ai.dy];                   // calle cerrada: regresar
      else if (opciones.some(o => o[0] === ai.dx && o[1] === ai.dy) && Math.random() < 0.65) d = [ai.dx, ai.dy];
      else d = opciones[Math.floor(Math.random() * opciones.length)];
      ai.dx = d[0]; ai.dy = d[1];
      ai.tx += d[0]; ai.ty += d[1];
    }

    function hayAlgoEnfrente(c) {
      let cos = Math.cos(c.ang), sin = Math.sin(c.ang);
      let cosas = carros.filter(o => o !== c).map(o => ({ x: o.x, y: o.y }));
      let j = jugadorActual();
      if (!j.carro) cosas.push({ x: j.x, y: j.y });
      for (let i = 0; i < jugadores.length; i++) if (i !== activo && !jugadores[i].carro) cosas.push(jugadores[i]);
      for (let o of cosas) {
        let rx = o.x - c.x, ry = o.y - c.y;
        let frente = rx * cos + ry * sin;
        let lado = -rx * sin + ry * cos;
        if (frente > 0 && frente < 62 && Math.abs(lado) < 20) return true;
      }
      return false;
    }

    function actualizarTrafico(c) {
      let ai = c.ai;
      if (ai.espera > 0) {
        ai.espera--;
        c.vel *= 0.9;
        moverCarro(c);
        return;
      }
      let p = centro(ai.tx, ai.ty), o = carril(ai.dx, ai.dy);
      let objX = p.x + o.x, objY = p.y + o.y;
      if (Math.hypot(objX - c.x, objY - c.y) < 10) {
        elegirSiguiente(c);
        return;
      }
      let deseado = Math.atan2(objY - c.y, objX - c.x);
      let dif = diferenciaAngulo(c.ang, deseado);
      c.ang += Math.max(-0.12, Math.min(0.12, dif));

      let bloqueado = ai.paciencia < 150 && hayAlgoEnfrente(c);
      if (bloqueado) {
        ai.paciencia++;
        if (ai.paciencia === 100) decir(c, "¡PIIIP!", 70);
      } else if (ai.paciencia > 0) {
        ai.paciencia = ai.paciencia >= 150 ? (ai.paciencia + 1 > 210 ? 0 : ai.paciencia + 1) : 0;
      }
      let objetivo = bloqueado ? 0 : (Math.abs(dif) > 0.5 ? 1.3 : 2.4);
      c.vel += (objetivo - c.vel) * 0.1;
      c.x += Math.cos(c.ang) * c.vel;
      c.y += Math.sin(c.ang) * c.vel;
    }

    // 12. LA POLICÍA
    function subirEstrellas(n) {
      if (enfriamientoEstrellas > 0) return;
      let antes = estrellas;
      estrellas = Math.min(5, estrellas + n);
      enfriamientoEstrellas = 90;
      tiempoEscondido = 0;
      if (antes === 0 && estrellas > 0) mostrarAviso("¡La policía te busca!", "Escóndete o vete a tu casa", 150);
    }

    function crearPatrulla() {
      let p = posJugador();
      for (let i = 0; i < 60; i++) {
        let tx = Math.floor(Math.random() * COLUMNAS), ty = Math.floor(Math.random() * FILAS);
        if (!esCalle(tx, ty)) continue;
        let c = centro(tx, ty);
        let d = Math.hypot(c.x - p.x, c.y - p.y);
        if (d < 700 || d > 1200) continue;
        let patrulla = nuevoCarro(c.x, c.y, Math.atan2(p.y - c.y, p.x - c.x), "#fafafa", "policia");
        patrulla.conductor = "policia";
        return;
      }
    }

    // Mapa de "distancias hasta el jugador" para que las patrullas encuentren el camino
    // esquivando los edificios (se recalcula cada medio segundo)
    let campoPolicia = null;
    function calcularCampoPolicia() {
      let p = posJugador();
      let inicio = Math.floor(p.y / T) * COLUMNAS + Math.floor(p.x / T);
      campoPolicia = new Int16Array(COLUMNAS * FILAS).fill(-1);
      if (inicio < 0 || inicio >= campoPolicia.length) return;
      let cola = [inicio];
      campoPolicia[inicio] = 0;
      for (let i = 0; i < cola.length; i++) {
        let actual = cola[i], x = actual % COLUMNAS, y = Math.floor(actual / COLUMNAS);
        for (let d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          let nx = x + d[0], ny = y + d[1];
          if (nx < 0 || ny < 0 || nx >= COLUMNAS || ny >= FILAS) continue;
          let k = ny * COLUMNAS + nx;
          if (campoPolicia[k] !== -1 || SOLIDO.includes(mapa[ny][nx])) continue;
          campoPolicia[k] = campoPolicia[actual] + 1;
          cola.push(k);
        }
      }
    }

    // Hacia dónde tiene que ir la patrulla: al cuadro vecino más cerca del jugador
    function siguientePuntoPolicia(c) {
      let tx = Math.floor(c.x / T), ty = Math.floor(c.y / T);
      let aqui = campoPolicia ? campoPolicia[ty * COLUMNAS + tx] : -1;
      if (aqui <= 1) return posJugador();
      let mejor = null, mejorValor = aqui;
      for (let d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        let nx = tx + d[0], ny = ty + d[1];
        if (nx < 0 || ny < 0 || nx >= COLUMNAS || ny >= FILAS) continue;
        let v = campoPolicia[ny * COLUMNAS + nx];
        if (v >= 0 && v < mejorValor) { mejorValor = v; mejor = centro(nx, ny); }
      }
      return mejor || posJugador();
    }

    function actualizarPolicia(c) {
      let p = posJugador();
      let d = Math.hypot(p.x - c.x, p.y - c.y);

      if (estrellas === 0) {
        // Ya no te buscan: se van
        c.vel = Math.min(c.vel + 0.1, 3);
        moverCarro(c);
        if (d > 1100) c.borrar = true;
        return;
      }
      if (c.reversa > 0) {
        c.reversa--;
        c.vel = -2;
        c.ang += 0.03;
        moverCarro(c);
        return;
      }
      let objetivo = siguientePuntoPolicia(c);
      let deseado = Math.atan2(objetivo.y - c.y, objetivo.x - c.x);
      let dif = diferenciaAngulo(c.ang, deseado);
      c.ang += Math.max(-0.08, Math.min(0.08, dif));
      let maxima = Math.min(velocidadMaximaEn(c), 5.4 + estrellas * 0.35);
      if (d < 70) maxima = 1;   // frena cuando ya te alcanzó
      c.vel += c.vel < maxima ? 0.15 : -0.3;
      if (Math.abs(dif) > 1.2) c.vel *= 0.95;
      let x0 = c.x, y0 = c.y;
      moverCarro(c);
      // ¿Se quedó atascado? retrocede un poco
      if (Math.hypot(c.x - x0, c.y - y0) < 0.4 && d > 90) c.atascado++;
      else c.atascado = 0;
      if (c.atascado > 40) { c.reversa = 35; c.atascado = 0; }
    }

    function actualizarBusqueda() {
      if (enfriamientoEstrellas > 0) enfriamientoEstrellas--;
      let p = posJugador();
      let patrullas = carros.filter(c => c.tipo === "policia" && !c.borrar);

      // Más estrellas = más patrullas
      if (estrellas > 0 && patrullas.length < Math.min(4, estrellas) && cuadro % 90 === 0) crearPatrulla();
      if (patrullas.length > 0 && cuadro % 30 === 0) calcularCampoPolicia();

      if (estrellas > 0) {
        let cerca = patrullas.some(c => Math.hypot(c.x - p.x, c.y - p.y) < 800);
        tiempoEscondido = cerca ? 0 : tiempoEscondido + 1;
        if (tiempoEscondido > 420) {
          estrellas--;
          tiempoEscondido = 0;
          if (estrellas === 0) mostrarAviso("Perdiste a la policía", "Ya no te buscan", 150);
        }
        // ¿Te agarraron? (si te quedas quieto con una patrulla encima)
        let j = jugadorActual();
        let velocidad = j.carro ? Math.abs(j.carro.vel) : (tecla("ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyA", "KeyS", "KeyD") ? 2 : 0);
        let pegada = patrullas.some(c => Math.hypot(c.x - p.x, c.y - p.y) < 75);
        if (pegada && velocidad < 1.2) arresto++;
        else arresto = Math.max(0, arresto - 2);
        if (arresto > 120) teAgarraron();
      } else {
        arresto = 0;
      }
    }

    function teAgarraron() {
      let j = jugadorActual();
      let multa = Math.min(j.dinero, 200);
      j.dinero -= multa;
      if (misionActiva) fallarMision("Te agarró la policía");
      if (j.carro) { j.carro.conductor = null; j.carro.vel = 0; j.carro = null; }
      let casa = lugarPx(PERSONAJES[activo].casa);
      j.x = casa.x; j.y = casa.y;
      estrellas = 0;
      arresto = 0;
      carros = carros.filter(c => c.tipo !== "policia");
      camX = j.x; camY = j.y;
      guardar();
      mostrarAviso("¡TE AGARRÓ LA POLICÍA!", "Pagaste L. " + multa + " de multa y te mandaron a tu casa", 240);
    }

    // 13. CHOQUES ENTRE CARROS Y PEATONES
    // Cada carro se toma como un círculo; el bus (que es largo) como 3 círculos en fila
    function circulosDe(c) {
      if (c.tipo !== "bus") return [{ x: c.x, y: c.y }];
      let cos = Math.cos(c.ang), sin = Math.sin(c.ang);
      return [-30, 0, 30].map(o => ({ x: c.x + cos * o, y: c.y + sin * o }));
    }

    function chocarCarros() {
      for (let i = 0; i < carros.length; i++) {
        for (let k = i + 1; k < carros.length; k++) {
          let a = carros[i], b = carros[k];
          let lejos = (a.tipo === "bus" || b.tipo === "bus") ? 100 : 40;
          if (Math.abs(b.x - a.x) > lejos || Math.abs(b.y - a.y) > lejos) continue;
          // Buscar los dos círculos que más se están encimando
          let dx = 0, dy = 0, d = 99999;
          for (let ca of circulosDe(a)) for (let cb of circulosDe(b)) {
            let ddx = cb.x - ca.x, ddy = cb.y - ca.y, dd = Math.hypot(ddx, ddy);
            if (dd < d) { d = dd; dx = ddx; dy = ddy; }
          }
          const minimo = 34;
          if (d >= minimo || d === 0) continue;
          let nx = dx / d, ny = dy / d, empuje = (minimo - d) / 2;
          let impacto = Math.abs(a.vel) + Math.abs(b.vel);

          for (let [c, signo] of [[a, -1], [b, 1]]) {
            let x0 = c.x, y0 = c.y;
            c.x += nx * empuje * signo;
            c.y += ny * empuje * signo;
            if (carroChoca(c)) { c.x = x0; c.y = y0; }
          }
          a.vel *= 0.6;
          b.vel *= 0.6;

          let delJugador = a.conductor === "jugador" ? a : (b.conductor === "jugador" ? b : null);
          if (delJugador && impacto > 3.5) {
            let otro = delJugador === a ? b : a;
            temblor = 8;
            if (otro.ai) { otro.ai.espera = 60; decir(otro, ["¡Fíjese!", "¡PIIIP!", "¡Ay, mi carro!"][Math.floor(Math.random() * 3)], 90); }
            if (otro.conductor === "npc" || otro.tipo === "policia") subirEstrellas(1);
          }
        }
      }
    }

    function actualizarPeatones() {
      let p = posJugador();
      for (let pe of peatones) {
        // Solo mover a los que están cerca (para que el juego vaya rápido)
        if (Math.abs(pe.x - p.x) > 1400 || Math.abs(pe.y - p.y) > 1000) continue;

        if (pe.salto > 0) {
          pe.salto--;
          let nx = pe.x + pe.sx, ny = pe.y + pe.sy;
          if (!solidoPie(nx, ny)) { pe.x = nx; pe.y = ny; }
          continue;
        }

        // Esquivar carros que vienen rápido (nadie sale lastimado)
        for (let c of carros) {
          if (Math.abs(c.vel) < 1.8) continue;
          let d = Math.hypot(pe.x - c.x, pe.y - c.y);
          if (d < 48) {
            let ax = (pe.x - c.x) / (d || 1), ay = (pe.y - c.y) / (d || 1);
            pe.sx = ax * 4.5; pe.sy = ay * 4.5; pe.salto = 14;
            decir(pe, ["¡Cuidado!", "¡Ay!", "¡Fíjese por dónde va!", "¡Casi me atropella!"][Math.floor(Math.random() * 4)], 100);
            if (c.conductor === "jugador" && Math.abs(c.vel) > 4) subirEstrellas(1);
            break;
          }
        }
        if (pe.salto > 0) continue;

        // Caminar tranquilo
        pe.t--;
        let vel = pe.huyendo > 0 ? 2.6 : pe.vel;
        if (pe.huyendo > 0) pe.huyendo--;
        if (pe.t <= 0) {
          pe.ang = Math.floor(Math.random() * 4) * Math.PI / 2 + (Math.random() - 0.5) * 0.5;
          pe.t = 60 + Math.random() * 180;
        }
        let nx = pe.x + Math.cos(pe.ang) * vel, ny = pe.y + Math.sin(pe.ang) * vel;
        let letra = letraEnPixel(nx + Math.cos(pe.ang) * 10, ny + Math.sin(pe.ang) * 10);
        if (!solidoPie(nx, ny) && (CAMINABLE_PEATON.includes(letra) || pe.huyendo > 0)) {
          pe.x = nx; pe.y = ny;
          pe.paso += vel * 0.12;
        } else {
          pe.t = 0;
        }
      }
    }

    // 14. LA FAMILIA DEL CHEVEZ
    function posicionesFamilia() {
      let lista = [];
      let brinco = Math.abs(Math.sin(cuadro * 0.1)) * 2;
      if (familia.esposa === "casa") lista.push({ quien: "esposa", x: 11.4 * T, y: 32.2 * T, ang: Math.PI / 2 });
      if (familia.hijos === "casa") {
        lista.push({ quien: "hijo", x: (12.3 + Math.sin(cuadro * 0.02) * 0.6) * T, y: 33.2 * T - brinco, ang: cuadro * 0.02 });
        lista.push({ quien: "hija", x: 10.8 * T, y: (33.4 + Math.cos(cuadro * 0.025) * 0.4) * T, ang: -cuadro * 0.025 });
      } else if (familia.hijos === "escuela") {
        lista.push({ quien: "hijo", x: 42.3 * T, y: 18.2 * T - brinco, ang: Math.PI / 2 });
        lista.push({ quien: "hija", x: 43.8 * T, y: 18.4 * T, ang: Math.PI / 2 });
      }
      return lista;
    }

    function actualizarFamilia() {
      if (familia.volver > 0) {
        familia.volver--;
        if (familia.volver === 0 && familia.hijos === "escuela") familia.hijos = "casa";
      }
      if (cuadro % 200 !== 0) return;
      let p = posJugador();
      for (let f of posicionesFamilia()) {
        if (Math.hypot(f.x - p.x, f.y - p.y) > 180 || Math.random() < 0.4) continue;
        let frases;
        if (activo === 2) {
          frases = f.quien === "esposa" ? ["¡Hola mi amor!", "¿Y el mandado, Chevez?", "La comida ya está lista"]
                                        : ["¡Papá!", "¡Vamos a jugar!", "¿Me compra una churrita?"];
        } else {
          frases = f.quien === "esposa" ? ["Buenas, ¿busca al Chevez?", "El Chevez no está"] : ["¡Hola!", "¿Usted es amigo de mi papá?"];
        }
        decir(f, frases[Math.floor(Math.random() * frases.length)], 150);
      }
    }

    // 14b. ADENTRO DE LA CASA (presiona E en la puerta de tu casa)
    // Cada casa es una cuadrícula de letras, igual que la ciudad:
    //   #  pared                    p  puerta para salir
    //   m  piso de madera (sala)    c  azulejo (cocina)     b  baño
    //   a  alfombra (cuarto)        k  cuarto de los niños
    const CELDA = 40;   // tamaño de cada cuadro adentro de la casa
    const PLANOS = {
      normal: [
        "#################",
        "#aaaaa#bbb#ccccc#",
        "#aaaaa#bbb#ccccc#",
        "#aaaaa#bbb#ccccc#",
        "#aaaaa#bbb#ccccc#",
        "##mm####m###mmm##",
        "#mmmmmmmmmmmmmmm#",
        "#mmmmmmmmmmmmmmm#",
        "#mmmmmmmmmmmmmmm#",
        "#mmmmmmmmmmmmmmm#",
        "########p########"
      ],
      // La del Chevez es más grande: tiene un cuarto para los niños
      grande: [
        "######################",
        "#aaaaa#kkkk#bbb#ccccc#",
        "#aaaaa#kkkk#bbb#ccccc#",
        "#aaaaa#kkkk#bbb#ccccc#",
        "#aaaaa#kkkk#bbb#ccccc#",
        "##mm####mm###m###mmm##",
        "#mmmmmmmmmmmmmmmmmmmm#",
        "#mmmmmmmmmmmmmmmmmmmm#",
        "#mmmmmmmmmmmmmmmmmmmm#",
        "#mmmmmmmmmmmmmmmmmmmm#",
        "##########p###########"
      ]
    };
    const MARCO_CASA = ["⚽", "🚕", "👨‍👩‍👧‍👦", "🚌"];   // el cuadro colgado en la sala de cada uno

    // Los muebles (en cuadros). "piso: true" = se puede pasar por encima.
    function mueblesDe(grande) {
      let b = grande ? 12 : 7, c = grande ? 16 : 11, ancho = grande ? 22 : 17;
      let m = [
        { tipo: "cama", x: 1, y: 1, w: 2.2, h: 3, accion: "dormir" },
        { tipo: "mesita", x: 3.3, y: 1, w: 0.8, h: 0.8 },
        { tipo: "ropero", x: 4.3, y: 1, w: 1.6, h: 0.9 },
        { tipo: "inodoro", x: b + 0.15, y: 1.1, w: 0.8, h: 1 },
        { tipo: "ducha", x: b + 1.4, y: 1, w: 1.6, h: 1.6, accion: "ducha" },
        { tipo: "lavamanos", x: b + 2.1, y: 3.2, w: 0.9, h: 0.8 },
        { tipo: "refri", x: c, y: 1, w: 1, h: 1.1, accion: "comer" },
        { tipo: "estufa", x: c + 1.2, y: 1, w: 1.2, h: 0.8, accion: "cocinar" },
        { tipo: "meson", x: c + 2.6, y: 1, w: 2.4, h: 0.8 },
        { tipo: "mesa", x: c + 2.3, y: 2.9, w: 1.7, h: 1.1 },
        { tipo: "alfombra", x: 2.2, y: 6.6, w: 3.6, h: 2.8, piso: true },
        { tipo: "tele", x: 1, y: 7.1, w: 0.5, h: 1.8, accion: "tele" },
        { tipo: "mesitaCentro", x: 2.9, y: 7.5, w: 1, h: 1 },
        { tipo: "sofa", x: 4.6, y: 6.8, w: 1, h: 2.4, accion: "sentarse" },
        { tipo: "hamaca", x: ancho - 6.5, y: 7.3, w: 4.5, h: 1, accion: "hamaca", piso: true },
        { tipo: "planta", x: 1.1, y: 9.1, w: 0.75, h: 0.75 },
        { tipo: "planta", x: ancho - 1.85, y: 9.1, w: 0.75, h: 0.75 },
        { tipo: "planta", x: ancho - 1.85, y: 6.15, w: 0.75, h: 0.75 }
      ];
      if (grande) {
        m.push({ tipo: "camita", x: 7.1, y: 1, w: 1.1, h: 2, color: "#42a5f5" });
        m.push({ tipo: "camita", x: 9.8, y: 1, w: 1.1, h: 2, color: "#f48fb1" });
        m.push({ tipo: "pelota", x: 8.6, y: 3.6, w: 0.4, h: 0.4, piso: true });
      }
      // Punto donde salen los globitos de texto de cada mueble
      for (let o of m) o.ancla = { x: (o.x + o.w / 2) * CELDA, y: (o.y + o.h / 2) * CELDA, dentro: true };
      return m;
    }
    function ventanasDe(grande) {
      let c = grande ? 16 : 11, ancho = grande ? 22 : 17;
      let v = [{ x: 1.6, y: 0, w: 2, dir: 1 }, { x: c + 2.8, y: 0, w: 2, dir: 1 },
               { x: 2.5, y: 10, w: 2.4, dir: -1 }, { x: ancho - 5, y: 10, w: 2.4, dir: -1 }];
      if (grande) v.push({ x: 8, y: 0, w: 2, dir: 1 });
      return v;
    }

    let interior = null;   // la casa en la que estás adentro (o null)

    function entrarCasa() {
      let grande = activo === 2;
      let plano = grande ? PLANOS.grande : PLANOS.normal;
      let alto = plano.length, puerta = plano[alto - 1].indexOf("p");
      interior = {
        casa: activo, plano: plano, ancho: plano[0].length, alto: alto,
        muebles: mueblesDe(grande), ventanas: ventanasDe(grande),
        puerta: { x: (puerta + 0.5) * CELDA, y: (alto - 1) * CELDA },
        yo: { x: (puerta + 0.5) * CELDA, y: (alto - 1.6) * CELDA, ang: -Math.PI / 2, paso: 0, dentro: true },
        sentado: null, paradoEn: null, tele: 0, canal: 0, ducha: 0, estufa: 0, dormir: 0,
        fundido: 30, saliendo: 0, cerca: null, gente: []
      };
      if (grande) {
        if (familia.esposa === "casa") interior.gente.push({ quien: "esposa", x: 17.8 * CELDA, y: 2.4 * CELDA, ang: -Math.PI / 2, paso: 0, dentro: true });
        if (familia.hijos === "casa") {
          interior.gente.push({ quien: "hijo", x: 0, y: 0, ang: 0, paso: 0, dentro: true });
          interior.gente.push({ quien: "hija", x: 0, y: 0, ang: 0, paso: 0, dentro: true });
        }
      }
      estado = "casa";
      moverNinos();
      let hijo = interior.gente.find(g => g.quien === "hijo");
      if (hijo) decir(hijo, "¡Papá llegó!", 150);
    }

    function salirCasa() {
      burbujas = burbujas.filter(b => !b.obj.dentro);
      interior = null;
      estado = "jugando";
    }

    // ¿Hay pared o mueble en (px, py)?
    function solidoCasa(px, py) {
      const r = 13;
      for (let [x, y] of [[px - r, py], [px + r, py], [px, py - r], [px, py + r]]) {
        let fila = interior.plano[Math.floor(y / CELDA)];
        let l = fila ? fila[Math.floor(x / CELDA)] : undefined;
        if (l === undefined || l === "#") return true;
        for (let m of interior.muebles) {
          if (!m.piso && x > m.x * CELDA && x < (m.x + m.w) * CELDA && y > m.y * CELDA && y < (m.y + m.h) * CELDA) return true;
        }
      }
      return false;
    }

    function distanciaAMueble(m, px, py) {
      let x = m.x * CELDA, y = m.y * CELDA, w = m.w * CELDA, h = m.h * CELDA;
      return Math.hypot(Math.max(x - px, 0, px - x - w), Math.max(y - py, 0, py - y - h));
    }

    const TEXTO_ACCION = {
      dormir: "dormir (guarda el juego)", sentarse: "sentarte en el sofá", hamaca: "acostarte en la hamaca",
      comer: "abrir la refri", cocinar: "cocinar", ducha: "bañarte"
    };
    const NOMBRE_FAMILIA = { esposa: "tu esposa", hijo: "tu hijo", hija: "tu hija" };

    // Lo más cercano con lo que puedes hacer algo
    function cercaCasa() {
      let I = interior, yo = I.yo;
      if (I.sentado) return { texto: "levantarte" };
      if (Math.hypot(yo.x - I.puerta.x, yo.y - I.puerta.y) < 50) return { tipo: "puerta", texto: "salir de la casa" };
      for (let g of I.gente) {
        if (Math.hypot(g.x - yo.x, g.y - yo.y) < 55) return { tipo: "gente", obj: g, texto: "hablar con " + NOMBRE_FAMILIA[g.quien] };
      }
      let mejor = null, mejorDist = 26;
      for (let m of I.muebles) {
        if (!m.accion) continue;
        let d = distanciaAMueble(m, yo.x, yo.y);
        if (d < mejorDist) { mejor = m; mejorDist = d; }
      }
      if (!mejor) return null;
      let t = mejor.accion === "tele" ? (I.tele ? "apagar la tele" : "prender la tele") : TEXTO_ACCION[mejor.accion];
      return { tipo: "mueble", obj: mejor, texto: t };
    }

    const CANALES = ["📺 Noticias: ¡38 grados hoy en San Lorenzo!", "📺 ¡Gooool! Olimpia 2 - Motagua 1",
                     "📺 Telenovela: \"¡Tú no eres mi hijo, Ricardo!\"", "📺 Caricaturas a todo volumen",
                     "📺 Pronóstico: lluvia en el Golfo de Fonseca"];

    function sentarseEn(m, ang) {
      let I = interior;
      I.paradoEn = { x: I.yo.x, y: I.yo.y };
      I.sentado = m;
      I.yo.x = (m.x + m.w / 2) * CELDA;
      I.yo.y = (m.y + m.h / 2) * CELDA;
      I.yo.ang = ang;
    }
    function levantarse() {
      let I = interior;
      if (!I.sentado || I.dormir > 0) return;
      I.sentado = null;
      I.ducha = 0;
      I.yo.x = I.paradoEn.x;
      I.yo.y = I.paradoEn.y;
    }

    function interactuarCasa() {
      let I = interior, yo = I.yo;
      if (I.saliendo || I.dormir) return;
      let cerca = cercaCasa();
      if (!cerca) return;
      if (I.sentado) { levantarse(); return; }
      if (cerca.tipo === "puerta") { I.saliendo = 20; return; }
      if (cerca.tipo === "gente") {
        let g = cerca.obj;
        let frases = g.quien === "esposa" ? ["¡Hola mi amor!", "La comida ya está lista", "¿Y el mandado, Chevez?", "Lávate las manos antes de comer"]
                                          : ["¡Papá, juguemos!", "¡No me alcanzas!", "¿Me compra una churrita?", "¡Mire lo que dibujé!"];
        decir(g, frases[Math.floor(Math.random() * frases.length)], 150);
        return;
      }
      let m = cerca.obj;
      switch (m.accion) {
        case "dormir":
          sentarseEn(m, -Math.PI / 2);
          I.yo.y = (m.y + 0.9) * CELDA;
          I.dormir = 180;
          break;
        case "sentarse":
          sentarseEn(m, Math.PI);   // mirando hacia la tele
          decir(yo, "Ahh... qué rico descansar", 120);
          break;
        case "hamaca":
          sentarseEn(m, Math.PI / 2);
          decir(yo, "Aquí sí se está fresco 😎", 140);
          break;
        case "tele":
          I.tele = I.tele ? 0 : 1;
          if (I.tele) { I.canal = (I.canal + 1) % CANALES.length; decir(m.ancla, CANALES[I.canal], 200); }
          break;
        case "comer":
          decir(yo, ["¡Una baleada con todo!", "Unas tajadas con pollo 🍗", "¡Un fresco de horchata bien helado!", "Sopa de caracol de ayer 😋"][Math.floor(Math.random() * 4)], 150);
          break;
        case "cocinar":
          I.estufa = 360;
          decir(yo, "Echándole a los frijolitos...", 150);
          break;
        case "ducha":
          sentarseEn(m, Math.PI / 2);
          I.ducha = 240;
          decir(yo, "¡Qué fresquito! 🚿", 150);
          break;
      }
    }

    // Los hijos del Chevez juegan a la lleva en la sala
    function moverNinos() {
      let t = cuadro * 0.03;
      for (let g of interior.gente) {
        if (g.quien === "esposa") continue;
        let a = g.quien === "hijo" ? t : t - 0.9;
        let nx = (10 + Math.cos(a) * 2.2) * CELDA, ny = (8 + Math.sin(a) * 1.1) * CELDA;
        g.ang = Math.atan2(ny - g.y, nx - g.x);
        g.x = nx; g.y = ny;
        g.paso = cuadro * 0.3;
      }
    }

    function actualizarCasa() {
      let I = interior, yo = I.yo;
      if (I.fundido > 0) I.fundido--;
      for (let b of burbujas) b.t--;
      burbujas = burbujas.filter(b => b.t > 0);
      moverNinos();
      if (I.saliendo > 0) {
        if (--I.saliendo === 0) salirCasa();
        return;
      }

      // Dormir: la pantalla se pone negra y se guarda el juego
      if (I.dormir > 0) {
        I.dormir--;
        if (I.dormir === 90) {
          estrellas = 0;
          guardar();
          mostrarAviso("Dormiste como un bebé", "Juego guardado", 200);
        }
        if (I.dormir === 0) levantarse();
        I.cerca = cercaCasa();
        return;
      }
      if (I.tele) {
        I.tele++;
        if (I.tele % 420 === 0) {
          I.canal = (I.canal + 1) % CANALES.length;
          decir(I.muebles.find(m => m.accion === "tele").ancla, CANALES[I.canal], 200);
        }
      }
      if (I.estufa > 0) I.estufa--;
      if (I.ducha > 0 && --I.ducha === 0) levantarse();

      let dx = (tecla("ArrowRight", "KeyD") ? 1 : 0) - (tecla("ArrowLeft", "KeyA") ? 1 : 0);
      let dy = (tecla("ArrowDown", "KeyS") ? 1 : 0) - (tecla("ArrowUp", "KeyW") ? 1 : 0);
      if ((dx || dy) && I.sentado) levantarse();
      if ((dx || dy) && !I.sentado) {
        let largo = Math.hypot(dx, dy);
        let vel = tecla("ShiftLeft", "ShiftRight") ? 3 : 1.8;
        let nx = yo.x + dx / largo * vel, ny = yo.y + dy / largo * vel;
        if (!solidoCasa(nx, yo.y)) yo.x = nx;
        if (!solidoCasa(yo.x, ny)) yo.y = ny;
        yo.ang = Math.atan2(dy, dx);
        yo.paso += vel * 0.14;
      }
      // Caminar por la puerta = salir
      if (yo.y > (I.alto - 0.6) * CELDA) I.saliendo = 20;

      // La familia platica de vez en cuando
      if (cuadro % 240 === 0 && I.gente.length && Math.random() < 0.6) {
        let g = I.gente[Math.floor(Math.random() * I.gente.length)];
        let frases = g.quien === "esposa" ? ["¡Niños, no corran adentro!", "¿Quieres cafecito?", "Ya casi está la cena"]
                                          : ["¡Te agarré!", "¡No se vale!", "¡Jajaja!", "¡Mamá, él empezó!"];
        decir(g, frases[Math.floor(Math.random() * frases.length)], 130);
      }
      I.cerca = cercaCasa();
    }

    // 15. MISIONES
    // Cada misión tiene pasos: "ve a este lugar". Algunos pasos piden ir en carro.
    const MISIONES = [
      { id: "f1", personaje: 0, nombre: "Reparto de camarones", inicio: "marcaF1", recompensa: 400, tiempo: 120,
        intro: "Lleva la carga de camarón al Puerto de Henecán antes de que se eche a perder",
        pasos: [

          { texto: "Lleva los camarones al Puerto de Henecán", lugar: "puerto", carro: true }
        ] },
      { id: "f2", personaje: 0, nombre: "Carrera en la Panamericana", inicio: "gasolinera", recompensa: 600, tiempo: 70,
        intro: "Carrera por la CA-1: pasa por los 5 puntos antes de que se acabe el tiempo",
        pasos: [

    function empezarMision(m) {
      misionActiva = { m: m, paso: 0, tiempo: m.tiempo ? m.tiempo * 60 : 0 };
      mostrarAviso(m.nombre, m.intro, 300);
      if (m.alEmpezar === "policia") {
        enfriamientoEstrellas = 0;
        subirEstrellas(3);
      }
    }

    function hacerEvento(nombre) {
      let j = jugadorActual();
      let quien = j.carro || j;
      if (nombre === "subirHijos") { familia.hijos = "carro"; decir(quien, "Niños: ¡Vamos, papá!", 150); }
      if (nombre === "hijosEscuela") { familia.hijos = "escuela"; familia.volver = 1800; decir(quien, "Niños: ¡Adiós, papá!", 150); }
      if (nombre === "subirFamilia") { familia.esposa = "carro"; familia.hijos = "carro"; decir(quien, "¡Vámonos de paseo!", 150); }
      if (nombre === "familiaCabana") decir(quien, "Esposa: ¡Qué bonito el manglar!", 180);
      if (nombre === "familiaCasa") { familia.esposa = "casa"; familia.hijos = "casa"; }
      if (nombre === "mandadoListo") decir(quien, "Esposa: ¡Gracias, mi amor!", 150);
    }

    function actualizarMision() {
      let p = posJugador();
      let j = jugadorActual();
      if (!misionActiva) return;
      let mi = misionActiva;
      let paso = mi.m.pasos[mi.paso];

      if (mi.tiempo > 0) {
        mi.tiempo--;
        if (mi.tiempo === 0) { fallarMision("Se acabó el tiempo"); return; }
      }

      let cumplido;
      if (paso.tipo === "sinEstrellas") {
        cumplido = estrellas === 0 && cuadro % 2 === 0;
      } else {
        let l = lugarPx(paso.lugar);
        cumplido = Math.hypot(p.x - l.x, p.y - l.y) < (paso.radio || 60) && (!paso.carro || j.carro) &&
                   (!paso.bus || (j.carro && j.carro.tipo === "bus"));
      }
      if (!cumplido) return;

      if (paso.dice) decir(j.carro || j, paso.dice, 150);
      if (paso.evento) hacerEvento(paso.evento);
      mi.paso++;
      if (mi.paso >= mi.m.pasos.length) completarMision();
    }

    function completarMision() {
      let m = misionActiva.m;
      let j = jugadorActual();
      j.dinero += m.recompensa;
      if (!misionesHechas.includes(m.id)) misionesHechas.push(m.id);
      misionActiva = null;
      guardar();
      mostrarAviso("¡MISIÓN COMPLETADA!", m.nombre + "   + L. " + m.recompensa, 240);
    }

    function fallarMision(razon) {
      misionActiva = null;
      if (familia.esposa === "carro") familia.esposa = "casa";
      if (familia.hijos === "carro") familia.hijos = "casa";
      mostrarAviso("MISIÓN FALLIDA", razon, 200);
    }

    // 16. ACTUALIZAR TODO
    function actualizar() {
      let j = jugadorActual();
      if (j.carro) {
        manejar(j.carro);
        j.x = j.carro.x;
        j.y = j.carro.y;
      } else {
        if (vista3D) caminar3D(j);
        else caminar(j);
      }

      for (let c of carros) {
        if (c.conductor === "npc" && c.ai) actualizarTrafico(c);
        else if (c.tipo === "policia") actualizarPolicia(c);
        else if (c.conductor === null && Math.abs(c.vel) > 0.05) { c.vel *= 0.9; moverCarro(c); }
      }
      carros = carros.filter(c => !c.borrar);
      chocarCarros();
      actualizarPeatones();
      actualizarFamilia();
      actualizarBusqueda();
      actualizarMision();

      // Globitos y avisos
      for (let b of burbujas) b.t--;
      burbujas = burbujas.filter(b => b.t > 0);
      if (temblor > 0) temblor--;

      // Letrero del lugar donde estás
      let p = posJugador();
      if (cuadro % 20 === 0) {
        let z = zonaEn(p.x, p.y);
        if (z !== zonaActual) { zonaActual = z; zonaCuadros = 180; }
      }
      if (zonaCuadros > 0) zonaCuadros--;

      // Cámara: sigue al jugador y se aleja un poco al manejar rápido
      let adelantoX = j.carro ? Math.cos(j.carro.ang) * j.carro.vel * 18 : 0;
      let adelantoY = j.carro ? Math.sin(j.carro.ang) * j.carro.vel * 18 : 0;
      camX += (p.x + adelantoX - camX) * 0.1;
      camY += (p.y + adelantoY - camY) * 0.1;
      let zoomObjetivo = j.carro ? 1 - Math.min(0.3, Math.abs(j.carro.vel) / 7.5 * 0.3) : 1;
      zoom += (zoomObjetivo - zoom) * 0.05;
    }

    // 17. DIBUJAR EL MAPA UNA SOLA VEZ (en un lienzo aparte, para que el juego vaya rápido)
    const lienzoMapa = document.createElement("canvas");
    const lienzoMini = document.createElement("canvas");
    const lienzoSuelo = document.createElement("canvas");
    const MINI = 4;   // pixeles por cuadro en el minimapa
    const DETALLE = 2; // el mapa se pinta al doble de resolución para que se vea nítido en 1800p

    const COLOR_SUELO = { ".": "#6ab04c", "R": "#4a4a4a", "H": "#3b3b3b", ":": "#f1d18a", "~": "#1e88e5", "C": "#4db6ac",
                          "M": "#6ab04c", "P": "#cfc2b0", "Y": "#8bc34a", "D": "#9e9e9e", "d": "#8d6e63" };

    function prepararMapa() {
      lienzoMapa.width = COLUMNAS * T * DETALLE;
      lienzoMapa.height = FILAS * T * DETALLE;
      let g = lienzoMapa.getContext("2d");
      g.scale(DETALLE, DETALLE);   // se dibuja igual, pero con el doble de pixeles

      // Suelo de cada cuadro
      for (let y = 0; y < FILAS; y++) {
        for (let x = 0; x < COLUMNAS; x++) {
          let l = mapa[y][x];
          let px = x * T, py = y * T;
          g.fillStyle = COLOR_SUELO[l] || "#6ab04c";
          if (l === "~") g.fillStyle = y >= 43 ? "#1565c0" : (y >= 41 ? "#1976d2" : "#1e88e5");
          g.fillRect(px, py, T, T);

          if (l === ".") {
            g.fillStyle = "rgba(0, 0, 0, 0.07)";
            for (let i = 0; i < 6; i++) g.fillRect(px + azar() * T, py + azar() * T, 3, 3);
          }
          if (l === "P") {
            g.strokeStyle = "rgba(0, 0, 0, 0.08)";
            g.lineWidth = 1;
            g.strokeRect(px + 0.5, py + 0.5, T / 2, T / 2);
            g.strokeRect(px + T / 2 + 0.5, py + T / 2 + 0.5, T / 2 - 1, T / 2 - 1);
          }
          if (l === "d") {
            g.strokeStyle = "rgba(0, 0, 0, 0.25)";
            for (let i = 0; i < T; i += 10) { g.beginPath(); g.moveTo(px, py + i); g.lineTo(px + T, py + i); g.stroke(); }
          }
          if (l === "C") {
            g.strokeStyle = "#8d6e63";
            g.lineWidth = 4;
            g.strokeRect(px + 2, py + 2, T - 4, T - 4);
          }
          if (l === "M") {
            for (let i = 0; i < 5; i++) {
              g.fillStyle = i % 2 ? "#1b5e20" : "#2e7d32";
              g.beginPath();
              g.arc(px + azar() * T, py + azar() * T, 14 + azar() * 10, 0, Math.PI * 2);
              g.fill();
            }
          }
          // Acera junto a las calles
          if (l !== "R" && l !== "H" && l !== "~" && l !== "C" && l !== "M") {
            g.fillStyle = "#bdbdbd";
            if (esCalle(x - 1, y)) g.fillRect(px, py, 8, T);
            if (esCalle(x + 1, y)) g.fillRect(px + T - 8, py, 8, T);
            if (esCalle(x, y - 1)) g.fillRect(px, py, T, 8);
            if (esCalle(x, y + 1)) g.fillRect(px, py + T - 8, T, 8);
          }
          // Líneas de las calles
          if (l === "R") {
            let horizontal = esCalle(x - 1, y) || esCalle(x + 1, y);
            let vertical = esCalle(x, y - 1) || esCalle(x, y + 1);
            g.fillStyle = "#f5f5f5";
            if (horizontal && !vertical) { g.fillRect(px + 6, py + T / 2 - 1.5, 20, 3); g.fillRect(px + 38, py + T / 2 - 1.5, 20, 3); }
            if (vertical && !horizontal) { g.fillRect(px + T / 2 - 1.5, py + 6, 3, 20); g.fillRect(px + T / 2 - 1.5, py + 38, 3, 20); }
            if (horizontal && vertical) {
              // Paso de cebra en los cruces
              g.fillStyle = "rgba(255, 255, 255, 0.5)";
              for (let i = 6; i < T - 6; i += 10) { g.fillRect(px + i, py + 2, 5, 8); g.fillRect(px + i, py + T - 10, 5, 8); }
            }
          }
          if (l === "H") {
            g.fillStyle = "#f5f5f5";
            g.fillRect(px + 8, py + T / 2 - 1.5, 26, 3);             // línea de carriles
            if (letraEn(x, y - 1) !== "H") g.fillRect(px, py + 3, T, 3);   // orilla
            if (letraEn(x, y + 1) !== "H") g.fillRect(px, py + T - 6, T, 3);
            if (letraEn(x, y + 1) === "H") {                        // doble línea amarilla al centro
              g.fillStyle = "#fdd835";
              g.fillRect(px, py + T - 3, T, 2);
              g.fillRect(px, py + T + 1, T, 2);
            }
          }
        }
      }

      // Copia del suelo sin edificios: es el piso de la vista en primera persona (3D)
      lienzoSuelo.width = 4096;
      lienzoSuelo.height = 4096;
      lienzoSuelo.getContext("2d").drawImage(lienzoMapa, 0, 0, 4096, 4096);

      // Edificios
      for (let e of edificios) dibujarEdificio(g, e);
      // Adornos
      for (let a of adornos) dibujarAdorno(g, a);

      // Letreros grandes de lugares
      g.textAlign = "center";
      g.font = "bold 46px Arial";
      g.fillStyle = "rgba(255, 255, 255, 0.35)";
      g.fillText("GOLFO DE FONSECA", 30 * T, 45 * T);
      g.font = "bold 22px Arial";
      g.fillStyle = "rgba(255, 255, 255, 0.85)";
      letrero(g, "CAMARONERAS", 3.5 * T, 7.4 * T);
      letrero(g, "PUERTO DE HENECÁN", 56 * T, 28.7 * T);
      letrero(g, "PARQUE CENTRAL", 23.5 * T, 26.4 * T);
      letrero(g, "PASEO LA CABAÑA", 23.5 * T, 38.6 * T);
      letrero(g, "PLAZA PUERTO VIEJO", 40.5 * T, 38.6 * T);
      letrero(g, "CARRETERA PANAMERICANA CA-1", 32 * T, 3.4 * T);
      g.textAlign = "left";

      // Minimapa (cada cuadro es un puntito de color)
      lienzoMini.width = COLUMNAS * MINI;
      lienzoMini.height = FILAS * MINI;
      let m = lienzoMini.getContext("2d");
      const COLOR_MINI = { ".": "#4e8a3a", "R": "#dddddd", "H": "#ffd54f", ":": "#e6c878", "~": "#1565c0", "C": "#26a69a",
                           "M": "#1b5e20", "P": "#bcaaa4", "Y": "#7cb342", "D": "#9e9e9e", "d": "#8d6e63",
                           "#": "#616161", "h": "#795548", "I": "#fff8e1", "K": "#ef6c00", "E": "#4fc3f7", "G": "#e53935",
                           "X": "#8d6e63", "F": "#1e88e5", "W": "#fdd835", "V": "#e53935", "N": "#43a047" };
      for (let y = 0; y < FILAS; y++) {
        for (let x = 0; x < COLUMNAS; x++) {
          m.fillStyle = COLOR_MINI[mapa[y][x]] || "#4e8a3a";
          m.fillRect(x * MINI, y * MINI, MINI, MINI);
        }
      }
    }

    function letrero(g, texto, x, y) {
      g.lineWidth = 4;
      g.strokeStyle = "rgba(0, 0, 0, 0.6)";
      g.strokeText(texto, x, y);
      g.fillText(texto, x, y);
    }

    function aclarar(color, cantidad) {
      let n = parseInt(color.slice(1), 16);
      let r = Math.min(255, Math.max(0, (n >> 16) + cantidad));
      let v = Math.min(255, Math.max(0, ((n >> 8) & 255) + cantidad));
      let a = Math.min(255, Math.max(0, (n & 255) + cantidad));
      return "rgb(" + r + "," + v + "," + a + ")";
    }

    function dibujarEdificio(g, e) {
      let m = 6;   // margen para que se vea la acera
      let x = e.x * T + m, y = e.y * T + m, w = e.w * T - m * 2, h = e.h * T - m * 2;
      if (e.letra === "X") { m = 3; x = e.x * T + m; y = e.y * T + 14; w = e.w * T - m * 2; h = e.h * T - 28; }

      // Sombra
      g.fillStyle = "rgba(0, 0, 0, 0.25)";
      g.fillRect(x + 7, y + 7, w, h);

      if ("hFWVN".includes(e.letra)) {
        // Casa con techo de dos aguas
        g.fillStyle = aclarar(e.color, 25);
        g.fillRect(x, y, w, h / 2);
        g.fillStyle = aclarar(e.color, -25);
        g.fillRect(x, y + h / 2, w, h / 2);
        g.strokeStyle = aclarar(e.color, -60);
        g.lineWidth = 2;
        g.strokeRect(x, y, w, h);
        g.beginPath(); g.moveTo(x, y + h / 2); g.lineTo(x + w, y + h / 2); g.stroke();
        return;
      }

      g.fillStyle = e.color;
      g.fillRect(x, y, w, h);

      if (e.letra === "X") {
        // Contenedor con rayas
        g.strokeStyle = "rgba(0, 0, 0, 0.3)";
        g.lineWidth = 2;
        for (let i = x + 8; i < x + w; i += 10) { g.beginPath(); g.moveTo(i, y); g.lineTo(i, y + h); g.stroke(); }
        return;
      }

      // Techo
      g.fillStyle = aclarar(e.color, 20);
      g.fillRect(x + 8, y + 8, w - 16, h - 16);

      if (e.letra === "I") {
        // Iglesia: dos torres y una cruz
        g.fillStyle = "#e8e0c8";
        g.fillRect(x - 4, y + h - 40, 40, 44);
        g.fillRect(x + w - 36, y + h - 40, 40, 44);
        g.fillStyle = "#8d6e63";
        g.beginPath(); g.arc(x + 16, y + h - 18, 12, 0, Math.PI * 2); g.arc(x + w - 16, y + h - 18, 12, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#6d4c41";
        g.fillRect(x + w / 2 - 4, y + 12, 8, 50);
        g.fillRect(x + w / 2 - 18, y + 24, 36, 8);
      }
      if (e.letra === "K") {
        // Mercado: toldos de colores
        for (let i = 0; i < w; i += 24) {
          g.fillStyle = (i / 24) % 2 === 0 ? "#ffeb3b" : "#43a047";
          g.fillRect(x + i, y + h - 18, 24, 18);
          g.fillStyle = (i / 24) % 2 === 0 ? "#e53935" : "#1e88e5";
          g.fillRect(x + i, y, 24, 14);
        }
      }
      if (e.letra === "G") {
        g.fillStyle = "#e53935";
        g.fillRect(x, y + h - 8, w, 8);
      }
      if (e.letra === "#") {
        // Aires acondicionados en el techo
        g.fillStyle = "rgba(0, 0, 0, 0.18)";
        for (let i = 0; i < 3; i++) g.fillRect(x + 16 + i * 26, y + 16, 16, 12);
      }

      if (e.nombre) {
        g.textAlign = "center";
        g.font = "bold 18px Arial";
        g.fillStyle = "#fff";
        letrero(g, e.nombre, x + w / 2, y + h / 2 + 6);
        g.textAlign = "left";
      }
    }

    function dibujarAdorno(g, a) {
      if (a.tipo === "arbol") {
        g.fillStyle = "rgba(0, 0, 0, 0.2)";
        g.beginPath(); g.arc(a.x + 6, a.y + 6, 20, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#2e7d32";
        g.beginPath(); g.arc(a.x, a.y, 20, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#43a047";
        g.beginPath(); g.arc(a.x - 5, a.y - 5, 12, 0, Math.PI * 2); g.fill();
      } else if (a.tipo === "palmera") {
        g.fillStyle = "rgba(0, 0, 0, 0.2)";
        g.beginPath(); g.arc(a.x + 8, a.y + 8, 16, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#2e7d32";
        g.lineWidth = 6;
        g.lineCap = "round";
        for (let i = 0; i < 6; i++) {
          let ang = i * Math.PI / 3 + a.x;
          g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(a.x + Math.cos(ang) * 22, a.y + Math.sin(ang) * 22); g.stroke();
        }
        g.lineCap = "butt";
        g.fillStyle = "#795548";
        g.beginPath(); g.arc(a.x, a.y, 5, 0, Math.PI * 2); g.fill();
      } else if (a.tipo === "tiburon") {
        pedestal(g, a.x, a.y);
        g.fillStyle = "#78909c";
        g.beginPath(); g.ellipse(a.x, a.y, 34, 12, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.moveTo(a.x - 30, a.y); g.lineTo(a.x - 46, a.y - 14); g.lineTo(a.x - 46, a.y + 14); g.fill();   // cola
        g.beginPath(); g.moveTo(a.x - 4, a.y - 8); g.lineTo(a.x + 6, a.y - 26); g.lineTo(a.x + 12, a.y - 8); g.fill();  // aleta
        g.fillStyle = "#111"; g.beginPath(); g.arc(a.x + 22, a.y - 3, 2.5, 0, Math.PI * 2); g.fill();
      } else if (a.tipo === "camaron") {
        pedestal(g, a.x, a.y);
        g.strokeStyle = "#ff8a65";
        g.lineWidth = 14;
        g.lineCap = "round";
        g.beginPath(); g.arc(a.x, a.y, 20, -0.3, Math.PI * 1.3); g.stroke();
        g.strokeStyle = "#ffab91";
        g.lineWidth = 2;
        g.beginPath(); g.moveTo(a.x + 20, a.y - 4); g.lineTo(a.x + 42, a.y - 22); g.moveTo(a.x + 18, a.y - 8); g.lineTo(a.x + 34, a.y - 30); g.stroke();
        g.lineCap = "butt";
      } else if (a.tipo === "pelicano") {
        pedestal(g, a.x, a.y);
        g.fillStyle = "#fafafa";
        g.beginPath(); g.ellipse(a.x, a.y + 4, 16, 22, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(a.x, a.y - 20, 9, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#ffa000";
        g.beginPath(); g.moveTo(a.x + 6, a.y - 22); g.lineTo(a.x + 36, a.y - 14); g.lineTo(a.x + 6, a.y - 14); g.fill();
      } else if (a.tipo === "grua") {
        g.strokeStyle = "#fbc02d";
        g.lineWidth = 8;
        g.strokeRect(a.x - 20, a.y - 20, 40, 40);
        g.beginPath(); g.moveTo(a.x - 20, a.y - 20); g.lineTo(a.x + 20, a.y + 20); g.moveTo(a.x + 20, a.y - 20); g.lineTo(a.x - 20, a.y + 20); g.stroke();
        g.fillStyle = "#f9a825";
        g.fillRect(a.x - 8, a.y - 110, 16, 110);
      } else if (a.tipo === "barco") {
        g.fillStyle = "rgba(0, 0, 0, 0.25)";
        g.fillRect(a.x + 10, a.y + 10, 250, 170);
        g.fillStyle = "#37474f";
        g.beginPath();
        g.moveTo(a.x, a.y); g.lineTo(a.x + 230, a.y); g.lineTo(a.x + 270, a.y + 85); g.lineTo(a.x + 230, a.y + 170); g.lineTo(a.x, a.y + 170);
        g.closePath(); g.fill();
        const colores = ["#e53935", "#1e88e5", "#43a047", "#fb8c00"];
        for (let i = 0; i < 4; i++) for (let k = 0; k < 3; k++) {
          g.fillStyle = colores[(i + k) % 4];
          g.fillRect(a.x + 60 + i * 40, a.y + 20 + k * 45, 34, 38);
        }
        g.fillStyle = "#eceff1";
        g.fillRect(a.x + 10, a.y + 40, 40, 90);
      }
    }
    function pedestal(g, x, y) {
      g.fillStyle = "#9e9e9e";
      g.beginPath(); g.arc(x, y, 44, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#bdbdbd";
      g.beginPath(); g.arc(x, y, 38, 0, Math.PI * 2); g.fill();
    }

    // 18. DIBUJAR PERSONAS Y CARROS
    function rectRedondo(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Persona vista desde arriba. "ropa" tiene los colores y detalles.
    function dibujarPersona(x, y, ang, paso, ropa) {
      let esc = ropa.escala || 1, ancho = ropa.ancho || 1;
      ctx.save();
      ctx.translate(x, y);
      // sombra
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.beginPath(); ctx.ellipse(3, 4, 10 * esc, 12 * esc * ancho, ang, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(ang);
      ctx.scale(esc, esc);
      let mov = Math.sin(paso) * 5;
      // pies
      ctx.fillStyle = "#212121";
      ctx.beginPath();
      ctx.ellipse(mov, -5 * ancho, 4, 3, 0, 0, Math.PI * 2);
      ctx.ellipse(-mov, 5 * ancho, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      // brazos
      ctx.fillStyle = ropa.piel;
      ctx.beginPath();
      ctx.arc(-mov * 0.6, -12 * ancho, 3.2, 0, Math.PI * 2);
      ctx.arc(mov * 0.6, 12 * ancho, 3.2, 0, Math.PI * 2);
      ctx.fill();
      // hombros (camisa)
      ctx.fillStyle = ropa.camisa;
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 11 * ancho, 0, 0, Math.PI * 2); ctx.fill();
      if (ropa.vestido) {
        ctx.beginPath(); ctx.ellipse(-3, 0, 9, 12, 0, 0, Math.PI * 2); ctx.fill();
      }
      // cabeza
      ctx.fillStyle = ropa.piel;
      ctx.beginPath(); ctx.arc(1, 0, 6.5, 0, Math.PI * 2); ctx.fill();
      // pelo o gorra
      if (ropa.gorra) {
        ctx.fillStyle = ropa.gorra;
        ctx.beginPath(); ctx.arc(0, 0, 6.8, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(3, -4.5, 7, 9);   // visera hacia adelante
      } else {
        ctx.fillStyle = ropa.pelo;
        ctx.beginPath(); ctx.arc(-0.5, 0, 6.3, Math.PI * 0.45, Math.PI * 1.55); ctx.fill();
        if (ropa.pelolargo) { ctx.beginPath(); ctx.ellipse(-6, 0, 5, 6, 0, 0, Math.PI * 2); ctx.fill(); }
      }
      if (ropa.bigote) {
        ctx.strokeStyle = "#2b1b0e";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(6, -3); ctx.quadraticCurveTo(8, 0, 6, 3); ctx.stroke();
      }
      if (ropa.lentes) {
        ctx.fillStyle = "#111";
        ctx.fillRect(4.5, -4.5, 2.5, 3.5);
        ctx.fillRect(4.5, 1, 2.5, 3.5);
      }
      ctx.restore();
    }

    function dibujarCarro(c) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.ang);
      let w = c.w, h = c.h;
      // sombra
      ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
      rectRedondo(-w / 2 + 3, -h / 2 + 4, w, h, 6);
      ctx.fill();
      // carrocería
      ctx.fillStyle = c.color;
      rectRedondo(-w / 2, -h / 2, w, h, 6);
      ctx.fill();
      if (c.tipo === "policia") {
        ctx.fillStyle = "#212121";
        ctx.fillRect(-w / 2 + 12, -h / 2, w - 24, 5);
        ctx.fillRect(-w / 2 + 12, h / 2 - 5, w - 24, 5);
      }
      if (c.tipo === "pickup") {
        ctx.fillStyle = aclarar(c.color, -40);
        ctx.fillRect(-w / 2 + 3, -h / 2 + 3, 20, h - 6);   // la paila de atrás
      }
      if (c.tipo === "bus") {
        // Bus: techo blanco con franjas, ventanas a los lados y parabrisas grande
        ctx.fillStyle = "#fafafa";
        ctx.fillRect(-w / 2 + 4, -h / 2 + 4, w - 12, h - 8);
        ctx.fillStyle = c.color;
        ctx.fillRect(-w / 2 + 4, -2, w - 12, 4);
        ctx.fillStyle = "#263238";
        for (let x = -w / 2 + 8; x < w / 2 - 14; x += 12) {
          ctx.fillRect(x, -h / 2, 9, 3);
          ctx.fillRect(x, h / 2 - 3, 9, 3);
        }
        ctx.fillRect(w / 2 - 7, -h / 2 + 3, 5, h - 6);
        ctx.fillStyle = "#fff59d";
        ctx.fillRect(w / 2 - 3, -h / 2 + 2, 3, 6);
        ctx.fillRect(w / 2 - 3, h / 2 - 8, 3, 6);
        if (c.conductor && c.conductor !== "policia") {
          ctx.fillStyle = "#3e2723";
          ctx.beginPath(); ctx.arc(w / 2 - 14, -h / 4, 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
        return;
      }
      // vidrios
      ctx.fillStyle = "#263238";
      ctx.fillRect(w / 2 - 17, -h / 2 + 3, 7, h - 6);                  // parabrisas
      if (c.tipo !== "pickup") ctx.fillRect(-w / 2 + 5, -h / 2 + 4, 5, h - 8);   // vidrio de atrás
      // techo
      ctx.fillStyle = aclarar(c.color.startsWith("#") ? c.color : "#888888", 25);
      ctx.fillRect(-w / 2 + (c.tipo === "pickup" ? 25 : 11), -h / 2 + 4, 16, h - 8);
      // luces
      ctx.fillStyle = "#fff59d";
      ctx.fillRect(w / 2 - 3, -h / 2 + 2, 3, 5);
      ctx.fillRect(w / 2 - 3, h / 2 - 7, 3, 5);
      ctx.fillStyle = "#e53935";
      ctx.fillRect(-w / 2, -h / 2 + 2, 3, 5);
      ctx.fillRect(-w / 2, h / 2 - 7, 3, 5);
      if (c.tipo === "policia") {
        let prende = Math.floor(cuadro / 8) % 2 === 0;
        ctx.fillStyle = prende ? "#ff1744" : "#2979ff";
        ctx.fillRect(-4, -h / 2 + 3, 6, h / 2 - 3);
        ctx.fillStyle = prende ? "#2979ff" : "#ff1744";
        ctx.fillRect(-4, 0, 6, h / 2 - 3);
      }
      if (c.tipo === "taxi") {
        ctx.fillStyle = "#212121";
        ctx.fillRect(-2, -5, 10, 10);
        ctx.fillStyle = "#fdd835";
        ctx.font = "bold 6px Arial";
        ctx.save(); ctx.rotate(Math.PI / 2); ctx.fillText("TAXI", -7, -2); ctx.restore();
      }
      // Alguien manejando
      if (c.conductor && c.conductor !== "policia") {
        ctx.fillStyle = "#3e2723";
        ctx.beginPath(); ctx.arc(3, -5, 4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      // Luces de la patrulla alumbrando
      if (c.tipo === "policia") {
        let prende = Math.floor(cuadro / 8) % 2 === 0;
        ctx.fillStyle = prende ? "rgba(255, 23, 68, 0.15)" : "rgba(41, 121, 255, 0.15)";
        ctx.beginPath(); ctx.arc(c.x, c.y, 60, 0, Math.PI * 2); ctx.fill();
      }
    }
